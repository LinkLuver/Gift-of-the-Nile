  meroe_start:0 "#t Meroe#!\nDifficulty: #Y Normal#!\n\n$kushite_heritage_desc$"
  ghadames_start:0 "#t Ghadames#!\nDifficulty: #y Normal#!\n\n$Ghadames, the last true claimant to the Garamantean throne, is now ready to rebuild the kingdom that has been buried under sand.$"
  

  #Persiapotamia-India
  media_start:0 "#t Median Empire#!\nDifficulty: #Y Hard#!\n\n$atropatenian_heritage_desc$"
  assyria_start:0 "#t Assyria#!\nDifficulty: #Y Hard#!\n\nOnce the most powerful empire in the world, the mighty Assyrian empire has been falling apart due to numerous revolts and wars. Now, it seems the Assyrians have the chance to restore their once glorious realm."
  elam_start:0 "#t Elam#!\nDifficulty: #Y Normal#!\n\n$elam_heritage_desc$"
  babylon_start:0 "#t Babylonia#!\nDifficulty: #Y Normal#!\n\n$seleucus_heritage_desc$"
  persia_start:0 "#t Achaemenid Kingdom#!\nDifficulty: #Y Normal#!\n\n$heritage_of_persis_desc$"
  hanigalbat_start:0 "#t Hanigalbat#!\nDifficulty: #Y Hard#!\n\nThe ambitions of Hiketas, the self-proclaimed 'chosen of Assur' may clash with his noblemen, who have a different idea in mind for Hanigalbat. Will the 'chosen of Assur' prove his worth, or will Hanigalbat go a different path?"
  carduene_start:0 "#t Carduene #!\nDifficulty: #y Hard#!\n\n$qardu_heritage_desc$"

  #Western Med
  massalia_start:0 "#t Massalia#!\nDifficulty: #y Normal#!\n\n$Massaliot ambitions are growing by the day. Krateros Boukelid seeks to establish a new Greek realm in Gaul, no matter the cost. However, the free Massaliot republics maintain their staunch opposition to his cause. War will surely come...n.$"
  faliscan_start:0 "#t Faliscan League#!\nDifficulty: #y Normal#!\n\n$A newly created power, the Faliscan League has just begun to consolidate their hold over the Latin cities. This rising power may soon butt heads with the Etruscan states of the north, and the scheming Latins, who wish to reclaim Roma.n.$"
  carthage_start:0 "#t Carthage#!\nDifficulty: #y Hard#!\n\n$carthaginian_heritage_desc$"
