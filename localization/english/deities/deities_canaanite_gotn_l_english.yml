l_english:
 
 deity_astarte_bast:0 "$omen_astarte_bast$"
 omen_astarte_bast:0 "Ashtarte-Bast"
 omen_astarte_bast_desc:0 "#Y Alashiyan Goddess#! \nKnown as the Goddess of Kittens, she imbues the young with the ability of warfare and discipline while promoting parental values to those who would raise said young. She is a protective Goddess with a cult center found in the Tyrion Alashiyan colony of Kition. She is a syncretic Goddess between the deities of war, Astarte and Bastet. It is only fitting that her cult center is a place of unusual unity between Kemetic believers and Canaanite believers."
 deity_eshmun_melqart:0 "$omen_eshmun_melqart$"
 omen_eshmun_melqart:0 "Eshmun-Melqart"
 omen_eshmun_melqart_desc:0 "#Y Canaanite God#! \nThe great wandering Lord Eshmun-Melqart will bring health and riches to all our realm. With his vast knowledge of nature's wild and varied gifts, the god will protect our people from the ravages of disease and time.\n\nEshmun-Melqart is a syncretization of the deities Eshmun and Melqart. He is worshipped solely by the inhabitants of Ibasim."