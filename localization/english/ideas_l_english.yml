l_english:
 ##Military Ideas
 idea_martial_ethos:0 "Martial Ethos"
 idea_martial_ethos_desc:0 "Since the days of our fathers, and their fathers before them, the rule of the blade has been law."
 idea_thalassocracy:0 "Thalassocracy"
 idea_thlassocracy_desc:0 "The sea affects the very rise and fall of empires. Dominance in this theater is vital to our interests."
 idea_elite_soldiers:0 "Elite Soldiery"
 idea_elite_soldiers_desc:0 "Over-reliance on a reactionary militia leaves a nation at great risk of invasion, coup, or collapse. A well trained standing army, si sure to protect against these threats."
 idea_permanent_shipyards:0 "Permanent Shipyards"
 idea_permanent_shipyards_desc:0 "Establishment of permanent shipyards, capable of constructing vessels of war, will ensure that skilled shipwrights are always at our beck and call."
 idea_conscription:0 "Conscription"
 idea_conscription_desc:0 "Mandated military service for all those considered mature, it is not only a duty - it is a privilege."
 idea_military_society:0 "Militarized Society"
 idea_military_society_desc:0 ""
 idea_retreat:0 "Retreat"
 idea_retreat_desc:0 "Sometimes, the best path to victory is backwards."
 idea_siege_training:0 "Siege Training"
 idea_siege_training_desc:0 "By specializing our soldiers in siege tactics and warfare, we will be better suited to overwhelm the fortresses and strongholds of our enemies."
 idea_triumph:0 "Support of the People"
 idea_triumph_desc:0 "Convincing our citizens of our national prowess is just as important as victory itself. "
#Civic Ideas
 idea_standard_construction:0 "Standardized Construction"
 idea_standard_construction_desc:0 "As our nation begins to require more and more civic buildings, it has become apparent that a standardized method of planning and construction would greatly reduce the cost and time invested."
 idea_city_plan:0 "City Planning"
 idea_city_plan_desc:0 "Haphazardly fitting buildings within a walled city becomes much more of an issue as population sizes grow. Adopting a grid-based apporach to city planning will allow us to better account for available building space."
 idea_forums:0 "Work to Resolve Staseis"
 idea_forums_desc:0 "Staseis - factionalism among the polites - was already a recurring issue across Hellas, and the war has only made this worse. We must do what we can to reunite our community."
 idea_complex_tariffs:0 "Encourage the Kápêloi"
 idea_complex_tariffs_desc:0 "The kápêloi are merchants who make the barter and sale of their goods their full-time occupation. So long as they keep the commerce flowing, they have a place in our polis."
 idea_trading_posts:0 "Conscript the Epheboi"
 idea_trading_posts_desc:0 "Though young men and boys are not normally expected to serve the polis as a citizen-soldier, these are unprecedented times. Promises of glory and honor will secure them."
 idea_tariff_exceptions:0 "Distribute Sitos Reserves"
 idea_tariff_exceptions_desc:1 "In war and peace alike, the harvests continue, but with manpower emptied from the fields, our polites grow anxious. A redistribution of our reserves should reassure them... for now."
 idea_tax_farming:0 "Dispatch Loyal Theoroi"
 idea_tax_farming_desc:0 "These sacred ambassadors are well positioned to report the secrets of their hosting poleis back to us - discretely, of course, for misuing this sacred office would offend the pious."
 idea_land_appropriation:0 "x"
 idea_land_appropriation_desc:0 "x"
 idea_grain_admin:0 "x"
 idea_grain_admin_desc:0 "x"
 #Oratory Ideas
 idea_bribery:0 "Honor the Strategoi"
 idea_bribery_desc:0 "The strategoi hold a simple kind of power - men follow them into war, and thus may thereafter follow them into rebellion if they will it. We must keep them under control."
 idea_smear:0 "Subsidize the Trierarkhia"
 idea_smear_desc:0 "The trierarkhia is not popular with those assigned to it, and if we hope to prevent a breakdown at the highest level of our naval command, we must be willing to cut the costs."
 idea_legislative_reform:0 "x"
 idea_legislative_reform_desc:0 "x"
 idea_mil_admin:0 "Denounce Húbris"
 idea_mil_admin_desc:0 "Húbris is the irreligious aspiration to rival the gods - which, more importantly, could also lead one to rival us. We would do well to denounce this trait and all who overtly display it."
 idea_patron_scholars:0 "Promote Political Plays"
 idea_patron_scholars_desc:0 "Though most theater performances center on religious themes, the popularity of political themes in this new medium is undeniable. There may be much for us to gain in that."
 idea_functional_admin:0 "Collect Hellenic Histories"
 idea_functional_admin_desc:0 "x"
