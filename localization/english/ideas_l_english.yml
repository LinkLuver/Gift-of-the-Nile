l_english:
 ##Military Ideas
 idea_martial_ethos:0 "Martial Ethos"
 idea_martial_ethos_desc:0 "Since the days of our fathers, and their fathers before them, the rule of the blade has been law."
 idea_thalassocracy:0 "Thalassocracy"
 idea_thlassocracy_desc:0 "The sea affects the very rise and fall of empires. Dominance in this theater is vital to our interests."
 idea_elite_soldiers:0 "Elite Soldiery"
 idea_elite_soldiers_desc:0 "Over-reliance on a reactionary militia leaves a nation at great risk of invasion, coup, or collapse. A well trained standing army, si sure to protect against these threats."
 idea_permanent_shipyards:0 "Permanent Shipyards"
 idea_permanent_shipyards_desc:0 "Establishment of permanent shipyards, capable of constructing vessels of war, will ensure that skilled shipwrights are always at our beck and call."
 idea_conscription:0 "Conscription"
 idea_conscription_desc:0 "Mandated military service for all those considered mature, it is not only a duty - it is a privilege."
 idea_military_society:0 "Militarized Society"
 idea_military_society_desc:0 ""
 idea_retreat:0 "Retreat"
 idea_retreat_desc:0 "Sometimes, the best path to victory is backwards."
 idea_siege_training:0 "Siege Training"
 idea_siege_training_desc:0 "By specializing our soldiers in siege tactics and warfare, we will be better suited to overwhelm the fortresses and strongholds of our enemies."
 idea_triumph:0 "Support of the People"
 idea_triumph_desc:0 "Convincing our citizens of our national prowess is just as important as victory itself. "
#Civic Ideas
 idea_standard_construction:0 "Standardized Construction"
 idea_standard_construction_desc:0 "As our nation begins to require more and more civic buildings, it has become apparent that a standardized method of planning and construction would greatly reduce the cost and time invested."
 idea_city_plan:0 "City Planning"
 idea_city_plan_desc:0 "Haphazardly fitting buildings within a walled city becomes much more of an issue as population sizes grow. Adopting a grid-based apporach to city planning will allow us to better account for available building space."
