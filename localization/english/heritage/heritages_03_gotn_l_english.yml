l_english:
 #Egyptian Heritages
 aten_heritage:0 "Heritage of the 27th Dynasty"
 aten_heritage_desc:0 "Founded by the Prophet of the Aten, Atenkheper I, the 27th Dynasty was initially successful in its reinstatement of the Aten as the only true God of the Nile. Since its founding, the Pharaohs of the 27th have fallen far from her golden age, facing against rebel dynasties in either direction."
 henen_heritage:0 "Heritage of the 28th Dynasty"
 henen_heritage_desc:0 "Founded in the wake of political turmoil during the 27th Dynasty, the 28th dynasty was founded as a Faiyumic contender to the hardline Atenists in Akhetaton. However, the Nomarch of Menfer would betray the Phaoroah in Henen-Hesut, resulting in a collapse of control over the Delta region."
 hetan_heritage:0 "Heritage of the White Sands"
 hetan_heritage_desc:0 "The Hetan people, or the people of the white sands, have lived in their Oases, head of which in Farafra, have lived in the harsh conditions of the desert for hundreds of years. Their way of life remains unchanged even in the period of chaos they find themselves in now. With Khonsu as their witness, the moon glistens over the cold white sands brightly."
 deshretic_heritage:0 "Heritage of the Red Sands"
 deshretic_heritage_desc:0 "The Deshretic people, or the people of the red sands, find their homes between the rich oases of Sekht-Am and Farafra. The people are a heavy mix of Libyan and Oasitae Egyptians, resulting in an unruly and fierce warrior culture. They recently conquered Farafra and have had a taste of the sweet nectar and riches that they may look to rule over themselves."
 siwa_heritage:0 "Heritage of Siwa"
 siwa_heritage_desc:0 "The priests of Amun-Ra in Sekht-Am, or Siwa, have always remained under Pharonic control. The region of Siwa refers to not just the main Oasis of Sekht-Am, but also the nearby oases just north of the city. These oasis people, now, far from the ruling houses of Egypt, the Siwan Oases have to fend for themselves against both rival Egyptians and invading Libyans from the North, East, West, and South."
 sobek_aten_heritage:0 "Heritage of Sobek-Aten"
 sobek_aten_heritage_desc:0 "The Faiyumic people were amongst the first to accept the Aten, however, their belief of the Aten was syncrotized with their beloved Crocodilian god, Sobek. Sobek-Aten became the result of this fusion, giving the Faiyumic people their own special branch of Atenic faith, one where Sobek-Aten is the supreme Crocodile of Light."
 memphis_heritage:0 "Heritage of Memphis"
 memphis_heritage_desc:0 "Menfer Nome is only the most recent addition in the long legacy of states ruled from the city of Ptah. It has been the home to many other Nomarchs, Pharaohs, and golden ages of Egypt in its own right, and the newest state of Menfer is poised to brith a new era centered around the historic city."
 tenuwan_heritage:0 "Heritage of the Green Sea Merchants"
 tenuwan_heritage_desc:0 "While the majority of Egypt falls to chaos, the crafty merchants of the Green Sea see opportunity. Renouncing themselves as a Nomarchy severs their ties to a Pharonic rule, but opens up traderoutes with all who desire the riches of the Mediterranian."
 sais_heritage:0 "Heritage of Sais"
 sais_heritage_desc:0 "The city of Sao finds itself surronded by all sides by rebelling petty Nomarchs. Sao itself was home to many of the later Dynasties of Egypt, especially notable is the 26th Dynasty that was overthrown by the treacherous Atenic 27th Dynasty. Perhaps it is destiny for Sao to once again save Egypt from Isfet."
 mafkat_heritage:0 "Heritage of Turquoise Miners"
 mafkat_heritage_desc:0 "The miners of Mafkat, after the chaotic collapse of centralized authorities, find themselves far from any so called 'Dynasty' of Egypt. Thus, the Republic of Mafkat Khetiu was created, and the resulting state found itself a mix of native Arabian peoples and Egyptian workers. Their metalwork is exceptional and their blue stones are sold all throughout the seas at a bargain. In Mafkat Khetiu, they say that Turquoise is worth less than grain!"
 medjed_heritage:0 "Heritage of Medjed"
 medjed_heritage_desc:0 "Per-Medjed is a city dedicated to the mysterious god of death rites known as Medjed. He is said to protect the city even in spite of the Atenic presence that dominates it now. In fact, despite Atenism usually being opposed to local Kemetic deities, the exception is Per-Medjed Nome. Medjed coexists with their belief of the Aten, justified as Medjed existing in an area with no sun, under his veil, and in the Duat."
 peramun_heritage:0 "Heritage of the Gate to Egypt"
 peramun_heritage_desc:0 "The fortress of Per-Amun stands formidably between the easternmost edge of the black soils of Kemet and the barbarous lands of the Hyksos. As a result, the Nomarch of Per-Amun historically enjoyed a high stipend, but that all ended with the collapse of centralized authority. Still, the fortress stands and so too does Per-Amun's commitment as the gateway to Egypt."
 hyksos_heritage:0 "Heritage of the Neo-Hyksos"
 hyksos_heritage_desc:0 "Long, long after the collapse of the Age of Bronze, the Hyksos, or Phillistines, integrated themselves into the culture of the southern levant. However, during the heights of Late Kingdom Egypt, they were once more dubbed as Hyksos as they came under Egyptian influence. These 'Neo-Hyksos' have remained within the Egyptian sphere of influence even after the collapse of central authority. Whether or not they are descendents of the original Hyksos, their culture has deviated much from their Canaanite siblings to the north."
 bastet_heritage:0 "Heritage of the Temple of Cats"
 bastet_heritage_desc:0 "Per-Bastet Nome is known through the Delta as the site of the Great Temple of Bastet. The cat goddess is one of the most important among Kemetic worshippers, representing protection, perfume, warfare, arts, and of course, cats. Strolling through the streets of Per-Bastet, one can expect to see many of Bastet's children skimperring around, often being given treats by priests and working citizens alike."
 iunu_heritage:0 "Heritage of the Pillars of Atum"
 iunu_heritage_desc:0 "The city of Awnu, also called Iunu, is famous for two landmarks. The Pillars of Atum, representing the primary cult-site for the great god of creation, and also the Wetjes Aten, a beautiful temple dedicated to the Aten, translated as 'The Elevated Aten,' built by Akhenaten himself. Both Atum and Aten are worshipped in the city, but it is certainly safe to say the Aten has taken over the majority of the identity that was once associated with Atum."
 huwaret_heritage:0 "Heritage of Avaris"
 huwaret_heritage_desc:0 "The Avarites were once known as enemies and foreigners to Egypt, but by now, the Avarites represents a slew of eastern Deltan Egyptians. The city of Avaris was superceded by that of Pi-Ramesses, but it has recently come into revival thanks to the Hut-Waret Nome investing heavily into the city."
 djanet_heritage:0 "Heritage of Tanis"
 djanet_heritage_desc:0 "Taking over from the city of Pi-Ramesses, Dja'Net, or Tanis, became the most important city in the eastern Delta area. It served as the capital for multiple dynastie of Egypt. Despite having a bit of a decline, during the better days of the Late Kingdom period, Dja'Net quickly began to rise as a prominent city once more. In the 4th Intermediate Period, it's positioned well to capitalize on the chaotic situation."
 wadjet_heritage:0 "Heritage of the Eye of the Moon"
 wadjet_heritage_desc:0 "The city of Per-Wadjet, also known as Buto, is a relatively ancient town associated with the worship of the goddess of the moon, Wadjet. The snake-bodied goddess both act as a protection goddess as well as a goddess of motherhood and a goddess of love. Upon unification with Nekhbet, she is considered the protector to all of Egypt, but in this divided time, the worship of Wadjet becomes evermore prominent."
 taremu_heritage:0 "Heritage of the Fish Land"
 taremu_heritage_desc:0 "Once the seat of power during the third intermediatary period, the 'Land of Fish' has always remained of lesser relevance than its surrounding contemporary cities. Despite this, foreigners tend to refer to Taremu as instead a land of lions, invoking a much fiercer idea of its people. These fishermen have some bite to them, that's for certain."
 mendes_heritage:0 "Heritage of the Ram"
 mendes_heritage_desc:0 "The city of Djedet, also called Per-Banebdjedet, simply Djedet, or Mendes, was dedicated to the Ram of Banebdjedet, or the Ba of Osiris. Also important is the goddess of fish and the consort to Djedet, Hatmehit, and their child Horus the Younger. This is an unusual telling of the origin of Horus, but it eximplifies the decentralized nature of mainstream Kemetic religion."
 sebennytos_heritage:0 "Heritage of a New Start"
 sebennytos_heritage_desc:0 "Sebennytos, or Tjeb-Netjer as we know it as in Egyptian, is one of the newer cities within the Delta. If Egypt were unified, Tjeb-Netjer may indeed be a seat of power to consider. The city's name translates to 'The City of the Calf,' fitting for such a young but promising city. It is home to a prominent cult of Anhur and his spouse Mehit, but the city is primarily devoted to Aten worship. A newer religion for a newer city."
 naukratis_heritage:0 "Heritage of Sun Dancing"
 naukratis_heritage_desc:0 "The shores of Per-Merit are often flushed with foreigners. Dancing, singing, and partying. It's no surprise, the city being named after the goddess Merit, the wife of Hapy, and the deity associated with singing. But it wasn't until the arrival of Atenic settlers from the Faiyum. Until that point, Atenism was considered rather lacking in all but architecture when it came to the arts, however upon its arival in Per-Merit, Sun Dances, Light Songs, and even murals and art essenuating the purity of the Aten."
 damanhur_heritage:0 "Heritage of Little Waset"
 damanhur_heritage_desc:0 "A recent nickname to the great city of Damanhur is 'Little Waset.' This is because of the Kemetic fundamentalism the city finds itself promoting. It is dedicated to some of the most prominent gods of Lower Egypt; Horus, Thoth, and many older gods. Calling it Little Waset is quite derogatory however, as the city itself is among the oldest in the Eastern Delta."
 khasut_heritage:0 "Heritage of Xois"
 khasut_heritage_desc:0 "Better known to us as Xois, the city of Khasut was the birthplace for many of the 14th dynasty's Pharaohs. Perhaps this is why the tend to have a reputation of snobbiness towards the other Egyptians in the Delta. Khasut is situated in a nice location for such a reputation, with no port directly to the city, its foreign population has always remained low, and native population soaring high and prosperous."
 rhakote_heritage:0 "Heritage of the Twin Cities"
 rhakote_heritage_desc:0 "The village of Rhakote and its constituent village of Wenmeri-Asar grew to prominence very recently. Out of all polities in the Delta, perhaps none are as newly risen as Rhakote and Wenmeri-Asar. The twin villages have developped in the chaos of the fourth intermediatary period, serving as a port especially popular amongst the Greeks abroad. Religion plays a smaller role, however, its Atenic faith is certainly notable, influencing its infrastructure and diplomatic alliegiences."
 beja_heritage:0 "Heritage of the Civilized Beja"
 beja_heritage_desc:0 "The Nome of Beja was created in Late Kingdom Egypt, migrants from the Beja tribes had made their homes between the Sea of Reversing Waters (Red Sea) and the Upper Egyptian Nile. Although they were vanquished, their presence was never reversed and they were made into an official Nomarch of Late Kingdom Egypt."
 sukkari_heritage:0 "Heritage of the Exiled Miners"
 sukkari_heritage_desc:0 "The Republic of Mafkat Khetiu had many royalists amongst their midst, many of whom were expelled to the settlement of Nahrukhaw. It eventually would become the seat of a modest trade city, declaring themselves a Nomarch to the 'true Pharaohs.' Who the true Pharaohs are is a good a guess yours as it is theirs."
 semna_heritage:0 "Heritage of the Migrant Merchants"
 semna_heritage_desc:0 "The Nome of Semna was established by the Nabatean traders coming across the sea. The Nome was originally native Egyptian, but it was internally dominated by Nabateans, who had grown so great in the desert, that they are now a defacto Nabatean Nomarch in all but name."
 faiyum_heritage:0 "Heritage of the Faiyumic Refuge"
 faiyum_heritage_desc:0 "The Pseneros is home to the deserts and badlads just outside the Faiyum area. No one would reasonably want to live in such a place, unless of course, for political refuge. After the Atenification of the Faiyum, several Kemetic priests began smaller settlements on the outskirts of the Faiyum. Eventually, Pseneros became the largest of these refuge settlements."

 #Levantine Heritages
 tadmor_heritage:0 "Heritage of Tadmor"
 tadmor_heritage_desc:0 "The Qedarite Confederation of Tadmor was established during the collapse of the Neo-Assyrian state. After the collapse, they were able to scramble together a small confederation of Qedarite tribes between Palmyra, or Tadhmor, and the upper Euphrates. Skirmishes with the Neo-Babylonia state were frequent, however ultimately, due to constant warfare in the east, Tadmor was allowed to develop into a powerful republic, adopting many traditions of the local Aramaic populations and solidifying their control over the southern edge of civilization."
 qidraya_heritage:0 "Heritage of Qidaraya"
 qidraya_heritage_desc:0 "The Qidri people of Qidraya entered into the region as migrations from the deserts increased during and after the Neo-Assyrian collapse. Emboldenned by the success of their brothers in Tadmor, who had just seized the prosperous city of Palmyra, the Qidri managed to carve out a place for themselves in the northern Hebrew world, even taking cities in Galilee. They would adopt many Aramic traditions and keep friendly relations with the Aramic states in order to assure their position against future Israeli retaliations."
 adini_heritage:0 "Heritage of Resiliance"
 adini_heritage_desc:0 "The state of Bit Adini lead a powerful anti-Assyrian coalition, however they were quickly overwhelmed and lost all their allies. Despite this diplomatic isolation caused by the Assyrians, and constant defeats at the hands of the Assyrians, the Bit Adini kept getting back up. Now, in the wake of the Assyrian collapse, they once again have risen from defeat, this time with no Assyrian state able to rival them."
 hamath_heritage:0 "Heritage of the 12 Kings"
 hamath_heritage_desc:0 "The Neo-Assyrians once came to the state of Hamamth, demanding surrender, but all they got were blank stares and mighty walls. Hamath would remain a powerful thorn in the side of the Neo-Assyrians, assembling a key portion of the coalition of 12 Kings. The Neo-Assyrians would launch a campaign, claiming to have won pitched battles yet only managing to have proof of sacking a single capital. However, this was enough to cause the coalition to falter as all the greatest of Aramaic kings would fall to internal strife, leaving Hamath to be forced to sign a peace with the burgeoning Neo-Assyrians, and invaded by one of their own, Darmashq."
 aram_heritage:0 "Heritage of Beth Hazael"
 aram_heritage_desc:0 "Having always been a major center of trade in the region, the city of Damascus would be brought to its greatest extent under the rule of the king Hazael. At its height it saw the closest any state has every come to the realization of a unified Aramanean state, holding dominion over Lugath and Hamath in the north and the Hebrew states to the south. Ultimately the kingdom would collapse after Hazael's death as it was faced with revolt among its vassals and Assyrian invasion."
 agushi_heritage:0 "Heritage of the Yahanu"
 agushi_heritage_desc:0 "The tribe of the Yahanu were among those who had migrated across the Euphrates during the collapse of the middle Assyrian Empire, but were quickly expelled by the rise of the Neo-Assyrians. The state of Beth Agush would be founded by many of these refugees. Ultimately the Neo-Assyrians caught up to them and forcefully brought them back into the fold, yet even under Neo-Assyrian rule they prospered and persevered eventually establishing a fairly wealthy kingdom and even daring to claim all of Aram. Ultimately they'd successfully expel the Assyrians with the aid of the Urartians, but that alliance proved shortlived as rival interests saw war break out over northern Aram."
 neo_hittite_heritage:0 "Neo-Hittite Heritage"
 neo_hittite_heritage_desc:0 "The many different Neo-Hittite states still remain intact, intermixing with the Arameans, yet still keeping their cultural identity. Although they have Anatolian origins, they're now much more like their Levantine contemporaries in all but language."
 hittite_heritage:0 "Hertage of Karkemish"
 hittite_heritage_desc:0 "The city-state of Karkemish are the single state capable of claiming lineage to the anicent Hittite Empire. They have fallen far, and stopped existing for a while, but they remain an autonomous entity now under the Arameic state of Bit Adini."
 tyre_heritage:0 "Heritage of Tyre"
 tyre_heritage_desc:0 "The city of Tyre, said to have been founded in 2750 BCE, founded many great colonies in the western Mediterranean at the height of its power. Melqart was the primary deity worshiped in the city, with a priestly class and a grand temple dedicated to the god. The city itself is an island, connected to land by an isthmus that was built later on, with its impregnable walls defending the city. After centuries of colonization of the African coast, Tyrian influence has started to wane. After the Numidians confederated  and swiftly conquered most of what was formerly Carthaginian and other Punic territory, Tyre has no more influence in the region, except for the religious cult to Melqart that many Punic nations pay tribute to. Tyre must find a way to regain their position as a naval and colonial power."
 yadiya_heritage:0 "Heritage of Sem'el"
 yadiya_heritage_desc:0 "An ancient city of mixed Luwian-Aramaic composition with ties to earlier Ugarit, the rulers of Yadiya went to great lengths to ensure the state's stability and the prosperity of its people regardless of background. Eventually, the King Bar Rakab aligned with the Assyrians against his neighbors. This decision proved to be the state's demise as the collapse of Assyrian rule in the region, combined with popular unrest and an invasion by Gurgum saw the royal family exiled and a new dynasty imposed."
 ugarit_heritage:0 "Heritage of the Old City"
 ugarit_heritage_desc:0 "Ugarit was once the center of trade in the old world before the great collapsed. In it, the people of the sea would disrupt the old kingdom of Ugarit. However, even by then, the city had started in sharp decline. Our current dynastic house would migrate from the outskirts of the old kingdom and rebuild the city with a small group of nobles. Still far from what it once was, the Kingdom of Ugarit has survived, nonetheless, where many before it have dissapeared, been destroyed, or forgotten entirely."
 tripoli_heritage:0 "Heritage of the Betrayed"
 tripoli_heritage_desc:0 "The three cities of the Kingdom of Tripoli, now called as Bitron, 'Ator, and 'Arqo, were once three kings who had asked for the aid of Akhenaten long, long ago, against the nomad migrations. However, the help from Kemet never came. When the time came to reforge an alliance into a single state, these three cities called upon this ancient betrayal and founded the new triple-kingdom. Sandwiched between the greater cities of Byblos and Arados, this alliance proved strong and capable, even able to set out colonies of her own like mighty Tyre."
 beritos_heritage:0 "Heritage of the Fortified Port"
 beritos_heritage_desc:0 "The rather small port of Beritos, or known to the locals as Beirut/Berut, has one defining feature which has allowed her to maintain her independence against their much more influencial neighbors of Sidon and Byblos; her fortified port deemed untouchable by sea, even from the once great navy of Tyre. The market of Beritos has thus gained a grand reputation of security, for the whole of it exists within the fortified structure."
 acre_heritage:0 "Heritage of the Pheonixine City"
 acre_heritage_desc:0 "One of the great conquests of Thutmosis III, and having been burned during the times of the Assyrians for malcompliance, and even later, sacked by the Habiru Kingdom of Israel, the port of Akko refuses to be killed. They say that the city was founded for the first time before the first Pharaoh of Kemet even rose, before the times of Gilgamesh, before the great flood, and before the Greeks spoke Greek. And it has been put aflame numerous times, yet each time, Akko has risen from the ashes reborn. Today, it serves as one of the main ports carrying goods from the Nile Delta to the rest of Canaan."
 dor_heritage:0 "Heritage of the Tjeker"
 dor_heritage_desc:0 "The Egyptians have designated Dor as the people they once called the Tjeker; one of the dastardly Sea Peoples. Regardless of the truth of this, the Dorans have accepted this mythos as their truth, remaining the last of the so-called Neo-Hyksos outside of the Egyptian sphere. A rather small remnant it may be, but too are they fierce in their independence."
 alalakh_heritage:0 "Heritage of Alalakh"
 alalakh_heritage_desc:0 "The 2000 year history of the city of Alalakh has survived much. It has been part of countless leagues, kingdoms, and empires, yet her walls still protect her people. During the Assyrio-Urarat years, Alalakh went into decline, but, upon reemergence of its independence, the Syrion-Hittite Kingdom would once again surge in influence. This was largely due to its positioning between the lands of Syria and Cilicia. The two incredibly rich regions use Alalakh as a middleman in overland trade, while the twinports of Myriandros and Qaryim serve the purpose of local trade."
 galilee_heritage:0 "Heritage of Asherah"
 galilee_heritage_desc:0 "A splinter state of Judea, the Galileans worship Asherah, the wife of YHWH. During the Damascene campaigns in Galilee and Samaria, they installed a highly unpopular client king in these realms. Shortly after, the Samaritans revolted and broke away, while Galilee was kept under Damascene control. Much like their other Hebrew bretheren, the Judeans and Samaritans consider the Galileans heretics for not worshipping their god YHWH. The land of Galilee is a green and fertile place, irrigated by water from the lake of Gennesar."
 moab_heritage:0 "Heritage of the People of Chemosh"
 moab_heritage_desc:0 "Described in inscriptions from the time of Ramseses II as the rebellious land of Mwjbw, the Kingdom of the Moabites have often come into conflict with their neighbors, none more than the Isrealites. Inhabiting the plains of Moab, the Moabites are the most warlike and martial of the Hebrews. They worship the god Chemosh, a deity of war who is associatd with child sacrifice. Called the 'People of Chemosh' by the Isrealites, they considered the Moabites to be sinful and wicked people, so much so that the term 'Moab' became a byword for anyone who was an enemy of the Isrealites."
 edom_heritage:0 "Heritage of the Red Land"
 edom_heritage_desc:0 "A kingdom that is spoken of being older than any Israelite kingdom, Edom was said to have been founded by a son of Jacob, Esau the Red-Headed and his people settled in the rich, red lands of Edom. Laden with copper, iron, and other metals, the Edomites trade with the Nabateans to their south, to the Neo-Hysokos and Egyptians to their east, and to the Judeans in the north. Their primary god was Qaus, and has a temple to him in the Edomite capital of Bozrah. Still a distinct god, Qaus seems to share some similarities with the Israelite god YHWH. On account of these similarities, or maybe just because it is good diplomatic policy, the Edomites have maintained good relations with the Judeans, oftentimes coming to their aid when faced with hostile incursions."
 ammon_heritage:0 "Heritage of the Citadel of Amman"
 ammon_heritage_desc:0 "A traditional antagonist of the Israelites, the Ammonites have fought many wars against them. The Ammonites are a mostly rural people, with the majority of their population living in the fortified city of Amman. The mighty fortress has saved the Ammonites more than once. Worshippers of the god Milkom, the Ammonites are viewed as dangerous child-sacrificers by the Judeans, surely an exaggeration on their part. After the Damascan incursion into Samaria, the Ammonites feared that they would be next, and allied with the Hamathites in order to keep Damascus in check. A chaotic and bloody war ensued, resulting in a Damascene win on paper, but losing control of Samaria to a revolt."
 jaffa_heritage:0 "Heritage of Aten's Hebrews"
 jaffa_heritage_desc:0 "A Hebrew port city, the Israelites of Jaffa were under the influence of the Egyptians for much longer than the surrounding lands. Quickly accepting the beliefs of Aten into their pantheon, and fusing them with their god YHWH, the Jaffans worship YHWH-Aten, and consider him their supreme god. Because of such beliefs, the Judeans and Samaritans consider the Jaffans to be utter heretics. Without the protecting arm of Egypt, the rich Jaffans appear to be easy pickings for their conquest-hungry neighbors."
 aramaic_heritage:0 "Aramaic Heritage"
 aramaic_heritage_desc:0 "A widespread people across the Levant and parts of Upper Mesopotamia, the Arameans have been come to be known by their administration, centers of trade, their many alliances and political squabbles. Despite many attempts by enemy conquerers, the Arameans have never been put under a foreign yoke."
 gurgum_heritage:0 "Heritage of Gurgum"
 gurgum_heritage_desc:0 "A prosperous land, abundant with grapes and sheep, Gurgum has long been the target of a stronger power. First it was the Assyrians, who came and burnt many cities, then it was the Urartians, and then Bit-Adini, and now Kummuh. Despite their many years of vassalage to other powers, Gurgum has always managed to maintain it's autonomony in some way, and frequently revolts against it's overlords."
 

 #Persia-Potamia Heritages
 elam_heritage:0 "Heritage of Elam"
 elam_heritage_desc:0 "The Elamites are a powerful entity that often neglects its role as a so-called 'Satrapy.' In reality, the Elamites act more as mercenaries with preferences, exchanging land for favors. They serve as the main sword to the Persians, while also acting as a major annoyance. In the past, Median and Babylonians alike have offered the Elamites money or land in exchange for their neutrality in wars against the Persians. Perhaps its time for the Elamites to officially become their own, independent state, rising like they did in ancient times to be the strongest. Truly, they earn their reputation as the Strongest of Satraps."
 apphana_heritage:0 "Heritage of Prosperous Piracy"
 apphana_heritage_desc:0 "In 351 BCE, a wealthy group of Ionian merchants came to the King of Babylon with an unusal request- setting up an emporion on the island of Apphana, in exchange for the Ionian colony paying tribute to Babylon. Always looking for a chance to make more money, the Babylonians quickly agreed. However, the new colony attracted a little more than merchants- the island city became a hub for piracy, rivaling even the pirate infested ports of Cyrenica. The pirates have become a sort of privateer for the Babylonian kingdom, harrasing and plundering undefended towns along the Persian gulf. The islands location at the mouth of the Persian Gulf has made it into an important trade hub and a key strategic point. Goods from Arabia, India, and Persia flow in every day, ensuring the continued wealth of the emporion."
 gordyene_heritage:0 "Carduchii Heritage"
 gordyene_heritage_desc:0 "First noted as the Qardu tribal folk by the Urartian and Assyrian kingdoms of the Archaic Period, The Carduchii are a Caucasian-like people who are said to still, in part, worship the old Hurrian gods, unlike their southern brethren, the Qardu. Mighty warriors, the Carduchii have been the bane of empires, frequently raiding the Medians and Assyrians. Although neighboring empires have described them as simple tribesmen, the Carduchii have been known to build impressive siege equipment."
 qardu_heritage:0 "Qardu Heritage"
 qardu_heritage_desc:0 "The Qardu and Carduchii were once a united people, who dwelt in the northwestern Zagros. After decades of occupation by the Assyrians, the southern Qardu broke free from their overlords, establishing their kingdom at Nineveh. Several centuries of new cultural development and a separation from the Carduchii has rendered the two peoples distinct, and the loss of Nineveh only furthered the unique culture of the Qardu. The Qardu hope to reclaim Nineveh, and proclaim a second Kingdom of Nineveh."
 assyrian_empire_heritage:0 "Assyrian Empire Heritage"
 assyrian_empire_heritage_desc:0 "Once the greatest empire of its time, the Assyrian Empire suffered from revolts, invasions from other empires, and internal turmoil has forced the Assyrians to slowly retract back to their imperial heartland. Through a combination of luck, divine will, and the strong foundation of Assyrian bureaucracy, Assyria has managed to survive, and even reconquer some of its territory. Now, all who have wronged Assyria should be prepared to face Ashur's judgement."
 hurrian_heritage:0 "Hurrian Heritage"
 hurrian_heritage_desc:0 "Once widespread across the Northern Levant and Mesopotamia, the Hurrians had no difficulty syncretizing their beliefs with other religions, and adopted many cultural practices of the places they came to conquer. After the fall of the Mitanni, no great Hurrian power has risen since, resulting in the decline of their culture."
 mitanni_heritage:0 "Mitanni Heritage"
 mitanni_heritage_desc:0 "The Hurrian Kingdom of the Mitanni once stood proudly in the land called Naharin, beyond Assyria... but it was eventually struck down by Assyria. Luckily, the small number of Mitanni elite would survive until the Urartian Kingdom rose, who protected the minority along with other Hurrian associated cultures. Now, the Mitanni have returned against all odds, ready to remind the world what it means to come back from the dead."
 hanigalbat_heritage:0 "Heritage of Hanigalbat"
 hanigalbat_heritage_desc:0 "After the Mitanni Empire was destroyed and conquered by Assyria, Hanigalbat was created as an Assyrian vassal state. Over time, the Hurrians of Hanigalbat lost their ancestral traditions, and became assyrianized. Now, a great change is coming for this ancient land."
 hanigalbat_assur_heritage:0 "Heritage of Hanigalbat-Assur"
 hanigalbat_assur_heritage_desc:0 "The true inheritors of HIS legacy, Hanigalbat-Assur stands poised to conquer the universe, no matter the lies of the false believers."
 hanigalbat_hurria_heritage:0 "Heritage of the Hurrian Kingdom"
 hanigalbat_hurria_heritage_desc:0 "A true kingdom of the Hurrians, the chariot-riders of Washshukanni will ride out and forge their own destiny, free from the external meddlings of foreign peoples."
 arzonian_heritage:0 "Arzonian Heritage"
 arzonian_heritage_desc:0 "A people of Armenian, Hurrian, Syrian, and Urartian origin, the Arzonians are something of a cultural anomaly. The Arzonians still remain a semitic-speaking people, despite their mixed cultural origins. Their land is defined by various mountainous strongholds, rich ore deposits, and abundant food."
 hurhisht_heritage:0 "Heritage of the Shubarized Assyrians"
 hurhisht_heritage_desc:0 "A remnant of when the great Assyrian realm was destabilized, the Assyrians of Hurhisht have adopted many Shubarite ways, notably their fighting tactics. Many a time has an unsuspecting group of soldiers or a caravan been ambushed and captured. Despite their syncretism with the Shubarites, they still maintain a distinctly Assyrian character."
 nasibina_heritage:0 "Heritage of the Hurrian Renaissance"
 nasibina_heritage_desc:0 "Once part of the Assyrian Empire, Nasibina was one of the areas invaded by the Carduchii leading to a significant Hurrian influence on the populous. The city is a central crossroads between Aramaic, Assyrian, and Hurrian customs. A city of many poets and artists, Nasibina has become a central site of a revival of Hurrian literary and philosophical traditions. Home to the school founded by Ba'aliyulpana, Nasibina has become famous throughout Mesopotamia and the Levant for it's rich artistic tradition."
 sagartia_heritage:0 "Agartian Heritage"
 sagartia_heritage_desc:0 "Known for their brightly colored clothes and their militaristic nature, the Agartians inhabit the lands the lands south of the Parthians, a people whom they are related to. The Agartians are skilled archers and horsemen, and are the masters of the hills and sands they inhabit. The disparate clans have encountered difficulties with forming a more unified government- it is harder to get others to agree with you when they are pointing arrows at you."
 kharanaq_heritage:0 "Heritage of the Birthplace of The Sun"
 kharanaq_heritage_desc:0 "A very old city, Kharanaq has been inhabited since before the Persians or the Medes formed their great empires. Meaning 'Birthplace of The Sun', Kharanaq is an important religious site for the followers of Mithra and Ahura Mazda. Close to the city is the oasis of Yazd, from which the city draws it's water from. The rest of the region is dominated by green hills and towering mountains, making it difficult to travel through."
 ninivean_heritage:0 "Heritage of the Second Kingdom of Ninive"
 ninivean_heritage_desc:0 "Established by the Qardu, who sought to capitalize on the weakened Assyrian Empire, the First Kingdom of Ninive was a fairly prosperous, albeit short-lived enterprise. The legacy of this kingdom became incredibly important to the Qardu and their cultural identity, furthering to fuse the Qardu and Assyrian cultures. Now, a second kingdom has been established, a testament of the tenacity of the Qardu and their love for Ninive."
 khourria_heritage:0 "Heritage of the Hurrian Embers"
 khourria_heritage_desc:0 "The once bright-burning flame of the Hurrians has slowly been extinguished over the centuries. The many city states and kingdoms all fell, even the mighty empire of the Mitanni. All for one- the relatively unnoticed and unimportant land of Khourria. Eventually coming under the control of the Urartians, the Khourrians were not subject to the ruthless policies of the Assyrians, as they stamped out Hurrian culture wherever they could find it. Here, the embers of the Hurrians stayed lit. The Khourrians adopted the worhsip of Khaldi, the Urartian god of fire. It is fitting that the last vestige of a true Hurrian state, their last flame, are devotees to the mighty god of flame and battle."
 matienes_heritage:0 "Heritage of Matiene"
 matienes_heritage_desc:0 "Having emerged out of the wreckage of the Mannaean Kingdom, the Matieni took up the fortress of Ziwiyeh, south of the lake Matiene named for them, and sought to create a barrier to the horde-like Scythians to the north and the nomadic Iranians to the east. Speaking a Hurro-Urartian language, the Matieni worshiped the Hurrian god Teshub and the others of the Hurrian pantheon, later combining it with the worship of Mithra. Matiene was subjugated by the burgeoning Median Empire, who sought to create a buffer state between the Median heartlands and the hostile Assyrians and mountain tribes that lay beyond it."
 
 #African Heritages
 heraklea_aphrike_heritage:0 "Heritage of The Cult of Herakles"
 heraklea_aphrike_heritage_desc:0 "The recent overthrow of the Republican government has led to the worship of the cult of Izamramsen. The might of Herakles seems to be with this nation, but they have had a difficult time persuading the old ruling class to cooperate with them."
 metagonia_heritage:0 "Heritage of the African Ionians"
 metagonia_heritage_desc:0 "No one is exactly sure how these Ionians traveled to the shores of Africa. When Massalian merchants began sailing to the coast of Africa, it is said that the Ionians were here first, before the other greeks and the Punics. A rather accepting people, they have gotten along well with the natives of the region, incorportating many Amizagh beliefs into their pantheon."
 tubaqatis_heritage:0 "Heritage of the Garamantic Port"
 tubaqatis_heritage:0 "Tubaqtisi Heritage"
 tubaqatis_heritage_desc:0 "After the Phoenicians settled near these lands, many tribesmen from the surrounding region settled here, as a way to capitalize on the Phoenician trade. Under the rule of the Garamantic Kingdom, this port prospered, and quickly adopted many Punic ways. After the collapse of the Garamantics, Tubaqtis maintained it's position as a port of trade."
 kinyps_heritage:0 "Heritage of Prince Dorieus"
 kinyps_heritage_desc:0 "The founding of Kinyps is as such: Dorieus, the second son of the Spartan king Anaxandridas II, sought to found a colony. Consulting the oracle at Delphi, he received good omens, and set out for Libya. Three years into settling Kinyps, the colony was attacked by the Macae, a Libyan tribe. The Spartiate colony fended off the attackers, and soon became an established city. Despite their distance from Sparta, they still maintain a policy of xenophobia." 
 leptis_magna_heritage:0 "Illapqian Heritage"
 leptis_magna_heritage_desc:0 "Illapqi is now known for it's diplomats, who are said to be the best among the Punics. It is for this reason that Illapqi has maintained it's influence, even after the destruction of the kingdom of the Garamantes, which gave it it's special status amongst the Tetrapolitania holdings."
 kalathousa_heritage:0 "Heritage of The Pillars"
 kalathousa_heritage_desc:0 "Coming to control the Pillars of Herakles with its sister nation Heraklea Aphrike in around 520, the city of Kalathousa became rich from commerce. So much so, that it was said that the streets were paved with gold, and that fruit was so plentiful that it was practically overflowing out of the markets. However, not much can be said about their martial ability, prefering to avoid conflict. Perhaps this was due to their love of feasting and sleeping frequently."
 brakean_heritage:0 "Heritage of the Priest-Kings of Brak"
 brakean_heritage_desc:0 "Established as an important religous center during the height of Garamantic power, Brak is controlled by a class of Priest-Kings, who have total control over the city. They cling to their oasis home, praying that Amun will bless them, and protect them from the neighboring hostile tribes."
 majdul_heritage:0 "Heritage of the Garamantic Scourge"
 majdul_heritage_desc:0 "The desert nomads of Majdul inhabit a sun-blasted pocket of desert. The sands of this desolate and barren land stretch on for as long as the eye can see. Such a harsh and unforgiving landscape has caused the Madjulites to become just as harsh. Skilled warriors, the Majdulites have been raiding and sacking all over Garamantic lands, taking prisoners and anything of value."
 garamantic_tribe_heritage:0 "Heritage of the Garamantic Apocalypse"
 garamantic_tribe_heritage_desc:0 "The realm of the desert kingdom of the Garamantics came to an ignamonius end around 350 BCE. This collapse triggered a near apocalyptic series of events for the people of Fezzan. Egyptian chroniclers said the situation was similar to that of the great invasions of the Lukka and Denyen peoples who brought great destruction upon Egyptian lands many years ago. Entire cities were burnt to the ground, thousands died from starvation, crops failed, and the great Saharan trade system came to a complete halt. After the dust settled, the Fezzan was divided up between the remnants of civilization, and the tribal lands. It is not uncommon for a lone nomad to be traveling the wastes, and come across a piece of a great monument, or see the ruins of a city. Such is the new reality of life in once great lands of the Garamantes."
 murzuq_heritage:0 "Murzuqite Heritage"
 murzuq_heritage_desc:0 "Abandoning the monarchical system of the other Garamantic remnant states, The small merchant republic of Murzuq has managed to maintain it's position as a city of trade, trading with the scattered Garamantic trade posts to the East and to the far south, by Lake Chad. The Murzuqites have come under the 'protection' of Lecksair, but so far they have not suffered under their rule."
 oppon_heritage:0 "Opponian Heritage"
 oppon_heritage_desc:0 "Oppon, meaning 'harbor' was established by Tyrian settlers in the 12th century BCE, Oppon soon became a prosperous city in it's own right. The city has historically maintained close relations with the interior tribes, but that changed after Carthage was nearly sacked by the Numidians. Since then, Oppon and her neighboring city of Rush Ikkad have run to Nura for assistance and protection against the percieved Numidian menace. Protection they have recieved, but at the cost of some of their liberties."

 #Anatolian Heritages
 arzashi_heritage:0 "Heritage of Arzasha"
 arzashi_heritage_desc:0 "The Arzasha are an Armenian group typically loyal to the Medians, or at least heavily influenced by them. In many ways, they are as Median as they are Armenian. Yet still, who are they to complain at the chance of freedom and masters of their own destinies, especially in face of a collapsing liege versus an ascendant liege."
 paphos_heritage:0 "Heritage of Paphos"
 paphos_heritage_desc:0 "It is said that Paphos is the name of the child of Aphrodite, a name befitting for the colony known throughout the lands as being the center of Aphrodite's Cult. The great temple built to Aphrodite in Paphos has stood the test of time, surviving skirmishes and wars fought against the Alashiyan Phoenicians whom the Paphos Cypriots share the isle with."
 lepetos_heritage:0 "Heritage of Kings of Alashiya"
 lepetos_heritage_desc:0 "The monarchy of Lepetos was established by a foreign Ugartic line. Before then, they were a simple colony, democratically elected individuals would become the Shopets of the state. However, upon the establishment of the monarchy, things would change, as the monarchy was built from the ground up. Peasants are kept entertained through the massive amount of wealth funnelled into the pockets of the king, and so long as the populace remains happy, the kingdom shall stay afloat."
 salamis_heritage:0 "Heritage of True Alashiyans"
 salamis_heritage_desc:0 "The original inhabitants of Alashiya were indeed the Alashiyans, or so it is thought by the Salamis colony. Although the Alashiyans are thought by some to be a remnant of an age long gone, the residents of Salamis believe themselves to be the direct descendents, unlike the other Neo-Alashiyan colonies that surround them who were colonized later by the mainland Phoenicians."
 kiti_heritage:0 "Heritage of Kittens"
 kiti_heritage_desc:0 "The colony of Kiti, otherwise known as Kition by the Greeks, has a long and storied history. From once being Greek ruled, to being conquered by Tyre (Tzur), or its historical interactions with the New Kingdom Egyptians as well as the Late Kingdom Egyptians. Each interaction gave them a unique piece to its culture. The Greeks give them their understanding of spearmen warfare, the Tyrions gave them their religion and their Neo-Alashiyan cultural identity. And the Egyptions gave them a reverence of cats, of which Kiti has the most of in all of Alashiya! They even have a local goddess with the name of Ashtartebast, a syncretic deity between Astarte and Bast."
 que_heritage:0 "Heritage of the Subachaeans"
 que_heritage_desc:0 "Established by Greek colonists and merchants amid the instability of the early Iron Age, Que soon came to dominate Cilicia. Although nowadays its Greek origins seem less apparent due to its prolonged exchange with Luwian and Canaanite neighbors it still maintains close ties with its Cypriot kin. It still possesses an extremely multicultural nature as the connection between the Canaanite, Greek, and Hittite worlds, with many from all three regularly pouring in and out."
 lesser_armenia_heritage:0 "Heritage of The Unruly Land"
 lesser_armenia_heritage_desc:0 "The lands of the Bronze Age Hayasa-Azzi confederation, it sits apart from and West of traditional, 'Greater' Armenia. Nestled against Pontus and Cappadocia, the inhabitants of Lesser Armenia retained a more Anatolian character, also having many Colchian and Lazi tribes inhabiting the interior lands - thus, the land was more diverse and unruly."
 sophene_heritage:0 "Heritage of Sarduri"
 sophene_heritage_desc:0 "Ruled by members of the Sardurid dynasty, whose founder, Sarduri I once ruled the Kingdom of Urartu. After the collapse of the once mighty Urartian Empire, the rulers of Sophene managed to retain nominal independence through diplomatic means, and the nature of their mountaineous home. A crossroads between the Anatolian, Mesopotamian, Levantine, and Iranian worlds, many various gods are worshipped in the capital city of Rhandeia. Urartian maintains it's place as a court language, even though it has mostly ceased to be spoken by the common people. Even with such a mix of religions practiced in the nation, the ruler of Sophene maintain the old Urartian religion, Khaldic, as the state religion. Perhaps they do this to legitimize their fairly weak claim of being descendents of Sarduri I. As a result of becoming a Median satrap, Sophene has hardly had to worry about attacks from neighbors, but this has been less of a guarantee as Median control slips in the region." 
 galiopolis_heritage:0 "Heritage of Celtic Democracy"
 galiopolis_heritage_desc:0 "A colony of the Dumarians of Aulaiouteichos, Galliopolis suffered under their rule. Their oppressors were overthrown, and a democratic system modeled after that of the Athenians was adopted. Thus, the Dumarians of Galliopolis are known for their fairness in elections, trials, and other matters of state."
 pergamon_heritage:0 "Heritage of The Mysian Scholars"
 pergamon_heritage_desc:0 "A city of Troans, Aeolians, Lydians, and Mysians, Pergamon has grown to become one of the largest cities in Anatolia. The prominent Library of Pergamon is home to many philosphers and historians, Greek and Anatolian alike. It is said that the library was originally built as a palace for an ancient king of the city, who constantly complained that his own palace was too small, and  it needed an upgrade. On the Mysians, their language is related to Lydian, but shares some similarities to Paeonian and Phrygian. The Mysians speak a dialect of their own tongue, which has been heavily influenced by the neighboring Ionians. A common pratice among the Mysians is abstaining from eating meat, many are strict vegetarians."
 aistian_heritage:0 "Heritage of the Morotatoi"
 aistian_heritage_desc:0 "The Morotatoi, as they were known by the Greeks, were a Celtic people, who instead of sailing across the Black Sea, like their bretheren in Thrace, walked around it's entirety. The Sinopean historian and philospher Philodemos recorded the Aistians as 'These Anoetoi suffered historically from severe lack of nous (mind). On this account they, Agnōntes that they are, took the long way around the Pontus Euxinus.'  He is of course refering to how they traveled along the Black Sea, and they reportedly roamed in Crimea for several decades, before realizing it was a peninsula, and not another landmass, at which point they decided to turn around and wander in the lands of Scythia. As a result of, or perhaps a necessity to ensure their survival, the Morotatoi became skilled warriors. After around two centuries of wandering around the Black Sea, the Morotatoi settled on the port of Rhizaion, which ironically became their capital."
 western_cimmerian_heritage:0 "Cimmerian Heritage"
 western_cimmerian_heritage_desc:0 "The Cimmerians, the first scourge of the Iranian Plateau, the Levant, and the Anatolian plains, were once the most widespread and feared steppe-group known in the world, only to later be supplanted by the Scythians. With an Iranian origin shrouded in the migration-secrecy all nomads who originally come from the east maintain, the Cimmerians inspired fear into their adversaries and were the best mercenaries and warlords. They were powerful enough to break the Kingdom of Phrygia and only declined into a humble people after their steam of conquest petered out following the death of Tugdammi. And while they may not have been in power forever, they destabilized the politics of the entirety of Asia, christening a new era. After being dispersed from Anatolia by the Lydian king Alyattes, a few migrated north, to the Pontic mountains. Here, this relic of a once powerful people remain."
 kios_lydia_heritage:0 "Heritage of Mithradates"
 kios_lydia_heritage_desc:0 "The line of Mithradates has claimed the throne of Lydia for themselves. With it, they bring a strong tradition of military excellence, and a combination of luck and skilled diplomacy. Who can say whether these new kings of Lydia will live up to their name. One thing is certain- that the previous rulers of Lydia were lousy."
 comana_cappadocia_heritage:0 "Heritage of the Sacred Strategoi"
 comana_cappadocia_heritage_desc:0 "The high plain of Cataonia is hemmed in by the Taurus and Antitaurus ranges and forms a sub satrapy of Cappadocia. Though in the time of Strabo, the Cataones spoke the same tongue as their Cappadocian neighbours, the ancients listed them as a separate nation, with Melitene lying between their frontier and the Euphrates. In the Hellenistic age the region formed a satrapy, ruled in the king's name by the princely priests of Comana Cappadocia. These hierophants of the war-goddess Ma jointly held the offices of high priest and strategos, commanding thousands of temple-servants as well the levy of Cataonia and Melitene alike."
 holmoi_heritage:0 "Heritage of the Ciliciote Pirates"
 holmoi_heritage_desc:0 "Holmoi, also known as Holmia, was a Ciliciote town of little note, until it came under the rule of the Olban Priest-Kings. Since then, the city has become a center for marauders all across Cilicia. And yet despite their reputation for barbarism and thievery, the Holmians are an industrious sort of people, minting their own coins, and trading with places as far away as Egypt and Cyrenaica."
 
 #Zagrosian Heritages
 cyrti_heritage:0 "Heritage of Predatory Brigands"
 cyrti_heritage_desc:0 "Long and difficult, are the nights on the mountains of the northern Zagros, yet behind any hill, one might find the infamous Cyrti. They would be categorized as Strabo by the title of Predatory Brigands, sacking traderoutes and remaining unconquerable by the larger 'civilized' folk around them. Assyrian, Persian, Median, or Urartu; no one can truly tame the aggressive mountain warriors."
 shubar_heritage:0 "Heritage of the Smited"
 shubar_heritage_desc:0 "These people were said to have once ruled a mighty kingdom in Upper Mesopotamia before being destroyed by Eannatum of Lagash. However, the Shubar never lost their name, or so they claim. These people of the North would come under the dominion and cultural influence of Hurrio-Urartan groups for hundreds of years. Only now have they regained their complete independence. Only Adad knows what this remnant of a time long past will bring to this new world."
 tukri_heritage:0 "Heritage of the Animal-Skinned"
 tukri_heritage_desc:0 "From the Middle Bronze Age onwards, since the reign of Hammurabi, the Mesopotamians have called the tribes north of the Lullu as the Tukru, or the Turukkum. Culturally, not much is known about these people, however descriptions from the Hurrians describe them as semi-nomadic mountainmen who were distinct for their animal-skin clothing."
 lullu_heritage:0 "Heritage of the Lullubi Kingdom"
 lullu_heritage_desc:0 "The warlike mountain-people called the Lullu are said to have once ruled a Kingdom atop the hills. The semi-legendary kingdom would exist in some form from 2400 BCE to 600 BCE; however usually in the form of a Tribal Kingdom rather than that of a true kingdom. Regardless, the presence of the Lullu is well known by their Mesopotamian counterparts, having several armed conflicts against the Assyrians especially."
 gutia_heritage:0 "Heritage of Neo-Guteans"
 gutia_heritage_desc:0 "The name 'Gutian' may bring imagery of the long gone rulers of Akkad and Sumer, but be not fooled, these are not the same Gutians. The term 'Gutian' was used for a region of the Zagros Mountains, later referring to the largely Median tribes. Overtime, these 'Gutio-Medians' became distinct enough from their settled counterparts, more resembling their fellow Zagrossian tribes than the 'civilized' empires and kingdoms to their east."
 kassite_heritage:0 "Kassite Heritage"
 kassite_heritage_desc:0 "The Cossaeans are sometimes believed to be the successors to the mysterious people who ruled the Babylonians, the Kassites. Carrying on this legacy, the Cossaeans are among the fiercest tribes in the mountains. Their land, unfertile and difficult, has caused them to require a certain policy of land-piracy, so to speak. Skilled with the bow and arrow. They are also known to sometimes lend their might towards their possible cousins, the Elamites; especially if its against their adversaries in Babylon."
 eastern_cimmerian_heritage:0 "Heritage of Theban Rivalry"
 eastern_cimmerian_heritage_desc:0 "Said to be built in the distant Age of Heroes, by the king of the Minyans, Minyas, Orochomenos is a city of great monuments. Even in these long-gone times, Orochomenos was said to be fierce rivals of Thebes. The Charites are venerated in the city with a magnificent sancutuary, and they are honored with a festival every year. Orochomenos is known for it's civic infrastructure, as engineers drained part of the swampy area to the south of the city in order to create a more suitable space. Over time, Orochomenos' rivalry abated, and the two cities came to mostly get along with each other. This loose trust has been shattered in the wake of total Theban hegemony over the Boeotian League, something that the Orochomenians are staunchly opposed to."

 #Italian Heritages
 syracusan_2_heritage:0 "Heritage of the Syracusan Tyranny"
 syracusan_2_heritage_desc:0 "Seen as incompetent by many, including several of his supporters, Agothokles' tyranny has come to an end. After being ostracized, the tyrant has seized control of the small island of Kossoura, with many of his supporters fleeing with him. Now, he plans for his return to Syracuse, and an end to the democratic upstarts. Perhaps the pirate Ptolemy will be able to assist him in his mission…"
 nura_heritage:0 "Heritage of the Punic Refuge"
 nura_heritage_desc:0 "A major trading hub, the Nuran population has swelled from refugees fleeing the newly Numidian controlled lands in North Africa. With the fall of Carthage as a major power, and the Punics Tyrian 'overlords' nowhere to be seen, it appears that Nura is now the leader of the Punics. In the Punic majority south, the residents live a life similar to pre-invasion North Africa. In the north of the island, the Nuragic tribes still maintain a fierce control of the land, and in the Nuran controlled areas, the tribesmen have been resisting their Punic overlords, by violent means. It seems the Nurans must act quickly, lest they have the same fate as many of their African brethren."
 ourkinion_heritage:0 "Heritage of the Determined Defenders"
 ourkinion_heritage_desc:0 "The people of Ourkinion originally settled in Alalia, but it was not long before the inhabitants of the Etruscan settlement of Nicea to  the south became hostile towards the Greeks. In 544 BCE, the Etruscans sent an invasion force of 70 ships to capture the city. Against all odds, the Greeks managed to defeat the intial force, albeit with heavy causalties on their part, losing over three quarters of their fleet. Receiving word that the Etruscans from the mainland had sent another, much larger force, the Massalians of Alalia fled, knowing their city would be burnt to the ground, and themselves slaughtered. They settled on the opposite side of Corsica, founding the city of Ourkinion. A highly martial and bellicose people, the Ourkinionians would not have survived if wasn't for their large city walls, advantageous position, and a highly mobilized populous. It was said that almost every available citizen was able to be drafted. Such a system has led to the adoption of an almost Spartan-like government, with all non-Greeks being shunned."
 genukan_heritage:0 "Heritage of the Fortified Port"
 genukan_heritage_desc:0 "Settled around the same time as the Greek colony of Aleria on the island of Corsica, the Punics of Genuka have not been very successful. Frequent raids from the neighboring Italic and Celtic tribes have made this city always be on guard for the next attack. However unstable their position may be at times, the gold made from the trade at this port has been more than sufficient to keep the colony afloat."
 alerian_heritage:0 "Heritage of the Bellicose Etruscans"
 alerian_heritage_desc:0 "The original Etruscan settlement in the region was established at the port of Nicea, south of the already existing Greek settlement. Relations between these two colonies was bound to go sour, as they both vied for control over a very valuable and well positoned natural harbor. In 544, the Etruscans asked for an invasion force from their allies, and Pisna and Pupluna sent a force of 70 ships. This force was defeated rather badly in a naval battle outside the Syracusium (the name of the port of Aleria), and another one was sent shortly after. The Greeks quickly abandoned the city, and fled to Ourkinion. Ever since, Aleria has been a thriving Etruscan city, comparable to the cities on the Italic mainland."
 inun_heritage:0 "Heritage of Disgruntled Mercenaries"
 inun_heritage_desc:0 "Settled by the Tyrians around 1000 BCE, I'Nun became an outpost from which the Phoenicans expanded their influence into other parts of the Mediterranean. Their principal port is known as Maleth (The Port), and is a fairly busy tradeport. The island was abandoned by the Tyrians, after the general collapse of their trade empire. During the revolt against Agathokles, the tyrant employed several thousand Carthaginian mercenaries. Upon hearing of the deposition of Agathokles, and his cowardly fleeing of mainland Sicily, the mercenaries, fearing for their own safety, sailed to the sparsely inhabitated island of I'Nun, coming to rule over it's residents. I'Nun is home to many temples, notably temples dedicated to Tanit and Melqart. Not much is known about the island's original residents, as they have all seemed to have dissapeared. The only trace of them are the large, monolithic stone structures that can be found on I'Nun."
 per_shekelesh_heritage:0 "Heritage of Eternal Depression"
 per_shekelesh_heritage_desc:0 "A Tenuwan penal colony established on the formerly Greek city of Katana, now called 'Per-Ka' (House of Essence). The colony quickly outgrew its mother city, becoming prosperous from trade. Many Egyptians view the colony as doomed to fail, for they are distant from the life-sustaining waters of the Nile. The Per-Shekeleshi believe in such sentiment, and view themselves as eternally damned for not settling in the Nile, the home of the gods. Recently adopting Orphic ways, the Per-Shekeleshi put their faith in the mysticism of the Greeks, and trust that these new gods will be able to save them."
 faliscian_heritage:0 "Heritage of Falerii"
 faliscian_heritage_desc:0 "A people supposedly of Argive heritage, the Faliscians reside primarily in their capital city of Falerii. The Faliscians speak a language similar to Latin, although it is different in several ways. On their culture, they share many similarities with the Etruscans. A martial and disiplined people, the Falisci have long been enemies with the neighboring Latins, fighting several wars and small conflicts against them. In 358 BCE, the Faliscians allied with the Veiians, and they managed to defeat the Latins in a short and conclusive war. Roma was sacked, the Latins were pushed to their rural holdings, and the Faliscian League was formed, comprised of various Faliscian, Etruscan, and Latin cities."
 ravna_heritage:0 "Heritage of Ocnus' Punishment"
 ravna_heritage_desc:0 "The areas of Etruscan settlement in the Po valley, known as the 'Padanian Etruria' became as rich and prosperous as the cities on Etruria. The chief city of this region, Mantua, was said to have been founded by Ocnus, who founded other cities in the region as well. But, prosperity does not last forever. The continued encroachment of the Celtic tribes on the cities of Padania Etruria led to a league of the Etruscan and Umbrian cities in the region being created, led by the mixed Umbrian-Etruscan city of Ravna. After the city of Mantua was sacked by the Gauls in 401 BCE, the Etruscans became relegated to mostly the coastal regions, and the areas by the river Padus. As fierce as the Celts they so often fight, the Ravnans are not one to retreat or flee easily. Much like their mythological founder, the Etruscans of Padania are in a Tartarus of their own, as they are surrounded by hostile Celts, cut off from their Umbrian allies, and far from the Etruscan homeland."
 tarchuna_heritage:0 "Heritage of the Great Etruscan City"
 tarchuna_heritage_desc:0 "The greatest and most important of the Etruscan cities, Tarchuna has long been a site of political and cultural importance. The city of Tarchon, the great founder of many Etruscan cities, Tarchuna is a major trading power, mostly due to it's close position to mineral resources, and to the port of Pyrgi. The former kings of the Latins were Etruscan, and the impact of Etruscan culture and traditions on the Latins is substantial. Of course, with their Latin neighbors mostly dealt with, a new power has risen in the south, the Faliscans."
 pupluna_heritage:0 "Heritage of Plentiful Metals"
 pupluna_heritage_desc:0 "The city of Fufluns, the god of wine and fertility, Pupluna is one of the few Etruscan cities that is located directly on the coast (most are at least a few miles inland). Pupluna makes it's wealth exporting vast quantities of metals and wine. In fact, so important is the metal-producing industry that they city was supposedly founded to process the bountiful tin, silver, iron, and copper deposits that are near the city. In the city proper, the worship of the gods Hercle and Fufluns are popular."
 pisna_heritage:0 "Heritage of Naval Ingenuity"
 pisna_heritage_desc:0 "Pisna, meaning 'mouth' was established at the mouth of the Arno river. One of the major Etruscan trading ports, Pisna trades extensively with the Greeks and Punics of the Western Mediterreanean. The naval ram was invented in this city, a technology that has spread throughout the Mediterreanean. In the regions near the city, marble is abundant, and is a popular material for use in the construction of houses and villas for the nobles of Pisna."
 persna_heritage:0 "Heritage of Etruscan-Umbrian Cooperation"
 persna_heritage_desc:0 "An Umbrian city, Persna has maintained close ties with the Etruscan cities. Forming a league with the city of Cleusi in the late 5th century BCE, this alliance has proved to be very beneficial, as they have managed to keep the Latins and Faliscans from conquering them. Uni, the patron goddess of the city, is said to grant the Persnans great ferocity and might when they are defending their home."
 arritim_heritage:0 "Heritage of Manufacturing"
 arritim_heritage_desc:0 "Arritim is a major center of manufacturing, producing bronze, pottery, and terracotta statues. Nestled against the Appenine Mountains, Arritim is in a good defensive position, safe from the hostile Celts of the north, and far from the struggles of the Faliscans and Latins."
 enetia_heritage:0 "Heritage of the Enead"
 enetia_heritage_desc:0 "Founded by the semi-mythical Cypriot hero Tychon, Enetia is a strange outpost of Greek culture in a land far away from Cyprus. The myth of the Enead is as follows: Tychon's wife, Olympias, left him, after becoming fed up with her husband's habit of going on long ocean voyages. Tychon, utterly distraught, went to the temple of Aphrodite in Paphos, hoping to find solace. Aphrodite answered his prayers, and told him that if he wishes to find love again, he must travel to the far away lands of Enetia, where the people of passion reside. Tychon assembled a crew of 20 men, and set out on his ship, the Nereis. The journey to Enetia was long and difficult, and Tychon and his crew encountered numerous difficulties on the way there, but after 10 years of traveling, they reached the islands of Enetia. Upon landing, Tychon came into contact with the native residents, meeting a woman named Arete. The two swiftly fell in love, and the place where Tychon settled was named Areteia-the city of Arete. The storied tale of the Enead is as well known as the Iliad, and the tale of Jason and the Argonauts. The city is a blend of Italic and Greek traditions, and both groups live in relative harmony. The worship of Aphrodite, as well as Tychon and Arete are popular in the city."
 roman_kingdom_heritage:0 "PLACEHOLDER"
 roman_kingdom_heritage:0 "PLACEHOLDER"
 neapolis_heritage:0 "Neapolitan Heritage"
 neapolis_heritage_desc:0 "The site on which Neapolis currently stands is the ruins of the city Parthenope, which was founded by settlers from Kymai in the 8th century BCE. The city eventually became so popular and prosperous, that the jealous Kymaians, decided to destroy the city, rather than let it outshine Kymai. In 507 BCE, Neapolis (New City) was founded by Kymaian nobles, after they were expelled from Kymai by the tyrant Aristodemus. Neapolis was intended to be a second Kymai, and many Kymaian traditions carried over to the new city, such as the cult of Demeter. The swampy surroundings of the city made agriculture and inland trade difficult, and the city turned it's efforts towards the sea. The city soon thrived from sea trade, and became as respected and important as it's mother city."
 kymai_heritage:0 "Kymaian Heritage"
 kymai_heritage_desc:0 "Kymai was founded in the 8th century BCE by settlers from Eretia and Chalkis. Kymai became the standard for Italiote cities- it expanded quickly, controlled prime farmland, founded many cities of it's own, and introduced the Euboean alphabet to the Etruscans and the Latins, who adopted it for their own use. The Siybl of Kymai resides in the city, and the oracle of Apollo became especially famous amongst the Latins. Kymai was celebrated amongst the Italiotes for it's wealth and influence, although it has since fallen from grace, in the wake of several wars with neighboring Latins and Samnites. The city has had a history of tyrants and strong men, something that should be noted for the future of Kymai."
 italiote_kingdom_heritage:0 "Heritage of the First Italiote Monarchy"
 italiote_kingdom_heritage_desc:0 "A unification of the Italiote people by force, rather than diplomacy, the Italiote Kingdom is something very different than previous Italiote polities. Many have ruled over the cities of Magna Graeca as tyrants and dictators, but none have proclaimed themselves as a true king. Even under a monarchy, the philosophical traditions of the Italiote cities continue. However, such a drastic change in governance will not settle well with the general populous."
 himera_heritage:0 "Heritage of Numerous Tyrants"
 himera_heritage_desc:0 "A colony of Messana and Syracusan exiles, Himera was established in 648 BCE. Himera soon became a grand and prosperous city, becoming a proper rival to the Punic cities that lay to it's west- Tzitz and Kaprot. The city has fallen under the control of a tyrant numerous times. First, it fell under the dominion of the tyrant Phalaris, the ruler of Gelas who killed Perilaus with his own invention (The Brazen Bull). Reportedly, the Himerans elected Philaris willingly, going against the warnings of the poet Stesichorus. In 490, Himera offered refuge to the exiled tyrant of Messana, Scythus. Soon after this, Himera fell under the yoke of a despot named Terillus, who sought to fortify his power by allying with Anaxilas, the ruler of Messana and Rhegium. But Terillus was unable to resist the power of Theron, despot of Akragas, and, being expelled by him from Himera, Terillus sought the aid of the Carthaginians in reclaiming his power. Hamilcar Magonid, the Carthaginian king, sailed to Sicily with a force of 40,000, in part to aid Terillus, and in part to quash Greek encroachment near Carthaginian territory. Theron held the city with his forces, but it was not until the arrival of reinforcements from Syracuse that the Carthaginian invaders were defeated. So thorough was the routing at the Battle of Himera, that the Carthaginians had to permanently withdraw from the island of Sicily. The glory that the Himerans received from the battle was legendary, and they quickly became one of the most, if not the most lauded and celebrated Greek city. After the battle, Theron then left control of the city to his son, Thrasydaeus, who angered his citizens by his violent and oppressive rule. The Himerans called for aid from Hieron of Syracuse, who was at the time hostile towards Thieron. However, Hieron betrayed the citizens of Himera, executing many and driving many others into exile. Such an event left the city depopulated, and it began to languish. Himera remained under the rule of Thrasydaeus until 473, before returning to democratic rule and peace and prosperity. When Aristodemos of Athens led a coalition to oust the tyrant Agathokles from Syracuse, Himera aided them. The city has remained prosperous, but the circumstances in Sicily are bound to change."
 kaprot_heritage:0 "Kaprotian Heritage"
 kaprot_heritage_desc:0 "Known to the Punics as Kaprot 'village' and to the Greeks as Solontinos, the city was one of the later Punic settlements to be established on Sicily, being settled in the late 8th century. Kaprot lies on a hill overlooking the sea, an advantageous and easily defensible position. Kaprot and the other Punic cities have often come into conflict with the Greek cities, especially the neighboring city of Himera."
 tzitz_heritage:0 "Tztizian Heritage"
 tzitz_heritage_desc:0 "Tzitz was built near a natural harbor, a prime location for a port city. The rapid growth of the city led to two districts- the old district, and the new district. The Greeks call this city Panormos or 'wide haven'. The new district became the city's commercial center, soon exceeding the size of the old city. The city maintained close relations with Carthage, something that would come to harm it when Carthage was forced out of Sicily. Tzitz has attempted to maintain it's former relevance by allying with the Nurans, but who can say what the future will hold."
 ardean_heritage:0 "Heritage of Ardean Riches"
 ardean_heritage_desc:0 "Located about 220 stadia south of Rome, Ardea is the primary city of the Rutulians. The city is reputed to have been founded by either Ardea, a son of Odysessus and Circe, or by Danae, the mother of Perseus. Regardless of it's founding, the Rutulians themselves appear to be related to the Etruscans and Umbrians, implying their ancient heritage. Ardea was once prized for it's great wealth, wealth that the last king of Rome, Lucius Tarquinius Superbus, sought to capitalize on. Lucius laid siege to the city, albeit unsuccessfully. Back in Rome, the city was in great turmoil due to the revolution that was ongoing. Lucius was expelled from Rome, and the city then took on a more republican system of government. Fortunately for the Ardeans, the siege was ended, and peace was made between the two peoples. But, despite it's lofty origins, Ardea declined, partially due to the Rutulians ineptitude at warfare, and partially due to becoming a subject of the Latins. Ardea has gained it's independence after the Latins were pushed out of Rome by the Faliscan League."
 poseidonia_heritage:0 "Heritage of Poseidonia"
 poseidonia_heritage_desc:0 "A Sybarite colony, Poseidonia was founded around 600 BCE, several stadia inland on a large limestone plateau. Poseidonia is famous for it's sancutary of Poseidon, for which the city is named. During this early period, the city maintained close relations with Metapontum, minting coins in a fashion similar to that city. The city is home to the two temples of Hera, some of the most magnificent and imposing temples in the Hellenic world. During the 5th century BCE, the city came under the control of the invading Lucanians. After several conflicts between the Lucanians and Tarentines, Poseidonia was eventually freed from her subjugation, leading to a revival of the city."
 

 #Iberian Heritages
 mago_heritage:0 "Heritage of the Ignored Paradise"
 mago_heritage_desc:0 "Almost completely dependent on their Massaliot overlords, the Greeks of Mago inhabit little more than a glorified naval base. The residents of this little-known colony are not good fighters, or very good sailors. The one thing they have going for them is great beauty and serenity of the island. Amongst the Magoans, it is said that even Narcissus would stop looking at his reflection to bask in the beauty of the island."
 dertossa_heritage:0 "Heritage of the Lost Greeks"
 dertossa_heritage_desc:0 "Situated on the river Iberus, Dertossa was founded when a group of settlers from Korinthos set sail for Massalia, but they went off course and landed in Hibera. Although they did not land at their intended destination, they decided that the site was good enough. Trade from the inland Iberian tribes keeps Dertossa prosperous. The residents of Dertossa maintain good relations with the native Ilercavonians, and they are seen on a near equal level as Greeks."
 malacan_heritage:0 "Heritage of Abundant Gold"
 malacan_heritage_desc:0 "The Spanians of Malaca use the abundant iron and gold mines in their territory to great effect, amassing huge amounts of wealth. Every day, thousands of slaves in the various mines go to work, and extract ore. In order to maintain a sufficient workforce, slaves are given much less autonomy than in other Punic colonies, resulting in much more slave unrest than usual. With this abundant workforce, the Malacans have put them to good use, building many new mines, farms, and infrastructure projects."
 carteian_heritage:0 "Heritage of Mixed Iberia"
 carteian_heritage_desc:0 "In the culturally rich Iberian south, Greeks, Punics, and Iberians intermingle. The city of Carteia has a proud heritage of granting citizen rights to all of its inhabitants, regardless of group. This diverse arrangement has worked out well for Carteia, ensuring good relations with the various Punic, Greek, and Iberian states around it."
 indiketian_heritage:0 "Heritage of Indiketia "
 indiketian_heritage_desc:0 "The Indiketian people benefited enormously from trade with foreign powers, notably the Etruscans and Phoenicians and eventually the Massalians. The Indiketians had a unique relationship with the Massalians in Emporion and Rhode, stemming from the colonies' establishment on Indiketian territory and with Indiketian assistance. Indiketia learned much from its Hellenic neighbors and eagerly adopted their metallurgical techniques and pottery style. The Indiketians were famous for coating most of their pottery with white paint, while using imported pigments for detail-work. Notably, Indiketia's capital city, Indika, seems to have once been nestled on an small island that has since become part of the mainland as debris built up over the centuries."
 mastian_heritage:0 "Heritage of Foreign Merchants"
 mastian_heritage_desc:0 "Situated near the western edge of the Mediterranean, the Mastians came into close contact with overseas Punic and Greek traders. Although they brought with them their goods and ideas, through those exchanges the Punics and Greeks were able to exert significant influence over the Mastians. Such contact has led to the Mastians to model their government in the Greek style."
 basti_heritage:0 "Heritage of Rolling Hills"
 basti_heritage_desc:0 "The largest of the Bastetanian tribes, the Bastians inhabit a rugged land, dominated by hills and sparse vegetation. Their capital city is a center of manufacturing, and one of the larger inland settlements in Iberia. Unlike their Mastian bretheren, the Basti try not to get involved in foreign affairs. Blessed with deposits of metal, the Basti are skilled metal workers."
 ilervaconian_heritage:0 "Heritage of Sacred Hills"
 ilervaconian_heritage_desc:0 "An extremely religous people, the Ilercavones hold the belief that every hill and mountain was sacred. Interestingly, they do not build temples, but the hills and mountains act as a sort of natural temple. Upon encountering the Greeks in the late 500's, the Ilercavones have gotten along rather well with them, adopting Greek ideas of government.  Their chief city is named Roburum, located at the base of one of their holy hills, and nearby the river Ebro. The city produces dyes, which makes it rather wealthy, despite it's rather undeveloped and isolated surroundings."
 lacetanian_heritage:0 "Heritage of the Forest People"
 lacetanian_heritage_desc:0 "The Lacetanians inhabit a densely forested region of Iberia. This warlike group of people prefer to be left to their own devices, except when they travel out for raiding or war. Ilergetian, Ausetanian, or Massalian, all have been on the recieving end of a Lacetanian spear."
 edetanian_heritage:0 "Edetanian Heritage"
 edetanian_heritage_desc:0 "Established on a hill, the Edetanian stronghold of Edeta is home to a religous and bathing complex, centered around a natural fountain in the settlement. The local Hemeroskopeians refer to the rulers of Edetania as the 'Princes of the Edetani', for their regal and prince-like behavior and conduct."
 cynetian_heritage:0 "Heritage of Beekeeping"
 cynetian_heritage_desc:0 "Gargoris, the inventor of beekeping, exiled his son Habis, who was a product of an incestous relationship between Gargoris and his daughter. Habis was abandoned in the prairie outside the kingdom, where he was raised by deer, acquiring deer features. When the boy came of age, he was found to be the true heir of the kingdom, and was recognized as such. The Cynetians use the Tartessian script, and the graves of their nobles are engraved in the script. The Spanians and Turdetanians have a great deal of control over the local fishing and shipping buisiness, primarily in the city of Baesuri, and the coastal settlements surrounding it. The Cynetians primarily make their money from this entreprise, despite the more rural character of the rest of their country."
 oppidanian_heritage:0 "Heritage of the Turduli Oppidani"
 oppidanian_heritage_desc:0 "The Oppidanians are a tribe of the Turdulians, the numerous people who inhabit the southern regions of Iberia. The Oppidanians trekked north with the Celticans in the 5th century BCE, establishing many fortified settlements along the Atlantic Ocean. The Oppidanians have hard time establishing themselves beyond their fortified towns, coming into conflict with the many Luisitanian tribes. With the arrival of the Spanians at Alitz Oppon, there has been an influx of foreign ideas, goods, and peoples into the region."
 turdulian_heritage:0 "Turdulian Heritage"
 turdulian_heritage_desc:0 "The Turdulian tribes migrated into the south of Iberia, settling in the lands that were once owned by the legendary Tartessian Kingdom. The Turdulians prospered in this area, farming, trading, and fighting. They have adopted aspects of Turdetanian culture, becoming less alike to the Celtiberians to their north. Never existing as one united entity, the Turdulian tribes were always at odds with each other."
 garmanian_heritage:0 "Heritage of Germanic Origins"
 garmanian_heritage_desc:0 "A people of Belgican and Germanic descent, the Garmani migrated all the way to Iberia, settling near the Oretani. The Garmani have lost most of their foreign ways, becoming much more akin to the Oretani. As subjects of the Oretani, the Garmani have prospered under the rule of the rich tribe."
 eburani_heritage:0 "Heritage of the Three Factories"
 eburani_heritage_desc:0 "A Bastetanian tribe, the Eburanians inhabit a land rich with olives, grain, and stone. The three major Eburanian towns of Elvira, Accis, and Ebura are known by the Spanians as 'The Three Factories', for their seemingly endless output of pottery, olives, metals, and quarried stone. Although their settlements are not nearly as large as their cousins to the East, the Basti, or as populous as the Turdetanians, Eburanian towns are nonetheless extremely productive. A combination of wealth from trade, and a growing population is poised to catapult Eburania into a great nation, one that could eclipse all other Iberian peoples."
 deitanian_heritage:0 "Heritage of the Warring People"
 deitanian_heritage_desc:0 "Closely related to the Contestanian people, the Deitanians are a warlike and aggressive people. Their highly stratified society is ruled by a class of warrior elites, who all vie for more power and control over the land. Oftentimes under assault from the Contestani, the Deitanians have had to fortify their settlements and towns, often resulting in sieges or skirmishes outside the city walls. No matter how many times they are attacked, the Deitanians never lose their warrior spirit."
 contestani_heritage:0 "Contestani Heritage"
 contestani_heritage_desc:0 "A people of many roles, the Contestani are merchants, warriors, city builders, farmers, and diplomats. The Contestani pride themselves on their skilled fighters, and they seem to constantly be at war. Ruled by a single warrior-king, the Contestani value honor in battle above all. They are tricky diplomats, and have tried to manipulate and maneuver themselves into a position of regional dominance, a position which has not been achieved, due to the many competing interests in the region. The recent influx of wealth into the city of Ad Aras has made the nobles even more powerful; it seems the interests of the wealthy may come to interfere with the traditional values of the Contestani."
 ilici_heritage:0 "Heritage of Destruction and Rebirth"
 ilici_heritage_desc:0 "The city of Ilici was, for a time, the largest, greatest, and most influential Iberian city east of the Turdetanian polities. In it's height, the city was comparable to the great palaces of the now long gone Tartessans. The city thrived on trade from the Punics, producing immense wealth for the city. Sometime in late 500 BCE, the entire city was destroyed by a catastrophic earthquake. It is said that only two beings survived- a priest, who was making sacrifices to the gods in a temple in the outskirts of the city, and the donkey he rode out on. As word spread of the destruction, many said it was divine retribution for the greed of the city's inhabitants. The site of the city was deemed a forbidden place, something to be forgotten about and never walked upon again, lest the wrath of the gods be faced. Nearly 200 years after the demise of Ilici, a new site has been established, by Spanian and Greek merchants, who have come to seek their fortune. Their blatant disregard of Contestanian customs has inspired a mass re-settlement of the city. While the city is prospering for now, it remains unseen if the gods will strike again."
 mantasanian_heritage:0 "Heritage of the Smallest of the Oretani"
 mantasanian_heritage_desc:0 "The smallest of the Oretani tribes, the Mantasanians inhabit a small pocket of land, where the Celt-Iberians and Iberian peoples meet. Despite their seemingly weak position, they are blessed with metals and fertile land. The Mantasanians are skilled metal-workers, and the quality of their arms are superior than their neighbors, who they are often forced into war with."
 lobetanian_heritage:0 "Lobetanian Heritage"
 lobetanian_heritage_desc:0 "A strange people, the Lobetani are alike in equal measure to their neighbors. They speak a tongue which sounds foreign to Celtiberian and Iberian alike. The Lobetani used to control a much larger swath of land, before being pushed out by the Contestanian tribes. Such a history has led to the Lobetanians being quick to battle, and quick to retreat. The Lobetanians mint their own coins, albeit in small numbers. Their isolated position has led them to be deprived of any potential allies, except for the Mantasanians, with whom they are well acquainted, and share some kinship with."
 sedetanian_heritage:0 "Sedetanian Heritage"
 sedetanian_heritage_desc:0 "A subset of the Ilervacones, the Sedetanians are much less concerned with religious matters than their cousins. The rich natural resources that they are blessed with has led to a burgeoning stone and metal trade with the Dertossans, much to the benefit of the Sedetanians."
 alitz_oppon_heritage:0 "Heritage of the Rock of Gold"
 alitz_oppon_heritage_desc:0 "A trading outpost existing on the periphery of Spanian and beyond the border of the 'civilised' world, 'Alitz 'Oppon is home to merchants counting their coiins, foreigners from strange lands, and young men seeking their fortunes out on the Oceanus Atlanticus. The founding legend of the city is that a group of merchants from Malaca had to shore their ship, as it had become severly damaged in a storm. Initially thinking their luck had run out, the merchants feared they would soon perish due to the harsh weather. When they wandered out from their camp, they stumbled upon a large rock. On a whim, one of the sailors started hitting the rock with his pick, and to his surprise, huge chunks of gold starting flowing out of the rock. The rest was history- 'Alitz 'Oppon soon became a center for the trade of precious metals, an incredibly lucrative business. The wealth-seeking 'Opponians may seek to expand their control, even to strange and faraway places.."
 
 
 #Greco-Macedon Heritages
 korinth_heritage:0 "Heritage of Korinth"
 korinth_heritage_desc:0 "Believed to have been one of the first settled cities in Greece, Korinth commands a strategic position on the Korinthian Isthmus. This position has allowed Korinth to become rich from trade, and the city would go on to found many important colonies, such as Korkyra."
 troan_heritage:0 "Heritage of Troy"
 troan_heritage_desc:0 "Home to the ruins of the fabled city of Troy, the Greek cities of the Troad have strong mercantile root on the along the Hellespont. The members of the Koinon of Athena Ilias (Troas) are proud of their heritage and legacy, which are known to all in the Hellenic sphere through the stories of the Trojan War. The region's prestige has allowed the Koinon of Athena Ilias to establish close relations with Macedon, and the sacred ruins of the Trojan Walls remains continue to be a popular site for pilgrimages and worship."
 tylian_heritage:0 "Heritage of the Hardy"
 tylian_heritage_desc:0 "Hailing from lands near the lake Pelsodis, the Tylians managed to carve out a state for themselves after the defeat of Odrysia at the hands of Macedon. A hardy people, the Tylians do not care much for luxury, and see the neighboring Greeks as frivolous. From constant contact and skirmishes with nearby peoples, the Tylians have adopted many of the combat tactics of Greeks, Scythians, and Thracians."
 abderan_heritage:0 "Heritage of the Atom"
 abderan_heritage_desc:0 "Orignally settled by the Phoenicians, Abdera has seen many peoples come and go. Later, it was settled by Greeks, but their colony was unsuccesful, and Abdera stayed a Thracian city until 544 BCE, when it was settled by a group of colonists from Teos, in Ionia. Accepting Athenian domination as a means to better protect itself, Abdera has prospered ever since, partly due to it's advantageous position on the coast, and partly due to the Athenian military. Home to several famous philosphers, such as Democritus, who claimed that was everything was made of small little particles, called 'atoms'."
 cardia_heritage:0 "Heritage of Deft Oration"
 cardia_heritage_desc:0 "Settled by Milesians in the late 7th century, Cardia has since grown to be one of the most important cities on the Hellespont. At times being pro and neutral to Athens, Cardia has recently become a staunch support of Macedon. During the Thracian incursion into the Greek colonies in Thrace, Eumenes, a native of Cardia who had been exiled from the city several years prior by the tyrant Hecataeus, petitioned Alexander to intervene. After succesfully repelling the Thracians, Eumenes was installed as the Archon of Cardia. Naturally, he has been granted 'emergency powers' to 'ensure the safety of Cardia'."
 bergoula_heritage:0 "Heritage of the Sailing Celts"
 parion_heritage:0 "Heritage of Prolific Coining"
 bergoula_heritage_desc:0 "Part of the second wave of migrations to Thrace, these Celts came from boat from the River Ister, and down the Black Sea. Learning quickly from their Greek neighbors, the Dumarians attempted to create a colony of their own, named 'Galliopolis', as the Greeks called it. This colonial venture was a fluke, as the colonists there quickly grew tired of high taxes, and efforts by their overlords to increase wine production."
 aenos_heritage:0 "Heritage of Semi-Mythical and Convoluted Origins"
 aenos_heritage_desc:0 "Aenos gets its name from their supposed founder, the demigod Aeneus. As to how the city was actually settled, there is severl conflicting sources. Virgil claims that the city was founded by Aeneas after Troy was destroyed. Herodotus and Thucydides say that Aenos was founded by colonists from Aeolia, while Pseudo-Scymnus and Scymnus Chius say that the colonists came from Mytilene. Regardless of who founded the city, religious events have alwasy been important in the city, with many cults dedicated to various gods being worshipped in the city."
 potidaea_heritage:0 "Heritage of the Great Flood-Tide"
 potidaea_heritage_desc:0 "A Corinthian colony founded around 600 BCE, Potidaea is an important trade port. In 356, the Macedonians laid siege to the city. Miraculously, as the Macedonians were trying to exploit an unusual retreat of the water, were swept away by a large flood tide, saving the city from utter destruction. Unfortunately for the Potidaeans, they were not able to keep their independence, and Macedon was able to force the city into vassalage. Macedonian rule has been  begrudgingly tolerated, and the Potideans would jump at the chance to gain their freedom."
 lampsakos_heritage:0 "Heritage of Lydian Manipulation"
 lampsakos_heritage_desc:0 "Originally known as Pityussa, the city now called Lampsakos was founded by Phoaceans and Miletians. Lampsakos is known for it's wine, which was a favorite of Lydian kings, and it's early adoptage of gold coinage, which usually only larger poleis could afford. Several notable philosphers and historians were natives of the city, such as Charon of Lampsacus, who wrote histories on Media, Lydia, Ethiopia, and on his own town. After decades of rule by pro-Lydian tyrants, Lampsakos was able to break free from Lydian rule, along with Mithradates' city of Kios. Whether the decision to leave Lydian control was that of the citizens, or that of Macedon, is ambigious."
 parion_heritage:0 "Heritage of Prolific Coinage"
 parion_heritage_desc:0 "The city of Parion was founded in 709 BCE. According to Strabo, the city was a colony of Milesians, Parians (from the island of Paros), and Erthyaeans. The Parians coined abundantly, and on their coins was that of the Gorgons, which was a symbol of their city. The poleis maintained close relations with the nearby Lydians, and it is perhaps from them, that the inhabitants of Parion learned the art of coining from."
 lesbian_heritage:0 "Heritage of Lyrics"
 lesbian_heritage_desc:0 "Lesbos is comprised of a pentapolis of the cities of Mytilene, Methymna, Antissa, Eresos, and Pyrrha. The island is famous for it's lyric poetry, the most famous poets being Sappho and Alcaeus. Many other philosphers were from or lived on the island, such as Epicurus, who founded the philosphical school of thought named after him. The government of Lesbos, influenced by the teachings of Epicurus, has stayed a rather democratic and inclusive state."
 aigina_heritage:0 "Heritage of The Turtle"
 aigina_heritage_desc:0 "Aigina was once one of the more prestigous states in Greece, being amongst the first to adopt coinage, possibly adopting it from the Lydians. On the Aeginetean coin is a depiction of a turtle, a holy symbol of Aphrodite, and the national icon of Aigina. One of the several poleis to participate in the founding of the emporion of Naukratis in Egypt, Aigina is one of the primary sites of imported goods from Egypt and the Levant. The Aeginetan navy was once one of the mightiest Greek fleets, but was severly weakened by several wars. The final blow for Aigina came during the Ionian revolt, in which Aigina supported the Ionians against the Lydians. The Aeginetan navy almost stopped the Lydian advance into Rhodes, but the Aiginatean commander was killed in the midst of battle, throwing the fleet into utter chaos. Forced to retreat to their home port, the Aeginetan were forced to admit defeat. After the war, Aigina was crippled, militarily and economically. They found new friends in Korinth, a power they have not been exactly friendly to in the past."
 kythera_heritage:0 "Heritage of the Green-Sea Port"
 kythera_heritage_desc:0 "Originally a Phoenician settlement, and a site where Tyrian Purple was produced, Kythera has recently become an important port of trade for goods coming from Egypt and the Levant. After the decline of Aigina after the Ionian revolt, Kythera was able to fill in the trade vaccum left. Trading as far south to the great city of Memphis, and as far east as the Atenite port city of Rashpon, Kythera has swelled in size, mostly from Egyptian merchants who have taken up shop in the city. The influence of this strange and foreign people can be seen very clearly in the city, with some Egyptian-style architecture being present, along with temples to the goddess Isis and Hermes-Dedun."
 kyphanta_heritage:0 "Heritage of Argolian Domination"
 kyphanta_heritage_desc:0 "Once part of Sparta, this area was conquered by the Argolians during the Spartan-Messenian war. Not a very notable area, the town of Kyphanta has few things of note, other than a temple to Asclepius, and a fountain said to have been pierced by the dagger of Atlantea. Under Argolian rule, the poleis has recieved some growth, but it's role as a buffer state between Argos and Sparta still stands, a role which the Kyphantans have served exceptionally well. Although small, the Kyphanthan army have more than proved their worth, defeating the Spartans in several small skirmishes."
 lamia_heritage:0 "Heritage of Lamos"
 lamia_heritage_desc:0 "According to legend, the city of Lamia was founded by Lamos, a son of Herakles and the Lydian Queen Omphale. Some say that the city was named after Lamia, a hideous monster that is said to abduct children and eat them. Established on a strategically important location, Lamia is close to the Opuntian Gulf, and is located near the crucial pass of Thermopylae. The thick walls of the city and the Acropolis of Lamia have protected the city from the neighboring Aetolians, Thessalians, and Boeotians more than once. During the late 4th century BCE, Lamia was able to form a more consolidated league with it's neighbors. Much to the dismay of the Lamians, Lyschimachus of Thessaly was able to succesfully force the Lamians into submission."

 #Celtica Heritages
 oxybii_heritage:0 "Heritage of the Ox-Slayers"
 oxybii_heritage_desc: "The Oxybii, meaning 'Ox-Slayer', were a formidable Ligurian tribe. In 482 BCE, the Oxybii, along with several of their Celtic allies, attacked the Massalians. They fought valiantly, but were crushed by the coalition of Greek colonies. After being under the thumb of Massalia for so long, the Oxybii have come to resemble their overlords, and have abandoned their gods for the Greek pantheon. Subjugation does seem to have benefited the Oxybii, as they have adopted Greek warfare tactics and technology, supplementing the might of their warriors with Massalian iron."
 pytheapolis_heritage:0 "Heritage of Pytheas' Colony"
 pytheapolis_heritage_desc:0 "Established as an emporion by the famed Massalian explorer Pytheas in 327 BCE, the city of Pytheapolis is noted for it's natural harbor, and it's key location near the Mare Cantabrum. Far from the influence of the Spanians, and the tyrants of Massalia, Pytheapolis has prospered as an outpost of Hellenic culture in a place where no Greek has gone before. Pytheas, the founder of the colony, has become an immensely popular and influential figure in Pytheapolis, and he has served as Archon multiple times. Contact with the Gauls has been a key part in the survival of Pytheapolis, becoming important allies and trade partners for the city."
 biturgian_heritage:0 "Heritage of the Kings of The World"
 biturgian_heritage_desc:0 "The Bituriges, meaning 'kings of the world', once controlled large swaths of Gaul. Their empire would not last, as it was subsumed by the Arvernians. The Bituriges still carry with them a regal demeanor."
 gallic_prince_heritage:0 "Heritage of the Gallic Princes"
 gallic_prince_heritage_desc:0 "Formed along the lucrative trade routes that travel from the south of Gaul up to the border regions by Germania, the Gallic Princes have been able to carve out incredibly wealthy realms, centered around a major settlement or fort. These principalities value their independence, but also value their business, preferring to stay neutral."
 nitiobrogia_heritage:0 "Heritage of the Native Kings"
 nitiobrogia_heritage_desc:0 "Named for their ancient ties to their land, the Nitiobroges, or the `Indigenous` as their name translates, were a proud and martially strong people. Their cavalry were of note, and their leaders were expected to be talented and cunning warriors in their own right. They were not so determined to uphold loyalty to foreign powers, and were quite happy to choose the side most beneficial to themselves."
 rutenia_heritage:0 "Heritage of the Argent Haired"
 rutenia_heritage_desc:0 "The Ruteni, distinguished by their fair hair, were an industrious and crafty people - noted for their production of large amounts of lead as well as fine red slip pottery. From their home in the western foothills of the Massif Central, the Ruteni also seem to have practised a form of water-cult centered on lakes such as at the Saint-Andeol."
 ###Albicia
 albicia_heritage:0 "Heritage of Massalia`s Boon"
 albicia_heritage_desc:0 "Where many of the Gallo-Ligurian tribes either rallied against Massalia, or quietly traded with them from a distance, the Albici instead chose to cleave significantly closer to the Hellenic colony. From the upland hills and plains north of Massalia they dedicated themselves to the aid of the Hellenes, earning distinction in Massalia`s wars for their stout hearts and skill in upland warfare, said to fight with ability and valour almost equalling Roman legionaries."
 ###Helvia
 helvia_heritage:0 "Heritage of the Senatorial Gauls"
 helvia_heritage_desc:0 "A small tribe clustered on the western bank of the Rhodanus, the Helvii also controlled the source of the critically important Liger river. The Helvii were some of the more `civilised` and diplomatic of the Gallic tribes - distinguished by their intellect and loyalty, and earning considerable boons in exchange for these qualities. It is said that their leaders carried themselves with a bearing suitable for the Roman senate."
 ###Vocontia
 vocontia_heritage:0 "Heritage of the Crafty Gauls"
 vocontia_heritage_desc:0 "The Vocontii, who called themselves `The Twenty Tribes`, were a cunning group who carved out a realm specifically intended to allow them control of trade down both the Rhodanus and Druentia rivers. They were able to use this same cunning to influence the politics around them in the pursuit of profit and autonomy, signing treaties, offering bribes and currying favor in foreign courts."
 ###Caturigia
 caturigia_heritage:0 "Heritage of the Kings of Combat"
 caturigia_heritage_desc:0 "Their name literally translated as the `kings of combat`, the Caturiges were said to be a fragment of the Insubres who had migrated to, or been exiled to, the west. One can only imagine what led to this split, but judging by the name taken by the Caturiges it must not have been peaceful. Indeed, their belligerence continued into their independence, and they were ever quick to push any outsider from their realm along the Druentia with extreme prejudice."
 ###Arecomicia
 
 
 #Caucasian Heritages
 northern_cimmerian_heritage:0 "Northern Cimmerian Heritage"
 northern_cimmerian_heritage_desc:0 "The Northern Cimmerians remain as the most civilized of all the Cimmerian remnants. A close ally of Colchis, they helped them fend off an Urartian invasion in the 720's. A mostly settled people, the Northern Cimmerians have stayed in their homeland, and didn't migrate further south like their bretheren. Attempts to adopt agriculture have gone poorly, with many tribesmen prefering to hunt and gather."

 #Pannonian/Illyrian Heritages
 cotinii_heritage:0 "Cotinian Heritage"
 cotinii_heritage_desc:0 "The Cotinii are a mountain-dwelling people, who primarily mine the rich ore deposits of their home. They mine, to their degradation. Considered even more isolated than their southern neighbors, the Cotinii have been heard of by very few people."
 eravisci_heritage:0 "Eraviscian Heritage"
 eravisci_heritage_desc:0 "An usually civilized people amongst the other tribes in the region, the Eravisci minted coins, created pottery and jewelry, and worked with iron. Despite their advancements, the Eravisci are a rather isolated group, far from the civilised lands of Italia and Greece. Perhaps they will forge a civilization for themselves."
 scordisci_heritage:0 "Heritage of the Lizard Ones"
 scordisci_heritage_desc:0 "A group of Celtic origin, the Scordisci (Lizard-Ones) moved into the region near the Scordus Mountains during the 3rd century, as a part of the greater Celtic invasion of Illyria and Pannonia. Eventually mixing with the Thracian and Illyrian people whom they conquered, the Scordisci were known for their aggressive and eagerness for battle, a sentiment that was not appreciated by their neighbors. At times, the Scordisci managed to subjugate some of their smaller neighbors, however these relationships would not last. To the south, the Kingdom of Dardania stands as a bastion against this tribal group. If the Dardanians were to be defeated, the Scordisci might turn their eyes south, towards the rich lands of Greece and Macedon."
 pannonian_heritage:0 "Pannonian Heritage"
 pannonian_heritage_desc:0 "The Pannonian tribes reside rich and fertile lands, an area which the invading Celtic tribes conquered in the 4th century BCE. While benefitting from the boons of their homeland, the Pannonians all the while make war often, especially against the Celts. "

 #Germania Heritages
 bastarnae_heritage:0 "Bastarnae Heritage"
 bastarnae_heritage_desc:0 "Celtic, Germanic, or Scythian, the cultural makeup of the Bastarnae is muddled. They are primarily farmers, inhabiting no large settlements or great cities. The Bastarnae have started to trade with the Scythians to their east, and tales of a rich land to their south. A great migration is in order."
 arktoseia_heritage:0 "Heritage of the Bear"
 arktoseia_heritage_desc:0 "Arktoseia- the city of the bear, was founded by the merchant and navigator Doron, Arktoseia is a colony in uncharted lands, far from the civilized lands of the Bosporans. The colony has done well, although their settlement has invoked the ire of the neighboring tribesmen."