l_english:
 ### Formable Decisions ###

 ## Levantine Formables ##
 # Aramaic Kingdom
 form_aramaic_kingdom:0 "Kingship over the Arameans"
 form_aramaic_kingdom_desc:0 "From the great cities of #E Darmashq#!, #E Qarqar#!, #E Halba#!, #E Tadhmor#!, and #E 'Adhma#!, to name a few of our fabulous cities, the many #Y Aramaic#! peoples have come together as one! We have been dominated by the #Y Assyrians#! for far too long, and played second fiddle to the #Y Neo-Hittites#! and #Y Phoenicians#! who surround us. Now, we take the center stage, long live the #E Kingdom of the Arameans#!!"
 ARAM_NAME:0 "Aram"
 ARAM2_NAME:0 "Kingdom of the Arameans"
 ARAM_ADJECTIVE:0 "Aramaic"
 form_aramaic_claims_tooltip:0 "Gain claims on the regions of #Y Syria#! and #Y Canaan#!."
 # Aram
 form_aram:0 "Claim Aram"
 form_aram_desc:0 "With the fall of the kingdom of #E Darmeshq#!, also called #E Aram#!, a power vaccum has ensued. We are now in a position to claim leadership of the #Y Aramaic#! people and take on the mantle of #E Aram#!."
 formable_not_aram_exists:0 "#Y Aram#! does not exist."
 # Palestine
 form_palestine:0 "Proclaim Kingdom of Philistine"
 form_palestine_desc:0 "We are called many things. The #Y Egyptians#! call us as the new #Y Hyksos#!. The #Y Greeks#! call us as the new #Y Philistines#!. Whatever we may be called, we have chosen to establish ourselves a new kingdom, the #E Kingom of Philistine#!. We have chosen the #Y Greek#! name for ourselves to distance ourselves from the #E Pharaohs#! in #E Egypt#! as we forge our own new destiny in the #E Levant#!.\n\n#R We will lose our #E Nomarchy#! government form.#!"
 PHOENICIA_NAME_2:0 "Form Philistine"
 PHOENICIA_ADJECTIVE_2:0 "Philistinians"
 # Kena'an
 ISRAEL_FORMABLE_NAME_2:0 "Form Kena'an"
 ISRAEL_FORMABLE_ADJECTIVE_2:0 "Kena'anite"
 # Kingdom of Ishmael
 form_ishmael:0 "Found the Kingdom of Isma'il"
 form_ishmael_desc:0 "Once cast out into the deserts, the prophet #Y Isma'il#! became patron of the #Y Qedarites#!. We now reclaim his rightful birthplace, for we are the sons of that very same #Y Isma'il#!, we are the righteous sons! May #E Alaha#! guide us to glory!"
 ISHMAEL_FORMABLE_NAME:0 "Kingdom of Isma'il"
 ISHMAEL_FORMABLE_ADJECTIVE:0 "Ismailite"
 
 ## Mesopotamian Formables ##
 # Chaldean Empire
 form_babylon:0 "Found Chaldean Empire"
 form_babylon_desc:0 "#E Babylon#! was once the home to the greatest of powers. For a long time, we suffered under the foot of the #Y Neo-Assyrians#!, until we gloriously broke free. Now we have come to dominate the lands we once struggled with under the Neo-Assyrians. The dawn of #Y Neo-Babylon#! has come, otherwise called the #Y Chaldean Empire#!."
 BABYLON_NAME_true:0 "Chaldean Empire"
 NINIVE_NAME:0 "Ninive"
 NINIVE_ADJECTIVE:0 "Ninivean"
 form_ninive: "Establish a Second Ninivean Kingdom"
 form_ninive_desc: "The loss of Ninive has brought our kingdom into a downward spiral. #Y Assyria#!, the ruiner of our once prosperous land, must be brought to justice. Let a second #Y Kingdom of Ninive#! be declared, and a new dawn will shine upon our people."
 form_ninive_claims_tooltip:0 "Ninive will gain claims on the region of #Y Assyria#!."
 SUBARTU_NAME: "Subartu"
 SUBARTU_ADJECTIVE:0 "Subari"
 form_subartu_claims_tooltip:0 "Subartu will gain claims on the regions of #Y Assyria#!, #Y Naharin#! #Y Zagros#! and #Y Mesopotamia#!."
 subartu_mod:0 "Subartu Reborn"
 form_subartu: "Reform the Kingdom of Subartu"
 form_subartu_desc: "Our people once ruled the land between the rivers #Y Tigris#! and #Y Euphrates#!, and at the foothills of the #Y Zagros#!. We are an ancient people, and we do not forget our past wrongs. We must enact our revenge, reclaim our lands, and smite those who had reduced us to a petty tribe dwelling in the mountains. #Y Subartu#! is reborn!"
 NHITTITE_NAME: "Hittite Kingdom"
 NHITTITE_ADJECTIVE:0 "Hittite"
 NHITTITE_NAME_2:0 "Hittite League"
 form_hittite_claims_tooltip:0 "The Hittite Kingdom" will gain claims on the provinces of #Y Cicilia Pedias#!, #Y Syria#!, #Y Apamene#!, and #Y Cyrrhestica#!"
 hittite_mod:0 "Hittite Royal Chariots"
 form_hittite_kingdom: "Unite the Hittites"
 form_hittite_kingdom_desc: "Our ancestors once ruled over a mighty realm in Anatolia. Although the days of the Hittite Empire are long gone, we, the Hittite people still remain. Let us unite, and forge a new path."
 form_hurria:0 "Unite the Hurrians"
 form_hurria_desc:0 "The Hurrians are as old as the land we walk beneath. And yet, our people have long suffered under foreign rule, we being the exception. As the last of the Hurrians, it is our duty to bring the flame back to our lands."
 HURRIA2_NAME:0 "Khourrian Federation"
 HURRIA2_ADJECTIVE:0 "Khourrian"
 form_hurria_claims_tooltip:0 "The #Y Khourrian Federation#! will gain claims on the region of #Y Naharin#!."
 hurria_mod:0 "Hurria Reborn"
 
 # Urartu
 URARTU_NAME: "Urartu"
 URARTU_ADJECTIVE: "Urartian"
 form_urartu_claims_tooltip:0 "Urartu will gain claims on the regions of #Y Naharin#!, #Y Assyria#!, #Y Zagros#!, #Y Armenia#!, and #Y Syria#!"
 urartu_mod:0 "Legacy of Urartu"
 form_urartu: "Restore Sardurid Legacy"
 form_urartu_desc: "Our dynasty, the last of the #Y Sardurids#!, is the only nation that can truly claim the mantle of the #Y Urartian Kingdom#!. By controlling the lands of what once belonged to #Y Urartu#!, at last we can avenge our ancestors. May #Y Khaldi#! once again lead #Y Urartu#! to prosperity!"
 gotn_formable_event_3_title:0 "Return of Urartu Identity"
 gotn_formable_event_3_desc:0 "With the legacy of the #E Sardurids#! renewed, we can choose to reinstate the #E Urartu#! national identity. The #E Urartu#! were a noble social class, thus, reasserting that we are #E Urartu#! will cause many to identify with this class. Otherwise, we can continue our ways as #E Urartu#! descended royals ruling over a core of #E Sophene#! people. The choice is ours to make."
 gotn_formable_event_3.a:0 "The #Y Urartu#! identity is reinstated!"
 gotn_formable_event_3.b:0 "Our kings, #Y Urartu#!; our people #Y Sophene#!."
 urartu_assimilation_effect_tt:0 "Up to #Y 10%#! of our non-#E Sophene#! pops will be #E assimilated#! into #E Urartu#! culture."
 
 ## Italy Formables
 # Shikala
 SHIKALA_NAME:0 "Shikala"
 SHIKALA_ADJECTIVE:0 "Shekelesh"
 form_shikala:0 "Form Shikala"
 form_shikala_desc:0 "With power consolodated across the island of #Y Shikala#!, the ancient home of the #Y Shekelesh#! has been claimed by the kin of the #Y Nile#!. We shall usher in a new era for this island, a rare piece of #Y Kemet#! away from #Y Kemet#!." 
 # Sardin
 SARDIN_NAME:0 "Sardin"
 SARDIN_ADJECTIVE:0 "Sardin"
 formable_not_sardin_exists:0 "#Y Sardin#! doesn't exist."
 sardin_mod:0 "Punic Dominance"
 form_sardin:0 "Declare Punic hegemony over Sardin"
 form_sardin_desc:0 "For generations we have inhabited these islands, building, farming, and trading. If we wish to prove ourselves as the true #Y Punic#! power, we must subjugate the #Y Sardinians#!."
 culture_country_nura_tt:0 "At least 40% of the people in [SCOPE.GetRootScope.GetCountry.GetName] are #Y Punic#!."
 # Kyrnos 
 KYRNOS_NAME:0 "Kyrnos"
 KYRNOS_ADJECTIVE: "Kyrnossan"
 formable_not_kyrnos_exists:0 "#Y Kyrnos#! doesn't exist"
 kyrnos_mod:0 "Reclamation of Alalia"
 form_kyrnos:0 "Form Kyrnos"
 form_kyrnos_desc:0 "Over 140 years ago, those accursed #Y Etruscans#! forced us out of our city, #Y Alalia#!. Between them and the #Y Corsians#!, the island of Kyrnos must be controlled by one group. We will reconquer #Y Alalia#!, and take Kyrnos for ourselves!"
 # Etruria Padana
 ETRURIA_PADANA_NAME:0 "Etruria Padania"
 ETRURIA_PADANA_ADJECTIVE:0 "Etrurian"
 form_etruria_padana:0 "Reclaim the cities of Padanian Etruria"
 form_etruria_padana_desc:0 "We have carved out an #Y Etruria#! for ourselves, here in #Y Padania#!. The #Y Lepontic#! tribes have stabbed a knife through our homeland, sacking our cities and conquering them for themselves. Our land must be reclaimed."
 etruria_padana_claims:0 "We will gain claims on the region of #Y Cisalpine Gaul#!, and on the province of #Y Ariminum#!"

 # Rome 
 form_rome_liberate:0 "Reclaim Roma"
 form_rome_liberate_desc:0 "In 358 BCE, the #Y Faliscan League#! bested us, and forced us out of our city, #Y Roma#!. Our pride as a people has been broken, and we must seek venegance upon our enemies. #Y Roma#! must be retaken."
 gotn_formable_event__title:0 "A Change in Course?"
 gotn_formable_event__desc:0 "Gazing out onto #Y Roma#!, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] contemplates the future of the #Y Latin#! people. By will alone, #Y Roma#! has been retaken. But the question remains- perhaps the traditions of our ancestors could ensure the strength of our people."
 gotn_formable_event_.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] will be crowned as Rex!"
 gotn_formable_event_.b:0 "It would be foolish to place our trust in the glories of the past."
 ROME_NAME:0 "Roman Kingdom"
 ROME_ADJECTIVE:0 "Roman"
 rome_monarchy:0 "#R We will abadon the trappings of our league, and become a monarchy#!."
 rome_republic:0 "#G We will stay true to our republican ways#!."

 form_calque_trinacria:0 "Form Calque Trinacria"
 form_calque_trinacria_desc:0 "Although we are not as established as the #Y Sicels#! or the #Y Greeks#!, the three-pointed island should be ours to conquer."
 CALQUE_TRINACRIA_NAME:0 "Calque Trinacria"
 CALQUE_TRINACRIA_ADJECTIVE:0 "Trinacrian"
 formable_not_calque_trinacria_exists:0 "#Y Calque Trinacria#! does not exist."
 form_calque_trinacria_claims_tooltip:0 "Calque Trinacria will gain Claims on the Provinces of #Y Sicania#!, #Y Siculia#!, and #Y Syracuse#!."
 


 ## Iberia Formables
 IBERIA_NAME2:0 "Spania"
 IBERIA_ADJECTIVE2:0 "Spanian"
 form_spania:0 "Form Spania"
 form_spania_desc:0 "The #Y Ibero-Punic#! people of #Y Iberia#! call this land #Y Spania#!, and henceforth all shall know it as the great land of the #Y Spanians#!! From humble origins being the furthest of #Y Phoenecian#! coloniae, we now proclaim ourselves a proper powerhouse of this land, on the exact opposite side to that of our forefathers."
 LEAGUE_NAME:0 "Maareb"
 LEAGUE_ADJECTIVE:0 "Spanian"
 form_league:0 "Form Maareb"
 form_league_desc:0 "#Y Maareb#!, the land of the setting sun, is the farthest area settled by our ancestors from #Y Phoenica#!. The wealthy and prosperous cities of #Y Maareb#! could rival the great cities of the east, if only our peoples could be united."
 maareb_claims:0 "We will gain claims on the regions of #Y Mauretania#! and #Y Baetica#!."
 maareb_mod:0 "Maareb Mercantilism"
 form_bastetania:0 "Unite Bastetania"
 form_bastetania_desc:0 "The various tribes of the Bastetani have alwasy existed separate from each other. But, to unite our lands would ensure the prosperity of our people, and would allow us to break free from the influence of the #Y Spanians#! and the #Y Massalians#!."
 form_bastetania_claims_tooltip:0 "Bastetania will gain claims on the regions of #Y Baetica#! and #Y Contestania#!."
 formable_not_bastetania_exists:0 "#Y Bastetania#! does not exist."
 BASTETANIA_NAME:0 "Bastetania"
 BASTETANIA_ADJECTIVE:0 "Bastetanian"
 

 ## Greek Formables
 formable_eteocrete:0 "Minoa"
 GPAEONIA_NAME:0 "Greater Paeonia"
 GPAEONIA_ADJECTIVE:0 "Paeonian"
 form_greater_paeonia_claims_tooltip:0 "We will recieve claims on the regions of #Y Macedon#! and #Y Thrace#!"
 paeonia_mod:0 "Greater Paeonia Realized"
 form_greater_paeonia: "Reclaim our Ancestral Lands"
 form_greater_paeonia_desc: "In our tribal halls, Stories are still told of times when our people roamed from the mountains Macedon, to the abundant plains and forests of Thrace, and when we walked along the Propontis, and touched the sea. Such idyllic times seem like a dream, but our people are not one to give up so easily. By will alone, we could recreate our lost realm, and walk on the fields of Thrace once again."
 TROAS_NAME:0 "Troas"
 TROAS_ADJECTIVE:0 "Troan"
 troas_mod:0 "Cities of The Troad"
 formable_not_troas_exists:0 "#Y Troas#! does not exist." 
 form_troas:0 "Unite the Cities of The Troad"
 form_troas_desc:0 "The cities of #Y The Troad#! are home to merchants, philosophers, and proud leaders. Uniting our polities would protect us from foreign interence, and become a formidable state."
 ##Hellenic Empire
 formable_not_argead_exists: "The #Y Hellenic Empire#! does not exist."
 hellenic_kingdom_tooltip:0 "The #Y Hellenic Empire@! will recieve claims on the regions of #Y Macedon#!, #Y Thrace#! , #Y Greece#! , #Y Lydia#! , #Y Moesia Inferior#! , #Y Taurica#! , #Y Colchis#! , #Y Bithynia Et Paphlagonia#! , #Y Cappadocia Pontica#! #Y Cyrenaica#! #Y Cicilia#! , #Y Illyria#! , #Y Magna Graecia#! , #Y Transalpine Gaul#! , #Y Tarraconensis#! , #Y Contestania#! , #Y Baetica#! , and #Y Mauretania#!."
 hellenic_kingdom_mod:0 "Pan-Hellenic Dream Realized"
 form_argead_unification:0 "Unite the Children of Hellen"
 form_argead_unification_desc:0 "From the fertile lands of #Y Magna Graecia#!, to the ancient cities of #Y Greece#!, and to the colonies of the west, the Greek people have long been scattered, never being united by one group. By controlling the various poleis of the Hellenes, we can forge a new legacy- that of a new, #Y Pan-Hellenic Kingdom#!"
 form_aegea:0 "Form Aegea"
 form_aegea_desc:0 "The Aegean sea is named after Aegeus, the father of Theseus who threw himself into the ocean, believing his son had perished to the Minotaur. Despite the tragic origins of the sea we call home, the various Aegean islands have been prosperous, each having their own important role in Greek history. We will forge our own path, and not be subject to any power who may seek to conquer us, Lydian, Macedonian, or otherwise."
 form_aegea_claims_tooltip:0 "#Y Aegea#! will gain claims on the regions of #Y Greece#!, #Y Macedonia#!, and #Y Lydia#!."
 formable_not_aegea_exists:0 "#Y Aegea#! does not exist#!."
 greece_events_11_title:0 "Aegean Disputes"
 greece_events_11_desc:0 "After uniting the Aegeans, there have been many different factions, with differing opinions on how we should run our new nation. The Delians claim we should place our league capital there, as it is a good neutral ground. The Rhodians claim the great city of [GetProvince('(int32)266').GetName] would be the perfect defensible position, whilst others advocate for not chaning our capital. Strangely, there has been one man claiming that we can 'rebuild Atlantis', whatever that means. What lunacy!"
 greece_events_11.a:0 "Delos, the second most holy site in Greece!"
 greece_events_11.c:0 "Rhodes, the city that survived the Lydian onslaught."
 greece_events_11.d:0 "We will make do with our current capital."
 greece_events_11.e:0 "Atlantis you say?"
 thera_switch_tt:0 "#Y Thera#!, a once great city of the Minoans, and a theorized location of #Y Atlantis#!, will become our capital.\nWe will gain #G unique#! decisions regarding the island of #G Crete#! and #G Cyrenaica#!, and we will adopt a new #G heritage#!.\nThis option is available because your ruler is either a lunatic, foolish, eccentric, dumb, or arrogant."
 delos_mod:0 "Delian League Capital"
 desc_delos_mod:0 "Delos, in addition to being one of the holiest sites for the Greeks, serves as the treasury and capital of the Delian League."
 delos_country_mod:0 "Delian Prestige"
 rhodes_country_mod:0 "Rhodian Thalassocracy"
 RHODES_LEAGUE_NAME:0 "Rhodian League"
 RHODES_LEAGUE_ADJECTIVE:0 "Rhodian"
 THERA_NAME:0 "Thera"
 THERA_ADJECTIVE:0 "Theran"
 thera_heritage:0 "Heritage of Atlantis Reborn"
 thera_heritage_desc:0 "Seemingly, a new Aegean state has arisen, claiming to not only have discovered the site of Atlantis, in the ruins of Thera. In the reconstructed city, the heritage of the Minoans lives on."
 thera_mod:0 "Atlantis?"
 

 ## Keltika
 form_keltike:0 "Form Keltike"
 form_keltike_desc:0 "#Y Keltike#!, the land of the #Y Celts#! has been inhabited by #Y Greeks#! for over 300 years. At times enemies, and at times friends, we have come to know these people well. However, it has become clear that #Y Massalian#! ambitions lie in the rich lands to our north, we are not interested in the goings on between the #Y Spanians#! and the foolish ambitions of the #Y Atlosians#!. Our destiny lies in conquering #Y Keltike#!."
 formable_not_keltika_exists:0 "#Y Keltike#! does not exist."
 form_keltika_claims_tooltip:0 "Keltike will gain Claims on the Regions of #Y Armorica#!, #Y Belgica#!, #Y Celtica#!, #Y Germania Superior#!, #Y Aquitania#!, and #Y Transalpine Gaul#!, and the Provinces of #Y Verbigenia#!, #Y Helvetia#!, #Y Alpes Graiae#!, #Y Transpadana#!, and #Y West Insubria#!."
 KELTIKA_NAME:0 "Keltike"
 KELTIKA_ADJECTIVE:0 "Keltikoi"
 keltika_mod:0 "Victorious Greeks"
 # Magna Kymaia
 form_kymai_magna:0 "Proclaim a Greater Kymai"
 form_kymai_magna_desc:0 "We have long been the preminent power in Campania, defeating the Samnites and Latins in battle more than once. But our recent decline in power, and the ambitions of the Samnites have begun to threaten our position. Not to mention the so called 'Walnut League' of the Nucerians, who surely have ambitions of their own. We cannot even trust our daughter city- Neapolis may soon overtake us. It is imperative to the survival of our city, that we establish a 'Greater Kymai,' no matter the cost."
 formable_not_kymai_magna_exists:0 "#Y Magna Kymaia#! does not exist."
 form_kymai_magna_claims_tooltip:0 "Magna Kymaia will gain claims on the province of #Y Campania#!."
 KYMAI_MAGNA_NAME:0 "Magna Kymaia"
 KYMAI_MAGNA_AJDECTIVE:0 "Kymaian"
 gotn_formable_event_8_title:0 "Campanian Conquest"
 gotn_formable_event_8_desc:0 "Led by the sheer tact and genius of our leader [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], Kymaia Magna has been achieved. No longer will we be bothered by our bickering neighbors. Kymai will usher in a new golden age for the Italiote people!"
 gotn_formable_event_8.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] will be crowned as Basileus, the first Italiote King."
 gotn_formable_event_8.b:0 "An abandonment of our ways would result in the loss of everything that has led us to victory."
 kymaia_option_a:0 "We will become the #Y Italiote Kingdom#!, we will gain claims on the region of #Y Magna Graecia#!, and we will adopt a new heritage."
 kymaia_option_b:0 "We will retain our ancient ways of republicanism"
 ITALIOTE_KINGDOM_NAME:0 "Italiote Kingdom"
 ITALIOTE_KINGDOM_ADJECTIVE:0 "Italiote"

 ILLYRIA_GREEK_NAME:0 "Illyrian League"
 ILLYRIA_GREEK_ADJECTIVE:0 "Illyrian"
 illyria_greek_mod:0 "Philosphers of Illyria"
 formable_not_illyria_greek_exists:0 "The #Y Illyrian League#! does not exist." 
 form_illyria_greek_claims_tooltip:0 "We will gain claims on the region of #Y Illyria#!"
 form_illyria_greek:0 "Form the Illyrian League"
 form_illyria_greek_desc:0 "The #Y Greek#! colonies of #Y Illyria#!, although younger and smaller when compared to the colonies of #Y Magna Graecia#!, could become just as strong. In order to do this, a league of our cities should be formed."

 ## Africa Formables
 ATLAS_NAME:0 "Atlas"
 ATLAS_ADJECTIVE:0 "Atlosian"
 form_atlas:0 "Form Atlas"
 form_atlas_desc:0 "The namesake of our mighty people, the #Y Atlas Mountains#!, has fallen under our glorious rule. All shall crumble under the power of #Y Atlas#!!"
 ## Kena'an Hadasht
 KENAAN_HADASHT_NAME:0 "Kena'an Hadasht"
 KENAAN_HADASHT_ADJECTIVE:0 "Kena'anite"
 formable_not_kenaan_hadasht_exists:0 "#Y Kena'an Hadasht#! does not exist." 
 form_kenaan_hadasht_claims_tooltip:0 "We will gain claims on the region of #Y Africa#!, #Y Numidia#!, #Y Mauretania#!, #Y Atlas#!, #Y Baetica#! and on the area of #Y Tetrapolitania#!, #Y Sardinia Australis#!, and #Y Sicania#!."
 form_kenaan_hadasht:0 "Unite the lands of New Canaan"
 form_kenaan_hadasht_desc:0 "Our people, prosperous and mighty, have established a new homeland, far from our ancestor's homes of #Y Phoenica#! and #Y Canaan#!. Scattered all across this land, a united #Y Kena'an Hadasht#! could lead the #Y Punic#! peoples into a new golden age."
 kenaan_hadasht_mod:0 "Punic People United"
 kenaan_hadasht_capital:0 "Great Punic Capital"
 gotn_formable_event_6_title:0 "Punic Unification"
 gotn_formable_event_6_desc:0 "Led by [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], a new #Y Punic#! state has been declared. This state, called #Y Kena'an Hadasht#!, encompasses the homelands of the #Y Punic#! people, a feat which has never been accomplished before. Who can say what this mighty new power might be able to do."
 gotn_formable_event_6.a:0 "May Lord #Y Melqart#! bless us with prosperity, and may #Y Tanit#! lead us to victory!"
 gotn_formable_event_6.b:0 "We should be ashamed that we were not the ones to claim this mantle..."

 
 tetrapolitania_mod:0 "Great Emporion of Tetrapolitania"
 formable_not_tetrapolitania_exists:0 "#Y Tetrapolitania#! does not exist." 
 TETRAPOLITANIA_NAME:0 "Tetrapolitania"
 TETRAPOLITANIA_ADJECTIVE:0 "Tetrapolitanian"
 form_tetrapolitania:0 "Unite the Four Cities"
 form_tetrapolitania_desc:0 "After the implosion of the great #Y Garamantic#! realm, the independence of the #Y Tetrapolitanian#! cities; [GetProvince('(int32)3303').GetName], [GetProvince('(int32)3306').GetName], [GetProvince('(int32)3324').GetName], and [GetProvince('(int32)3325').GetName] are increasingly being threatened by tribal raids. A region that has long coexisted, perhaps it would be best if we were to unite these cities."
 
 LIBYA_NAME:0 "Libya"
 LIBYA_ADJECTIVE:0 "Libyan"
 libya_mod:0 "Warriors of Libya"
 formable_not_libya_exists:0 "#Y Libya#! does not exist." 
 form_libya_claims_tooltip:0 "We will gain claims on the regions of #Y Cyrenaica#!, and #Y Lower Egypt#!"
 form_libya:0 "Form Libya"
 form_libya_desc:0 "Our people have lived in these lands for time immemorial. The shifting sands may cover up other peoples, but we, the #Y Libyans#! are the undisputed masters of the deserts. Let us push out from our desert homelands, and retake what has been lost to us by the #Y Greeks#! and #Y Egyptians#!."

 ## Zagros Formables
 KASSITE_NAME:0 "Neo-Kassite Kingdom"
 KASSITE_ADJECTIVE:0 "Kassite"
 form_kassite:0 "Restore Kassite Babylon"
 form_kassite_desc:0 "The once great #Y Kassite#! realm dominated #Y Mesopotamia#!. Unfortuantely, our ancestors fell during the #Y Bronze Age Collapse#!, pushed into the mountains, and for a thousand years #Y Mesopotamia#! has not been ours. Now, we have come back to our rightful thrones. Once more, the #Y Four Corners of the Universe#! will belong to US!"
 formable_not_kassite_exists:0 "The #Y Kassite Kingdom#! does not exist."

 LULLUBI_NAME:0 "Lullubi Kingdom"
 LULLUBI_ADJECTIVE:0 "Lullu"
 form_lullubi:0 "Restore Lullubi Kingdom"
 form_lullubi_desc:0 "Once, the #Y Lullu#! tribes were united. They represented a front against the ever-meddling and ever-haughty #Y Mesopotamians#!. Whether from #Y Babylon#! or #Y Asshur#!, neither would conquer the mighty #Y Zagrosian#! kingdom of #Y Lullu#!. Today we bring back our beloved past, restoring the #E Lullubi Kingdom#!!"
 formable_not_lullubi_exists:0 "The #Y Lullubi Kingdom#! does not exist."

 GUTIAN_KINGDOM_NAME: "Gutian Kingdom"
 GUTIAN_KINGDOM_ADJECTIVE: "Gutian"
 formable_not_gutian_kingdom_exists: "#Y The Gutian Kingdom#! does not exist#!."
 form_gutian_kingdom:0 "Pronounce a new Gutian Kingdom"
 form_gutian_kingdom_desc:0 "Although we are only related in name to the Gutians who once ruled Babylon, it would be wise of us to settle in the rich, fertile lands of Babylon, and create a kingdom of our own."

 ZAGROS_NAME:0 "Zagrosia"
 ZAGROS_ADJECTIVE:0 "Zagrosian"
 form_zagrosia:0 "Form Zagrosia"
 form_zagrosia_desc:0 "The many tribes and peoples of the #Y Zagros Mountains#! have never been united, yet all of them share many features. Raiding the rich lands to the west, east, north, or south; living in the tall, mighty mountains; and fighting like warriors until the last man. We will forge a #G New Cultural Identity#! as #Y Zagrosians#!!"
 formable_not_zagrosia_exists:0 "#Y Zagrosia#! does not exist."
 zagros_claims:0 "Gain claims on the #Y Zagrosia#! region."

 TUKRI_NAME:0 "Turukkean Kingdom"
 TUKRI_ADJECTIVE:0 "Tukri"
 form_turukkea:0 "Form the Turukkean Kingdom"
 form_turukkea_desc:0 "The #Y Tukri#! are some of the most fierce and warlike people in the #Y Zagros#!. To our north, the disintegrating #Y Median Empire#! lies, rich for the taking. To the south, we are bordered by other #Y Zagrosian#! tribes. It would be wise to unite our people into something more centralized."
 formable_not_turukkean_exists:0 "the #Y Turukkean Kingdom#! does not exist."

 ## Anatolia Formables
 CIMMERIA_NAME:0 "Cimmeria"
 CIMMERIA_ADJECTIVE:0 "Cimmerian"
 form_cimmeria_claims_tooltip:0 "We will gain claims on the regions of #Y Phrygia#! and #Y Lydia#!"
 cimmeria_mod:0 "Cimmerians of Anatolia United"
 formable_not_cimmeria_exists:0 "#Y Cimmeria#! does not exist."
 form_cimmeria:0 "Unite the Cimmerians of Anatolia"
 form_cimmeria_desc:0 "Our people were once the scourge of the great civilizations, before we were reduced to simple plains and mountain dwellers. By uniting the #Y Cimmerians#! of #Y Anatolia#!, we could once again ride out onto the plains of #Y Phyrgia#!, and remind all of our might."
 gotn_formable_event_5_title:0 "Cimmerian Resurgence"
 gotn_formable_event_5_desc:0 "Many years ago, the #Y Cimmerian#! people led many great attacks all over #Y Anatolia#!, #Y Mesopotamia#!, and the #Y Levant#!. We had long assumed these people to be simple plains and mountain dwellers, no longer relevant. But, word has reached our capital of a new #Y Cimmerian#! state, one that is preparing for another great invasion..."
 gotn_formable_event_5.a:0 "May our gods save us...."
 gotn_formable_event_5.b:0 "Bah! We have defeated these horse riders once before, we shall defeat them again."
 # Kios Lydia
 KIOS_LYDIA_NAME:0 "Lydia"
 KIOS_LYDIA_ADJECTIVE:0 "Lydian"
 form_kios_lydia:0 "Claim the Lydian Throne"
 form_kios_lydia_desc:0 "#Y Mithradates II#! has long dreamt of ruling the rich throne of #Y Lydia#!. The increasingly weak and ineffective rulers of #Y Lydia#! have proven unable to maintain a grip on their empire. It is up to us to take #Y Lydia#!, and her riches, for ourself."
 kios_lydia_claims:0 "We will gain claims on the regions of #Y Asia#!, #Y Phyrgia#!, and #Y Bithynia et Paphlagonia#!"
 kios_lydia_mod:0 "Mithradates' Dream Realized"
 gotn_formable_event_7_title:0 "Cultural Changes"
 gotn_formable_event_7_desc:0 "By might alone, we have established ourselves as the true succesor of the #Y Lydian Kingdom#!. However, there is serious debate as to whether we should adopt the ways of our subjects. After all, it served #Y Mithradates#! well when he came to control #Y Kios#!."
 gotn_formable_event_7.a:0 "We have no reason to maintain our #Y Propontic#! ways, we should adopt #Y Lydian#! practices."
 gotn_formable_event_7.b:0 "We have conquered these people, their ways are not worth adopting."
 kios_lydia_culture_change:0 "We will change our primary culture to #Y Lydian#!."
 kios_lydia_culture_change_2:0 "#R Our Lydian subjects will become unhappy#!"
 lydian_dissent:0 "Unhappy Lydians"

 MYSIA_NAME:0 "Mysia"
 MYSIA_ADJECTIVE:0 "Mysian" 
 form_mysia_claims_tooltip:0 "We will gain claims of the areas of #Y Mysia Inferioris#! , #Y Mysia Superioris#! , #Y Bithynia Inferioris#! , and #Y Bithynia Superioris#!." 
 formable_not_mysia_exists:0 "#Y Mysia#! does not exist."
 form_mysia:0 "Proclaim a true Mysian Kingdom"
 form_mysia_desc:0 "The Mysian people have long inhabited these lands, and it has been many years since a true #Y Mysian#! Kingdom was established. Although we have indeed prospered under the rule of the Lydians, we must seek our own destiny."

 ## Keltika Formables
 form_salluvian_confederacy:0 "Form the Salluvian Confederacy"
 form_salluvian_confederacy_desc:0 "For generations now, we, the #Y Salluvian#! people, have been the pawns and fodder for both #Y Massalian#! and #Y Arvernian#!. At times we have resisted subjugation, and that has only led us to defeat. If we wish to survive, our tribes must confederate. Only then will be able to seek our true destiny in this world."
 formable_not_salluvian_confederacy_exists:0 "The #Y Salluvian Confederacy#! does not exist."
 form_salluvia_claims_tooltip:0 "the #Y Salluvian Confederacy#! will gain claims on the region of #Y Transalpine Gaul#!."
 SALLUVIA_NAME:0 "Salluvian Confederacy"
 SALLUVIA_ADJECTIVE:0 "Salluvian"

 ## Persia Formables
 form_agartia:0 "Unite the Agartians"
 form_agartia_desc:0 "The #Y Agartians#! have long existed as many disparate, bickering entities. It was only until the #Y Median#! conquest that we were consolidated in some form. No one is safe to the sands of time, and it is clear that our future lies united, lest we be blown away in the wind."
 formable_not_agartia_exists:0 "#Y Agartia#! does not exist."
 form_agartia_claims_tooltip:0 "#Y Agartia#! will gain claims on the region of #Y Parthia#!, and on the areas of #Y Aria#!, #Y Tabiene#!, #Y Drangiana#!, and #Y Pactya#!."
 AGARTIA_NAME:0 "Agartia"
 AGARTIA_ADJECTIVE:0 "Agartian"

 form_haltami:0 "Form Haltamti"
 form_haltami_desc:0 "[GetProvince('(int32)4950').GetName] once belonged to us, before it was stolen by the Achaemenids, and we were forced into their servitude. No longer will we tolerate foreign subjugation of our lands, all of Haltami is rightfully ours!"
 HALTAMI_NAME:0 "Haltamti"
 HALTAM_ADJECTIVE:0 "Haltamtian"
 form_haltami_claims_tooltip:0 "#Y Haltamti#! will gain claims on the region of #Y Mesopotamia#!."
 formable_not_haltamti_exists:0 "#Y Haltamti#! does not exist."
 

 ## Illyria-Pannonia-Dacia Formables
 form_pannonia:0 "Form Pannonia"
 form_pannonia_desc:0 "The riches of our land have made us the targets who those who would wish to usurp them from us - the Celts. We must unite our people, drive out the Celts, and take back our land."
 PANNONIA_NAME:0 "Pannonia"
 PANNONIA_ADJECTIVE:0 "Pannonian"
 form_pannonia_claims_tooltip:0 "#Y Pannonia#! will gain claims on the region of #Y Pannonia#!, and on the provinces of #Y Marsonia#! and #Y Deuria#!."
 formable_not_pannonia_exists:0 "#Y Pannonia#! does not exist."
 form_illyria_slavia:0 "Balto-Slavic Illyria"
 form_illyria_slavia_desc:0 "We have travled far from our ancestral lands, and we land of great riches, a far cry from our barren homeland. Perhaps this could be our new home."
 ILLYRIA_SLAVIA_NAME:0 "Illyria-Slavia"
 ILLYRIA_SLAVIA_ADJECTIVE:0 "Illyrian"
 formable_not_illyria_slavia_exists:0 "#Y Illyria-Slavia#! does not exist."
 form_illyria_slavia_claims_tooltip:0 "#Y Illyria-Slavia#! will gain claims on the region of #Y Illyria#!."

 ## Arabia Formables ##
 form_magania:0 "Form Magania"
 form_magania_desc:0 "The many trade-oriented kingdoms and republics of the Magani are prosperous and wealthy, even under the thumb of foreign powers. Together, we could be wealthy beyond the wildest dreams of Babylon, and more powerful that the Achaemenid Persians."
 formable_not_magania_exists:0 "#Y Magania#! does not exist."
 MAGANIA_NAME:0 "Magania"
 MAGANIA_ADJECTIVE:0 "Magani"
 form_magania_claims_tooltip:0 "#Y Magania#! will gain claims on the region of #Y Arabia#!."
 magani_mod:0 "United Magani"

 ### Reaffirmation Decisions ###
 # Reaffirm Media
 affirm_media:0 "Reaffirm Median Dominance"
 affirm_media_desc:0 "The Median Empire has suffered a collapse of order, however, through tenacity and sheer will, the return of #Y Median#! hegemony is here! No more #E Achaemenids#! to slow us down, we shall conquer the world!"

 # Reaffirm Assyria
 affirm_assyria:0 "Reaffirm Assyrian Dominance"
 affirm_assyria_desc:0 "The Neo-Assyrian Empire suffered a slow, painful collapse. We have utterly rebounded and reclaimed our lands. The return of #Y Neo-Assyria#! is upon us!"

 ### Hegemony Decisions ###
 hegemony_thebes:0 "Declare Theban Hegemony"
 hegemony_thebes_desc:0 "There has long been no one strongest power in #Y Greece#!. If #Y Thebes#! seeks greatness, we must defeat the #Y Thessalians#!, establish firm control over #Y Boeotia#!, subjugate the meddling #Y Aetolians#!, and conquer the #Y Hellespont#!. Only then, will we be able to say we are the strongest."
 theban_hegemony_mod:0 "Theban Hegemony"
 hegemony_thebes_claims_tooltip:0 "#Y Thebes#! will gain claims on the regions of #Y Greece#! and #Y Macedon#!."

 hegemony_korinth:0 "Declare Korinthian Hegemony"
 hegemony_korinth_desc:0 "#Y Korinth#! must rise above our local rivals, and subjugate them or conquer them outright. The time has come to declare #Y Korinth#! as the true ruler of #Y Greece#!."
 hegemony_korinth_claims_tooltip:0 "#Y Korinth#! will gain claims on the regions of #Y Greece#!, #Y Macedon#!, and #Y Magna Graecia#!."

 ## Extras ##

 # Zagrosian Culture Group
 change_culture_group_tt:0 "We will change into the #Y Zagrosian Culture Group#!, and every province we own with a #E Zagrosian Identity#! will also change into the #Y Zagrosian Culture Group#!."
 dont_culture_group_tt:0 "We will keep our current primary culture and not promote a #Y Zagrosian#! identity."
 gotn_formable_event_2_title:0 "Zagrosian Ethnogenesis"
 gotn_formable_event_2_desc:0 "As many have pointed out, the many tribes and peoples of the #E Zagros Mountains#! have never been united before. And now that we have, we can easily call upon our shared cultural values, as despite our many diverse and disparate groups, we share many features. Raiding the rich lands to the west, east, north, or south; living in the tall, mighty mountains; and fighting like warriors until the last man. This presents us with the striking possibility to promote an #E ethnogenesis#!, creating a new shared cultural grouping known as #E Zagrosian#!."
 gotn_formable_event_2_a:0 "We are Zagrosians first, [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] second."
 gotn_formable_event_2_b:0 "We are [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] first, Zagrosians second."

 # Tadmor Culture Decision #
 tadmor_culture_switch:0 "Aramaic Influence"
 tadmor_culture_switch_desc:0 "It is undeniable that the influence of the #Y Arameans#! has been very strong. Many amongst us have begun to question our own ways, and wonder if the traditions of the #Y Arameans#! would be better suited for our rule."
 tadmor_culture_decision_tt:0 "We will decide whether to #G integrate#! or #G adopt#! #Y Aramaic#! ways."
 gotn_formable_event_9_title:0 "Aramaic Influence"
 gotn_formable_event_9_desc:0 "We must decide whether to accept the #Y Arameans#! into our culture, or adopt their ways. In many ways we are already #Y Aramaic#! in all but name, and the advantages of doing so are too great to pass up- we might finally be seen as a 'proper' realm, and not just some nomads from the desert who cannibalized the corpse of a dying kingdom."
 gotn_formable_event_9.a:0 "So be it- we are now #Y Arameans#!."
 gotn_formable_event_9.b:0 "#Y Qedarite#! ways are just fine, but I could learn to live with an #Y Aramean#!."
 tadmor_culture_decision_01:0 "We will switch cultures to #G Aramaic#!"
 tadmor_culture_decision_02:0 "#G Aramaic#! will become an integrated culture."
 aramaic_acceptance:0 "Accepted Arameans"
 tadmor_aramaic:0 "Aramaic Tadmor"
 culture_capital_tadmor_tt:0 "At least 50% of the free people in the territory of [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] (#Y [SCOPE.ScriptValue('majority_of_free_men_in_capital_svalue')|0] #! Non-Slave Pops) are #Y Aramaic#!."
 culture_country_tadmor_tt:0 "At least 20% of the people in [SCOPE.GetRootScope.GetCountry.GetName] are #Y Aramaic#!." 

 # Tyras Colony #

 tyras_colony_decision:0 "Colonial Ventures"
 tyras_colony_decision_desc:0 "A man hailing from a foreign land by the name of Doron, seeks men and funds, so he can establish an emporion to facilitate trade between us, and his people, the Bastarnae. Doron's proposed location for a colony would be at [GetProvince('(int32)4945').GetName], near where the river Tyras comes to an end. Not much is known  about this land, but our Scythian contacts tell us that 'It is a land nearly devoid of inhabitants, and covered in thick forests.' Our ancestors ventured from the safety of [GetProvince('(int32)1973').GetName], to establish new cities in an unknown land. We should follow the traditions of our people, and do the same."
 greek_colonization_events_1_title:0 "Arktoseian Enterprises"
 greek_colonization_events_1_desc:0 "A messenger has arrived, one of the men that accompanied Doron on his journey\n\n[ROOT.GetCountry.GetRuler.GetName|E], I, Doron, have sent this letter detailing my voyage from [GetProvince('(int32)4525').GetName], and my succesful settlement at [GetProvince('(int32)4945').GetName].\nThe first several days sailing down the Tyras were uneventful- we passed unbothered through the territory of the Carpians, and after five days of sailing, we had entered the island-fortress of the [GetCountry('TYG').GetName], in which we rested and replenished our supplies. After our short stop, we set sail for the lands beyond the [GetCountry('TYG').GetName], the lands of the Scythians, which are mostly unknown to you Greeks. Despite several encounters with the horse-riders, after twelve longs days along the river Tyras, we managed to make it to our destination.\n\nI am pleased to report that our emporion is coming along well, and we expect trade to start flowing soon. -Doron"
 greek_colonization_events.1.a:0 "Well, that went better than expected!"
 riparum_release_as_subject_tt:0 "Release #Y Arktoseia#! as a #Y Colony#! of #Y Tyras#!."
 greek_colonization_events_1.b:0 "May we find prosperity in uncharted lands."
 riparum_switch_to_subject_tt:0 "We will #G tag switch#! to #Y Arktoseia#!."
 AKS:0 "Arktoseia"
 AKS_ADJ:0 "Artkoseian"

 ## Territory Decisions ##

 expand_malaca_mines:0 "Expand Southern Iberian Mining Operations"
 expand_malaca_mines_desc:0 "The metals and iron extracted from [GetProvince('(int32)1284').GetName] and [GetProvince('(int32)1367').GetName] are a crucial part of our economy, granting us valuable resources from which we can not only trade with, but with we can forge weapons of war. The Tartessians knew the value of these resources- we would be wise to expand these mines to the extent of our capabilities. An expansion on such a grand scale will deplete our local manpower and the mines themselves."
 expanded_malaca_mines:0 "Expanded Mining Operations"

 renovate_ardea:0 "Renovate Ardea"
 renovate_ardea_desc:0 "[GetProvince('(int32)9296').GetName] was once a prosperous and wealthy city. Since then, it has fallen into disrepair. It would greatly impress the local inhabitants if we were to restore their city."
 renovated_ardea:0 "Renovated Ardea"
 renovated_ardea_desc:0 "The ancient city of Ardea has been restored to it's former glory."
 