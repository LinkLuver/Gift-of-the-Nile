l_english:

 gotn_events_1_title:0 "Clash of the Cradle"
 gotn_events_1_desc:0 "#E #Y Median Empire#!#!\nThe #E Medians#! are the most dominant power in the entire known world, or so they were. After losses to the thorn in their side that is #E Achaemenid Persia#!, the #E Medians#! continue to lose influence in both west and east. Their troubles have only begun, as #E Armenia#! looks for any opportunity to turncoat, and the #E Saggartians#! look to leave the #E Median#! sphere for their #E Masdayasna#! brothers in #E Persia.#!\n\n#E #Y Achaemenid Kingdom#!#!\nDescended from the triumphant rebellion of #E Cyrus the Good#!, the #E Achaemenids#! have carved a realm out of the eastern satrapies that were once in the possession of the treacherous #E Medians#!. They have also begun to show their influence in the #E Persian Gulf#!, an endeavor that has left them quite at odds with the #E Babylonians#! to the west. Furthermore, their #E Elamite#! satrap refuses to help in any wars that don't involve them being granted territory... yet the last territory they want is #E Anshan#! itself.\n\n#E #Y Babylonian Kingdom#!#!\nThe #E Babylonians#! should have replaced the #E Assyrians#! on the world stage, yet failure to completely destroy the #E Assyrian Empire#! has come to bite the #E Babylonians#!. The #E Assyrians#! have only further declined, and they are now so weak that the #E Qedarites#! and #E Cardukoi#! have carved parts of their realm for themselves! Yet #E Babylon#! remains with hands tied behind their back, forced to tend to their #E Dilmunite#! colony against the #E Persian#! menace's influence.\n\n#E #Y Satrapy of Elam#!#!\nHas never once been happy with their share of the land. They would side against the #E Persians#! in the great #E Achaemenid#! civil war, switching sides at the promise of land being granted to them. Every time the #E Babylonians#!, #E Medians#!, or #E Achaemenids#! decide to war, the #E Elamites#! would take bribes on whether to fight or not. But what shall happen when the #E Elamites#! finally break free of all overlordship. It may be time for a new empire to arise!\n\n#E #Y Assyrian Empire#!#!\nThe #E Assyrians#! have faced centuries of decline. Slowly, they lost their influence over the #E Hebrew#! realms. In the next 50 years, the #E Damascans#! and #E Hamathi#! found independence. Then another half century, and #E Assyrian#! influence over #E Syria#! was nominal at best. Finally, the tribes from the deserts and the mountains alike came to carve their realms where #E Assyria#! once was. Even #E Nineveh#! fell, and for 30 years, it remained outside #E Assyrian#! control. Luckily, the fiddling kingdoms and empires of #E Media#!, #E Persia#!, #E Babylon#!, and #E Elam#! have had their backs turned, and we were able to reestablish a powerbase. What comes next is up to lord #E Asshur#!."
 gotn_events_1.a:0 "Who will be crowned King of the Crescent?"

 gotn_events_2_title:0 "The Fourth Intermediatary Period"
 gotn_events_2_desc:0 "#E #Y 27th Dynasty, Akhetaton#!#!\nThe great Dynasty of #E Atenkheper I#! has fallen into utter #E Isfet#!. Political fragmentation resulted in independent Nomes all across Egypt. Soon, a #E 28th Dynasty#! formed to take over the mantle. The #E 28th Dynasty#! succeeded in further weakening the Pharaoh in #E Akhetaton#!, and would have completely taken over if not for the opportunistic #E Menfer Nome#! foiling #E Henen-Nesut's#! dynastic plans. And due to this, even Upper Egypt would fragment, resulting in a recent new #E 29th Dynasty#! to appear on the Southern Border, following the traditional #E Kemetic#! faith. By the strength of #E Aten#!, the #E 27th Dynasty#! hopes to re-establish control, however the dying kingdom is surrounded by all sides by enemies.\n\n#E #Y 28th Dynasty, Henen-Nesut#!#!\nThe Dynasty at #E Henen-Nesut#! rose to prominence from the crumbling #E 27th Dynasty#!. They would quickly pose a threat to the #E 27th Dynasty#! after conquering #E Shedet#! followed soon after by conquering the most prosperous areas of the #E Faiyum#!. They then were able to use this momentum to invade into #E Menfer#! to take the prestigious city for themselves, and proceed to conquer much of the delta. Soon after, #E Pseneros Nome#! and #E Per-Medjet Nome#! would shift their allegiance to the new power. However, #E Menfer Nome#! would not last long under #E Faiyumic#! control. Conflicts over the #E Atenic#! religion of the #E Faiyum#! arose, resulting in the #E Nomarchy of Menfer#! gaining independence, cutting off all control of the delta.\n\n#E #Y Nomarchy of Menfer#!#!\n#E Menfer Nome#! would revolt against the #E 28th Dynasty#! of the #E Atenic Faiyumics#! in #E Henen-Nesut#!. They were able to exude their own influence in the now fractured #E Nile Delta#! region and have attained a position of power that equals that of a #E Pharaonic Dynasty#! in their own right. #E Menfer Nome#! now has an opportunity to reunite #E Lower Egypt#! and proclaim their own #E 30th Dynasty of Egypt#!, however, the #E 28th Dynasty#! will look to return #E Menfer Nome#! to their own realm. The two rivals are of similar strengths, so only time will tell which will fall and which will rise.\n\n#E #Y 29th Dynasty, Waset#!#!\nThe #E Dynasty of Waset#! remains a bulwark of #E Kemetic#! faith for the #E Egyptian#! people. It was able to assert claim and influence over the old possessions of the #E 27th Dynasty#! in Nubian lands. However, the #E Nubians#! just up the Nile are none too keen of the upstart #E Wasetans#!. #E The 27th Dynasty#! also retains influence over the Nomes east of the Nile, putting serious strain on the #E Wasetic#! influence over the east. Reuniting #E Upper Egypt#! under their banner would surely legitimize their proper rule over #E Egypt#!.\n\n#E #Y Kingdoms of Kush#!#!\nThe once powerful #E Kingdom of Kush#! has fallen to civil war. The old #E Kerman#! elite are revived in #E Lower Nubia#!. The new #E Meroe#! based state sits in #E Upper Nubia#!. And sandwiched between lay #E Napata#!, trying to take advantage of any opportunity given. Will #E Kush#! reunite and take advantage of the weakened #E Egyptians#!, or be doomed to nothing but squabbling states to be controlled by #E Kemet#!."
 gotn_events_2.a:0 "What will become of Kemet?"

 gotn_events_3_title:0 "The Boiling Gulf"
 gotn_events_3_desc:0 "#E The Gulf Wars#! are a series of wars sanctioned by the #E Achaemenid Kingdom#! and #E Babylonia#!.\n\nIf either power #E directly enters a war#!, the #E Gulf Region#! will likely be consumed by the flames of war. #E Dilmun#! and #E Maka#! will be able to conduct aggressive actions against each other #E without their overlord's influence#!. However, if the calm waters boil over, it will mean a war between the mighty #E Persians#! and the powerful #E Babylonians#!."
 gotn_events_3.a:0 "Will the gulf be painted red with blood, or yellow with gold?"

 gotn_events_4_title:0 "Due for the Duat"
 gotn_events_4_desc:0 "The great Pharaoh of the 29th Dynasty of Egypt, #E [ROOT.GetCountry.GetRuler.GetName]#!, in the year [ROOT.GetCountry.MakeScope.Var('regnal_year_var').GetValue|2] of his reign, is not far from the #E Duat#!. He has led our armies against the tyrants of the so-called divine light, #E Aten#!. He has captured the city of #E Swenett#! from the hands of encroaching #E Nubians#!. And he has stolen the hearts of the #E Egyptians#! of #E Waset#!!\n\nBut now, #E Anpi#! (Anubis) awaits him with the feather of #E Ma'at#! in his hand. #E Pharaoh Siamun#! has been stuck with cancer. For a #E Pharaoh#! at his age, he must be prepared to make the journey. The funding of his tomb has begun in the hidden #E Necropolis#!."
 gotn_events_4.a:0 "Osiris calls to me."

 gotn_events_8_title:0 "Calamity in Carthage"
 gotn_events_8_desc:0 "#E #Y Numidian Kingdom#!#!\n20 years ago, the newly created #E Numidian Kingdom#!, led by the mighty chief #E Ailymas Ailymasid#!, shattered the burgeoning #E Carthaginian League#!, nearly sacked #E Carthage#!, and pushed the Punics back to their coastal cities. Now, it appears that the #E Numidian Kingdom#! is on the verge of collapse. Who could have seen that the mighty nation, who had bested #E Carthage#!, and nearly sacked the city, is now on the precipice of a great change?\n\n#E #Y Carthage#!#!\nEver since the height of #E Carthaginian power#! their mighty empire has been collapsing and rotting from the inside. Multiple tyrannical takeovers undermined the republic, and strong men, oligarchs, and cowards have become increasingly influential. Their own subjects forced the #E Carthaginians#! to accept their demands of free government, and formed a league with the #E Carthaginians#!. The #E Carthaginian League#!, after a disastrous battle at #E Bulla Regia #! against the invading #E Numidian Kingdom #!, had no choice but to retreat behind their massive walls and hope for the best. The #E Numidians#! lay siege to the great city of  #E Carthage#! for 2 years, and nearly succeeded, if it was not for a relief army led by the #E Amphipolian#! mercenary general #E Apollodorus#!, who famously hid his cavalry in the hills near #E Carthage#!, and while the #E Numidian#! army was sleeping, he sallied out with his cavalry, and decimated a large majority of the #E Numidian#! army in one cavalry charge. When the dust settled, the casualties numbered in the several thousands, on both sides. With the #E Punic#! and #E Numidian#! armies both devastated, a peace was quickly signed, with #E Carthage#! granting huge concessions to the #E Numidians#!, and a 30 year truce was agreed upon. 17 years into the peace, an unsuccessful revolt of #E Punic#! subjects against #E Numidia#! was supported by #E Carthage#!. The utter failure of this revolt was a huge blow to #E Carthage#!, as they lost massive amounts of gold and manpower. With many of the elite of #E Carthage#! seeing #E Carthage#! as a lost cause, thousands of wealthy and influential #E Carthaginian#! citizens have left for more safe territories, such as #E Nura#! and #E Malacca#!. It seems #E Carthage#! is nearing complete annihilation. The only question is; who will be destroyed first, the #E Numidians#!, or the #E Carthaginians#!?\n\n#E #Y Nura#!#!\n#E Nura#!, the #E Punic#! colony on #E Sardinia#!, has become the most powerful #E Punic#! power. With #E Carthage#! crippled, and any other city too small or weak to accomplish anything, #E Nura#! has taken the mantle of the protector of the #E Punics#!. The #E Nuran#! capital city of #E Karali#!, has grown prosperous and wealthy. Unrest with the #E Sardinian#! tribes in the north might threaten this uncertain peace, and if a second #E Numidian-Carthaginian#! war occurs, #E Nura#! is sure to be drawn in.\n\n#E #Y Heraklea Aphrike#!#!\n2 years prior, the tyrant #E Izamramsem#! seized control of the city of #E Heraklea Aphrike#!, claiming to be the human incarnation of #E Herakles#!. His fanatical followers will follow him anywhere in battle, and it seems that he has been gathering strength for a large campaign. The tyrant surely has his sights on the prosperous city of #E Kalathousa#!, and to the #E Spanian#! cities to the north.\n\n#E #Y Malaca#!#!\nThe foremost #E Punic#! colony in the west, the heavily #E Iberian#!-influenced #E Spanians#! of #E Malaca#! have grown tremendously wealthy from the iron and gold mines. Another destination for #E Punics#! fleeing the #E Numidian#! conquered lands, #E Malaca#! has seen a sizable increase in population. Will #E Malaca#! defend their #E Spanian#! brethren against the imminent #E Heraklean#! invasion or will they be content to sit on their piles of gold?..." 
 gotn_events_8.a:0 "Who will determine the fate of the Western Mediterranean?"

 gotn_events_9_title:0 "Turmoil in Thrace"
 gotn_events_9_desc:0 "#E #Y Odrysian Kingdom#!#!\n#E Odrysia#! was once the hegemon of #E Thrace#!, controlling land from the #E Propontis#! to the #E River Ister#!. In 335 BCE, The king of #E Odrysia, Seuthes III Odrysid#!, thinking he could capitalize on the ascension of the young #E Alexander#! to the throne of #E Macedon#!, launched several attacks on the southern #E Greek#! colonies of #E Aenos, Cardia, Abdera#!, and #E Byzantion#!. Aided by the #E Getians#!, his campaign was going rather well, until the unexpected happened. #E Eumenes#! Of #E Cardia#!, who at the time was the was the royal secretary of #E Macedon#!, and very good friends with #E Alexander#!, petitioned the king to intervene, and to save his home poleis from #E Thracian#! domination. #E Alexander#! obliged him, and he quickly prepared his army. In the summer of 335 BCE, #E Alexander#! rode out with his army, prepared to relieve the #E Cardian#! defenders. As #E Alexander#! rode to #E Abdera#!, he noticed a suspicious lack of army encamped outside the city walls. As nearing the city, he was greeted by a messenger, who told him that the encamped #E Odrysian#! and #E Getian#! force had heard of his arrival beforehand, and had retreated into the forests, surely prepared to ambush the young king. #E Alexander#! decided to pursue the retreating army, against the advice of his generals. As his army was pursuing, he managed to catch the enemy forces at a river. Advancing his phalanx, and bringing his cavalry to the side of the river, #E Alexander#! was able to nearly wipe out the entire army. Now, with his flank secure, #E Alexander#! rode east for #E Cardia#!. Arriving at the city several days later, and meeting up with the main #E Odrysian army#!. The #E Macedonians#! and #E Odrysians#! fought on the plains outside #E Cardia#!. Although a close draw, the #E Odrysians#! were forced to retreat further inland. With one #E Odrysian#! army crushed, and the other on the run, the #E Greeks#! were poised to end #E Odrysia#!. With the help of the allied #E Greeks#!, the combined forces of the #E Hellenes#! pushed #E Odrysia#! back, forcing it to cede large portions of land to #YEMacedon#! and the #E Greeks#!. In #E Odrysia#!, a dual invasion by #E Dardania#! and the migrant #E Tylisians#! forced #E Odrysia#! to give up even more land to foreign powers. Now, nearly 30 years later, the defeated king #E Seuthes III#! rules a sad remnant of what was the mighty #E Odrysian Kingdom#!. Although all may seem lost, #E Odrysia#! could rise again, and reconquer what was taken from her.\n\n#Y #E Cardia and the Greeks#!#!\nWith the help of #E Macedon#!, #E Eumenes#! was able to install himself as archon of #E Cardia#!. A dictator in all but name, #E Eumenes#! has plans on conquering the #E Hellespont#!, and establishing a kingdom of his own.\n\nAfter the war ended, the #E Greek#! cities of #E Abdera#! and #E Aenos#! came under #E Macedonian#! protection. This arrangement has worked out well for the #E Greeks#!, although many are unhappy about paying tribute to the 'barbaric' #E Macedonians#!.\n\n#E #Y Silistria#!#!\nRemnants of #E Royal Scythia#!, the horsemen of #E Silistria#! have been seemingly inactive, waiting to strike and capture the wealthy #E Bosporan#! colonies. Time will tell if the #E Scythian#! riders will sally out from their homes, and wreak destruction on #E Thrace#!.\n\n#E #Y Tylis and the Celts#!#!\nThe second wave of #E Celtic#! migration to #E Thrace#!, the #E Tylisians#! have been fighting tooth and nail for their homes. Seemingly unending conflict between #E Tylis#! and her neighbors has made her people into some of the most prominent warriors, even better than the mighty #E Thracians#!. #E Tylis#! must secure it's new home, before it suffers a fate similar to #E Odrysia#!.\nAs part of the first wave of #E Celtic#! migrations to #E Thrace#!, the #E Dumarian#! people arrived by boat. Quickly adopting #E Greek#! government,  the #E Dumarians#! settled in the city of #E Bergoule#!, even creating a colony of their own (which went terribly). The #E Bergoulans#! maintain good relations with the #E Greeks#!, and the #E Dumarians#! act as a middleman between the #E Thracians#! and #E Greeks#!. Preferring to stay neutral in most conflicts, the #E Bergoulans#! can no longer sit in their walled capital. Change is coming to #E Thrace#!, and will they weather the storm, or will it wash them away?\n\n#E #Y The Dardanian Kingdom#!#!\nAn #E Illyric#! people, the #E Dardanians#! have always been heavily influenced by the #E Thracians#!. In 345 BCE, the #E Dardanians#! and the #E Paeonians#! clashed with #E Philip II#! of #E Macedon#!, who subjugated the #E Paeonians#!, but left the #E Dardanians#! to their own devices. Upon hearing news of the #E Macedonian#! intervention in #E Thrace#!, the #E Dardanians#! quickly seized #E Thracian#! borderlands. As of late, the kingdom seems to be preparing to wage war with someone, whether it be the #E Macedonians#!, #E Thracians#!, #E Celts#! to the north, or the other #E Illyric#! tribes to the west."
 gotn_events_9.a:0 "The future of Thrace will be decided..."

 gotn_events_10_title:0 "Kings of All Aram"
 gotn_events_10_desc:0 "#E #Y Kingdom of Aram#!#!\nAfter the #E Bronze Age Collapse#! and under the great #E King Haze'il#!, the #E Aramean Kingdom#! would establish a dominion stretching as far as the edges of #E Bit Agushi#!. Yet this dominion proved too much to handle, and it found itself faced by rebellion on every side amidst an invasion by the #E Assyrians#!, ending the early period of the kingdom... yet this would not be the end for #E Damascus#!. Soon, both #E Assyria#! and #E Urartu#! would lose their positions, and much of the levant was left free for local rulers to rise once more. The #E Aramaic Kingdom#! found itself in a unique position to take advantage of the chaos in the north, forming an alliance with the #E Qedarites#! and with #E Bit Agushi#! against the rival #E Kingdom of Hamath#!, subduing it, and forcing tribute from their #E Samaritan#! allies. This shortlived revival was not to last, and soon, #E Aram#! found itself at odds with two other major polities in the region, #E Kummuh and Bit Adini#!. The subsequent war would prove disasterous, reviving our enemies, and disorder resuming. But, having repulsed us, the rebels have turned against each other. #E Damascus#! once more is in prime position to take advantage, and this time learn from its mistakes in the past." #WIP, needs to be shorter for aram

 gotn_events_11_title:0 "Garamantic Apocalypse"
 gotn_events_11_desc:0 "#E #Y Garamantic Kingdom#!#!\nThe once proud and mighty #E Garamantic#! Realm united all of #E Fezzan#! under one banner, creating a prosperous kingdom. The kingdom traded to the far south, in the lands near #E Lake Chad#!, to the east in the lands of #E Kemet#!, and to the tribes of the west, in the #E Atlas Mountains#!. The #E Garamantics#! Were truly the master of the #E Sahara#!, and no single power could challenge their dominance of the dunes and sands. Many great cities and huge monuments to #E Garamantic#! splendor was constructed. Their kingdom perfected irrigation, and many parts of the desert were able to support large scale agriculture. Notably, the #E Garamantics#! extensively mined the water reservoirs in the #E Fezzan#!. In 368 BCE, their great empire came to an end. A combination of a harsh drought, overuse of water resources, an increasingly difficult time extracting water from the reservoirs led to the destruction of the #E Garamantics#!. For the first 15 years, entire cities were erased off of the map, thousands starved, and there was a complete and utter breakdown in any sort of centralized power. After the dust settled, a few pockets of civilization remained, with the rest being controlled by nomadic tribesmen.\n\n#E #Y Phazania#!#!\nAn important city under #E Garamantic#! rule, #E Phazania#! is the last true #EGaramantic#! Kingdom, and the only one that could potentially reunite this destroyed land. Their wise rationing of food and water supplies, and some small-scale water mining and agriculture has allowed their capital city of #E Phazania#! to have maintained it's pre-collapse population.\n\n#E #Y Majdul#!#!\nThe Scourge of #E Garamantia#!, as they are called, the #E Majdulites#! have embraced the chaos and destruction of the #E Garamantic Collapse#!, raiding all over #E Fezzan#!. It has been said that numerous cities have been single-handedly destroyed by these tribesmen. The weak and isolated cities will make good targets for them….\n\n#E #Y Illaqapi#!#!\nThe #E Punics#! And #E Greeks#! enjoyed a special trade status under #E Garamantic#! rule, a position that has since become jeopardized in the wake of the collapse. Under the leadership of #E Illaqapi#!, these coastal cities have survived… so far. Time will tell if they will fall under the control of a hostile tribe, or a resurgent #E Garamantic Kingdom#!.\n\n#Y #E Brak#!#!\nEstablished as an important religious center during the height of the #E Garamantic Kingdom#!, #E Brak#! Has important temples to #Y Ammon#!, the chief god of the #Y Ammonite#! pantheon, and to #E Yuc#!, the god of oases and water. Surrounded by hostile tribes, the priest-kings of #E Brak#! rule the city of #E Brak#! with an iron fist, and for good reason. If it was not for their fanatical devotion to #E Ammon#!, they surely would have perished. If contact can be established with the #E Siwans#! to the east, hope might still remain for the #E Brakites#! to be saved."
 gotn_events_11.a:0 "May Ammon have pity on us, and may Yuc bless us with plentiful water."
 garamantic_collapse:0 "Garamantic Collapse"

 gotn_events_12_title:0 "Lydian Languish"
 gotn_events_12_desc:0 "#E #Y Lydia#!#!\nThe glory days brought about by King #E Croesus#! have long since passed. #E Lydia#! faces numerous challenges: discontent amongst their subjects and  #E Macedonian#! funded-piracy. The short war against the #E Greeks#! proved to all the true shortcomings of the #E Lydians#!, and the kingdom finds itself in a severe lack of gold. Despite this, the #E Lydians#! could still recover, if only their king #E Adrastus#! could find the strength within him to lead his people to victory.\n\n#E #Y The Ionians#!#!\nOnly ten years prior, the #E Greek#! States of #E Lydia#! revolted against their masters. Even with assistance from #E Macedon#!, #E Thrace#!, #E Aegina#! and #E Rhodes#!, the #E Ionians#! do not find themselves in any better of a position. A short but consequential war, #E Rhodes#! endured a year-long siege, and the mighty #E Aeginetan#! fleet was severely crippled. The #E Troans#! and cities of the #E Propontis#! managed to secure independence, only with #E Macedonian#! aid. The #E Greeks#! will surely stir again, discontent to be under the #E Lydian#! thumb.\n\n#E #Y Phrygia#!#!\nThe #E Phrygians#! were once the masters of #E Anatolia#!, and it was only after the catastrophic #E Cimmerian#! invasion that their power waned. #E Gordion#!, said to be the richest city in all of #E Anatolia#!, was put to the torch, and it's many riches were carried to distant lands. Now, the current state of #E Lydian#! affairs might cause a resurgence for these ancient people.\n\n#E #Y Kios#!#!\nThe personal kingdom of #E Mithradates II#!, the famed #E Median#! general who trekked across all of #E Anatolia#! with his five thousand soldiers, eventually settling in #E Kios#!, which was granted to him by the #E Lydian#! king #E Oromedon#!. #E Mithradates#!, ever the negotiator, managed to secure his independence during the #E Ionian Revolt#! by leading an army into the #E Lydian#! heartlands, capturing several cities, and taking with him many treasures. Now, #E Mithradates#!, even as an old man, hungers for more. He seeks to claim all of #E Lydia#! for himself.\n\n#E #Y Lycia#!#!\nThe #E Lycians#!, ever enigmatic, have yet to reveal their intentions to the wider world. Rumors have been spreading of strange new ideas circulating in #E Lycia#!, ideas even the democratically-minded #E Athenians#! might consider to be too drastic. Who can really say what this nation of mercenaries and sea-raiders could be up to."
 gotn_events_12.a:0 "Only two things are certain in this world: death, and taxes. May we be blessed with a lack of either."

 gotn_events_13_title:0 "Economic Disaster"
 gotn_events_13_desc:0 "'My lord, word has reached us of utter chaos in our lands. Our treasuries have run nearly dry-we are simply out of gold. And the currency we do have, is nearly worthless! Even the currency of the #Y Paphlagonian#! dogs is worth more than us!.' The young king #Y Adrastus#! simply leaned forward on his throne, placing his hand on his chin. After a period of deliberation, he answered thus:'I must do everything in my power to save us from this disaster. Debase the currency, mine more gold, melt the royal armaments down! And send a message to the #Y Athenians#!, requesting a trade deal.'"
 gotn_events_13.a:0 "If only #Y Croesus#! could see his kingdom now..."
 lydia_economy_1_tt:0 "#Y An#! #R Economic Crisis#! has occured. This modifier can only be removed by #G restoring#! #Y Lydian#! power via the mission tree, lest you suffer a miserable end. #Y (This content has not been added yet)#!"
 lydian_economic_disaster:0 "Economic Crisis"

 gotn_events_14_title:0 "Alexandrine Ambitions"
 gotn_events_14_desc:0 "#E #Y Macedon#!#!\nThe campaigns of #E Alexander#! have brought much wealth and glory to #E Macedon#!. It is a shining example of a #E Greek#! kingdom, a land of prosperity and peace. But even so, peace may not last forever, for #E Macedon's#! enemies are numerous. The #E Korinthians#! and #E Potideans#! are clearly in league with each other, as they seek to undermine #E Macedonian#! influence and power. A weakning #E Lydia#! lies ready for the taking. The #E Thracians#!, in their dark forests, have begun to stir. The ancient #E Paeonians#! grow restless. To the north lies the #E Dardanians#!, a rising power who may come to oppose us. The uncertain #E Taulantians#! and #E Epirotes#! cannot be trusted. Even #E Macedon's#! allies- #E Thessaly#!, #E Cardia#!, and #E Argos#!, all have ambitions of their own, ambitions which may conflict with #E Alexander's#!. The disunited states of the #E Greeks#! need to be united, by the spear, or by the scroll."
 gotn_events_14.a:0 "To the glory of Pan-Hellenism!"
 gotn_events_14_tt:0 "An attempt must be made to #G unite#! the #E Greeks#! during #E Alexander's#! lifetime."
 macedon_ambition:0 "Macedonian Ambition"

 gotn_events_15_title:0 "Theban Overtures"
 gotn_events_15_desc:0 "#E #Y Thebes#!#!\nThe wise and prosperous rule of #E Epaminondas#! has led to a strong, unified #E Boeotia#!. Not everything is perfect for the seven-gated city however. The #E Thebans#! have had to contend with a rising #E Thessaly#!, one that seeks to destroy them and their league permanently. 10 years prior, the tyrant #E Lysimachos#! led an expedition into #E Lamia#! and #E Elatea#!, beating back the #E Theban#!-led coalition. #E Orochomenos#!, a city historically at odds with #E Thebes#!, betrayed the #E Thebans#! by allying with #E Thessaly#!, in exchange for a promise of becoming the leader of the #E Boeotian League#!. In 302, the neighboring city of #E Chalkis#! hatched a plot to overthrow the #E Theban#! Boeotarch #E Kleitomachos#!, and to install a pro-#E Chalkidian#! ruler. The plot was foiled before it came to fruition, and the #E Thebans#!, outraged, immediately set out to capture #E Chalkis#!. With the help of their allies the #E Eretrians#!, #E Chalkis#! fell quickly, as no city wanted to support such a treachery. Even the dastardly #E Thessalians#! stayed out of the conflict. #E Chalkis#! was captured, and occupied by a #E Theban#! garrison. Now, tension have been brewing between #E Orochomenos#! and #E Thebes#!. Rumors have been spreading about a supposed #E Thessalian#! invasion, and #E Orochmenian#! schemes..."
 gotn_events_15.a:0 "No longer will we tolerate enemies at our doorstep!"
 gotn_events_15_a_tt:0 "#Y Thebes#! and her subjects will immediately declare #R war#! on #Y Orochomenos#!\n\nSuch an action could draw us into #R conflict#! the #Y Thessalians#!."
 gotn_events_15.b:0 "Forget Orochomenos, I have a better plan."
 gotn_events_15_b_tt:0 "We will attempt to #G sway#! #Y Oreos#! to our side."
 gotn_events_15.c:0 "Let us not rush into conflict, we will bide our time..."
 theban_overtures:0 "Theban Overtures"

 gotn_events_16_title:0 "The True Sons of Crete"
 gotn_events_16_desc:0 "#E #Y Praesos#!#!\n[ROOT.GetCountry.GetRuler.GetName|E] stepped before the Praesian boule, preapring to deliver a speech. 'For too long have we, the Etocretans, the TRUE inheritors of the Minoans, have been the laughingstock of all of Crete. No longer will we tolerate their insolence. Although we have fallen far from our legendary ancestry, the true Sons of Crete will rise once more, and take what is rightfully ours. To arms!'. At first, silence. The assembled councilmen were stunned at the audacity of [ROOT.GetCountry.GetRuler.GetName|E]. One councilman said 'Conquer Crete? have you gone mad?' After a pause, [ROOT.GetCountry.GetRuler.GetName|E]. spoke thusly 'Countrymen, do you not wish to prove our own place, to prove our superiority amongst our neighbors who have so often ridiculed us? Why must we sit here and linger, accomplishing nothing. Amongst men, there are two types: those who are content to lounge in their house all day, and get fat on bread and wine, and men who accomplish something. Have you no pride? What a lousy lot of dogs, ALL OF YOU. If you will not support me on my task, I will find support elsewhere.' Murmurs broke out amongst the councilmen, before thunderous applause broke out, uninterrupted for nearly 5 minutes."
 sons_of_crete:0 "Sons of Crete"
 gotn_events_16_tt:0 "#Y Praesos#! will gain claims on the province of #Y Crete#!."
 gotn_events_16.a:0 "It appears the sons of Minos are on the warpath.... "
 
 gotn_events_17_title:0 "A Prince in Exile"
 gotn_events_17_desc:0 "jueyun lore"
 tayuan_exile_army:0 "An Exiled Army"
 gotn_events_17_tt:0 "#E Our Army#! will be self sustaining for #E Ten Years#!."
 gotn_events_17.a:0 "china will be large and it will be good"

 gotn_events_18_title:0 "The Riches of Korinth"
 gotn_events_18_desc:0 "#E #Y Korinth#!#!\nHas historically been the most wealthy and prosperous of all the Greek cities. Under the wise guidance of Periandros, the city founded several colonies, and enjoyed wealth beyond measure. For many years now that has been the status quo, and [GetProvince('(int32)418').GetName] maintained that position, but times have since changed. [GetCountry('SPA').GetName], once our ally, has retreated into their city, isolating themselves from the goings of the Hellenic world. [GetCountry('ATH').GetName] has become a true threat, endangering our trade routes by allying with the Korkryans, and spreading their grasp over the Hellespont. [GetCharacter('(int32)41').GetName], and [GetCharacter('(int32)39').GetName], have begun to meddle in Greek affairs. Who can say where their scheming eyes will turn to next. Even [GetCountry('THE').GetName] seems against us, having since consolidated their league. From now on, we can rely on no one but ourselves, and rely on nothing but our wits. One way or another, we, the Korinthians, will come out on top."
 gotn_events_18.a:0 "Greece shall be ours."
 

 ## Median Collapse
 armenian_rebels:0 "Armenian Satrapy Rowdiness"

 ARZ:0 "Arzasha"
 ARZ_ADJ:0 "Arzashi"
 MTT_ADJ:0 "Mitanni"
 MTT:0 "Mitanni"
 HAG_ASSUR:0 "Hanigalbat-Assur"
 HURRIA_ADJ:0 "Hurrian"
 HURRIA_NAME:0 "Hurrian Kingdom"
 armenia_big_success:0 "#E Armenia#! takes over parts of the #E Armenia#! region.\n#E Armenia#! becomes the leader of the #E Armenian#! satrapies."
 declare_war_tt:0 "#R Declare War#! on the #E Armenians#! in #Y one month#!!"

 median_collapse_2_title:0 "The Armenian Menace"
 median_collapse_2_desc:0 "The Western Satraps have lately been harder and harder to administer, especially with our focus on #E Persia#! in recent years. The strongest of our western satraps, #E Armenia#! has seized our territories in their namesake region, inspired the revolt of the #E Arzashi-Armenians#!, and have taken over our other #E Armenian#! satrapies! It is also very likely because of this, we will lose control of #E Cappadocia#! due to no land connection to them."
 median_collapse_2.a:0 "There is nothing we can do..."
 median_collapse_2.b:0 "Declare war on those rebels!"

 median_collapse_3_title:0 "Rise of Armenia"
 median_collapse_3_desc:0 "The #E Armenians#! have taken agency, seizing the lands of the #E Median Empire#! in our namesake region of #E Armenia#!. Furthermore, the #E Arzashi#! have arisen as well! Under #E Armenia#! all of the #E Armenian Satrapies#! are united."
 median_collapse_3.a:0 "The #E Armenians#! rise!"

 median_collapse_4_title:0 "Loss of the West"
 median_collapse_4_desc:0 "The Median Empire is in the midst of a collapse. We have stopped recieving royal administrators and diplomats in our capitals, we can only assume that we are only a satrap in name. We are effectively independent, and we should consider our future options carefully with this new reality in mind."
 median_collapse_4.a:0 "Will we be alright?"

 median_collapse_6_title:0 "The Median Collapse"
 median_collapse_6_desc:0 "The Medians have been the most powerful state of the civilized world since the Age of Iron and the collapse of the Neo-Assyrian Empire. Yet their time now comes. Their Armenian satrapies have broken away while war wages on in their nation. Is this truly the end to the sons of Mithra?"
 median_collapse_6.a:0 "Fortune is fickle..."
 median_collapse_6.b:0 "Good riddance!"

 median_collapse_10_title:0 "Armenian Dissatifaction"
 median_collapse_10_desc:0 "The western Armenian satrapies have found their position within our empire to be less than ideal. Over the past decades, we have been focussing on our influence in the east, aiming to finally crush the Achaemenid Kingdom. Of course, they shouldn't even have a choice, however, they will be unlikely to join our wars for a while... and they may even look to rebel completely."
 median_collapse_10.a:0 "Those mountain hugging heathens!"
 median_collapse_10.b:0 "The time of the Armenians will come!"

 median_collapse_20_title:0 "Sagartia's Betrayal"
 median_collapse_20_desc:0 "The Sagartians were once our loyal satraps... but that is the case no longer. Due to the Achaemenids meddling, the Sagartians have decided to flip their allegience to that of the Persians due to their shared faith of Mazdayasna. We cannot let this disgrace stand!"
 median_collapse_20.a:0 "Declare war on the Achaemenid Kingdom!"
 median_collapse_20.b:0 "We cannot afford war right now..."

 median_collapse_21_title:0 "Sagartia Joins the Fray"
 median_collapse_21_desc:0 "Thanks to our shared faith of Mazdayasna, the Sargatians have finally left behind their tyrannical Median overlords and sworn loyalty to us! The Medians cannot be happy about this and will likely declare war on us for this reason. We should be ready."
 median_collapse_21.a:0 "Ahura Mazda will lead us!"

 ## Hanigalbat Events
 mitanni_nobility_return.1.t:0 "The future of Hanigalbat?"
 mitanni_nobility_return.1.desc:0 "With the steady recovery of the Assyrian nation there has been a sudden influx of Mitanni nobles into our territories, requesting to be allowed to settle our lands and bring with them their culture and faith. We, of course, have the next-best claim to the Assyrian Crown, and it would do good to let them take Asylum here. Whether they keep their status of nobility is up to our great ruler."
 mitanni_nobility_return.1.a:0 "They must become integral to our nation."
 mitanni_nobility_return.1.b:0 "We will return to our past, for a glory long lost!"
 mitanni_nobility_return.1.c:0 "The crown of Assyria is our biggest ambition."
 mitanni_nobility_return.2.t:0 "The future of the Royal Family?"
 mitanni_nobility_return.2.desc:0 "We have reinstated the Mitanni nobles and are sponsoring their culture, but there are demands by the new nobility to establish a proper Mitanni Monarchy.."
 mitanni_nobility_return.2.a:0 "We will instate a Mitanni noble forcefully."
 mitanni_nobility_return.2.b:0 "Appeasement may be the better option.."
 mitanni_culture_warning.tt:0 "The mission #r "The Hurrian Tempest"#! will no longer be available."
 mitanni_unlocked_missions.tt:0 "We will pursue the restoration of the #G Mitanni Kingdom#! of old. The mission #G "From Brazen Ashes"#! will become available."
 mitanni_military_trads.tt:0 "The legacy of the #G Mitanni#! will become ours to fulfil. This will switch the #T Heritage#! of our nation."
 mitanni_nobility_priviliges.tt:0 "The #E Mitanni#! culture will be granted #E Noble#! priviliges."
 switch_culture_mitanni.tt:0 "[THIS.GetCountry.GetName] adopts the #E Mitanni#! heritage."
 mitanni_deities.tt:0 "[THIS.GetCountry.GetName] will gain access to #E Mitanni#! deities."
 hanigalbat_to_rule_the_universe.tt:0 "We will pursue our ambitions to rule the #t Universe.#!"
 hanigalbat_assyrian_missions.tt:0 "The mission #G "To Conquer the Universe"#! will become available."
 hanigalbat_hurrian_missions.tt:0 "We will take up the path of #Y Teshub#! like our ancestors. The mission #G "The Hurrian Tempest"#! will become accessible."
 mitanni_opposition_name:0 "Assyrian Opposition"
 ## Hanigalbat Event 2 LOL
 ninurta_apal_ekur_two_coronation.1.t:0 "For He has Spoken To Me"
 ninurta_apal_ekur_two_coronation.1.desc:0 "On the day when [ROOT.GetCountry.GetRuler.GetName] decided His Future, he was visited by visions of HIM - Imploring him to leave, and seek out the ruins of ASSYRIA, for it was his duty to rule in HIS name and restore order to The Four Corners Of The Universe. And now? With his own fiefdom he impatiently lies in wait, with ambitions grander than any seen before, and a name to live up to.."
 ninurta_apal_ekur_two_coronation.1.a:0 "And The World Shakes In Anticipation."
 ninurta_apal_ekur_two_coronation.2.t:0 "And His Word Was Law"
 ninurta_apal_ekur_two_coronation.2.desc:0 "The news of a Rebellion against His Reign reached the Palace of Assukanni -- [ROOT.GetCountry.GetRuler.GetName] is the last in his fiefdom to hear of it. The Mitanni nobility which had a resurgence under the patronage of the Kingdom of Urartu, acting on their discontent towards Him and his Policies - And even then, the worst news had not been delivered to Him. The Rebellious Nobles hold the public support from the population of Hanigalbat, the Hurrians of the Nation stand by them and support their uprising.. \n \n #E The night falls upon the Palace, where He faces an uncertain future.."
 ninurta_apal_ekur_two_coronation.2.a:0 "..And The Sun Shines Upon Him."
 incomplete_for_2_1:0 "This leads to content that will be unlocked in #Y v2.1#!, it is not available in this version."
 ninurta_apal_ekur_two_coronation.2.b:0 "..And The Morning Sun Greets A New Hanigalbat."
 ninurta_apal_ekur_two_coronation.3.t:0 "HE Shines Down on The Aftermath"
 ninurta_apal_ekur_two_coronation.3.desc:0 "An uneasy peace falls down upon the populace of Hanigalbat, as they rise to see the morning sun shine down upon them. Overnight, there has been a change, and it is first noticed in the burning villas of the Mitanni Nobility. A retribution for their crimes of conspiring against His rule - and more to come, as the Hurrian population of Washshukanni face the wrath of HIS representative on this world. Raised taxes, higher demands of their farmers. If He has to alienate all of them and favor the chosen children of #E Ashshur's#!, then He will do so."
 ninurta_apal_ekur_two_coronation.3.a:0 "And Still, Long May He Reign"
 ninurta_apal_ekur_two_coronation.4.t:0 "And even still, They Struggle"
 ninurta_apal_ekur_two_coronation.4.desc:0 "As long as the Sun rises in HIS name, [ROOT.GetCountry.GetRuler.GetName] will continue to strive for the restoration of HIS dominion. With one part of the opposition dealt with, he can rest easy.. but all is not as it seems - behind closed doors, there are whispers of a second revolt, one born out of malcontent over the punishment for the first one. \n\n Once more, there is trouble within the borders of Hanigalbat."
 ninurta_apal_ekur_two_coronation.4.a:0 "He Must Act Swiftly"
 ninurta_apal_ekur_two_coronation.5.t:0 "Hurrian Coup"
 ninurta_apal_ekur_two_coronation.5.desc:0 "Ack! It seems the #E Hurrian#! populace isn't taking too kindly to the rightful king [ROOT.GetCountry.GetRuler.GetName]. Something about not wanting to be lead by a 'Greek.' Clearly they do not understand #E Ashshur's#! will!"
 ninurta_apal_ekur_two_coronation.5.a:0 "As if mortals could stop Ashshur."
 ninurta_apal_ekur_two_coronation.5.b:0 "[ROOT.GetCountry.GetRuler.GetName] must escape quickly!"
 ninurta_apal_ekur_two_coronation.6.t:0 "A Crown in His Name"
 ninurta_apal_ekur_two_coronation.6.desc:0 "An elaborate plan is brewing within the palace of Assukanni, and it stems from who else; but [ROOT.GetCountry.GetRuler.GetName] himself! For he has finally declared his true ambition! To be crowned #E Ashshur's#! representative on earth! With all his opposition out of the way, there is nobody left to stop him."
 ninurta_apal_ekur_two_coronation.6.a:0 "To Reign forever."
 ninurta_apal_ekur_two_coronation.7.t:0 "The Coronation."
 ninurta_apal_ekur_two_coronation.7.desc:0 "When the Sun rose that day, it shone down upon a man - and when it set that night, it fell upon #E Ashshur's#! chosen. A crown sat atop his head, not for himself, no, but in the name of HE who shaped him into what he is today. And his followers called his name, as his old one was lost. Long may he reign, in HIS name."
 ninurta_apal_ekur_two_coronation.7.a:0 "Until the Sun ceases to Rise." #change his name to ninurta-apal-ekur or Aššur-rēša-iši III or Aššūr-bēl-kala II
 ninurta_apal_ekur_two_coronation.8.t:0 "The Rebirth of the Mitanni"
 ninurta_apal_ekur_two_coronation.8.desc:0 "For the Mitanni Nobility, this day will be one of national foundation. As they storm the palace in Vasukanni, pushing past the guards stationed outside - and oust the foreign king from their nation in a relatively bloodless coup. This is how the Ambition of Hiketas Sybirtid dies, not with a bang, but a whimper."
 ninurta_apal_ekur_two_coronation.8.a:0 "And out of that whimper, we rise from the ashes."
 ninurta_apal_ekur_two_coronation.9.t:0 "The Rise of the Hurri"
 ninurta_apal_ekur_two_coronation.9.desc:0 "The #E Hurrians#! have returned to ruling themselves! Now, no lunatic #E Cretan#! in power. With this, the #E Tempest#! that is #E Teshub's#! chosen people will return in full force. Long have the #E Hurrians#! been in the background. From the moment civilization appeared in #E Mesopotamia#!, to the age of copper and tin, to when the world stopped making sense, and when the universe was ruled by #E Ashshur#!. It is finally time for the #E Hurrians#! to enter a new age."
 ninurta_apal_ekur_two_coronation.9.a:0 "Let's get to work."
 big_coronation_hgb.tt:0 "#E A Grand Coronation is on the Horizon.#! \n #R This will anger those underrepresented in our nation."

 ##Bharat Events
 claims_on_hindush_tt:0 "Gain claims on the entire #Y Hindush#!, including #E Gandhara#!, #E Sindh#!, and #E Panchanada#!."
 release_jehat_tt:0 "Creates a #Y Parsi#! citystate in the city of #E Jehat#!."
 bharat_events_1_title:0 "The Shadow Kingdom"
 bharat_events_1_desc:0 "The realms of the #E Hindush#!, many as they are, were once an integral part of the #E Persian#! sphere... but with the attention focussed westwards and seawards in the recent years, and the historic autonomy of the region, most #E Uparajas#! have stopped paying tribute. They have simply drifted apart from the Empire, and there is nothing the #E Achaemenid Kingdom#! can do about it."
 bharat_events_1.a:0 "More of the same, really."
 bharat_events_1.b:0 "We are a Mahajanapada!"
 bharat_events_1.c:0 "We represent the #E Achaemenids#! still."
 bharat_events_1.d:0 "We will leave gracefully."
 bharat_events_1.e:0 "We are the rightful rulers of Hindush!"
 JHE:0 "Jehat"
 JHE_ADJ:0 "Jehati"

 ##Greece-Anatolia Events
 greece_events_1_title:0 "A Trade Proposal"
 greece_events_1_desc:0 "A ship arrived from [GetProvince('(int32)1972').GetName|E] a day ago. The messenger was from [GetProvince('(int32)292').GetName|E], and carried with him the royal seal of Adrastus. His message was such 'O ruler of the Athenians- I come to you humbly, and as an equal. My nation is going through a time of great hardship, and I seek to establish relations with your people. I believe we can both benefit from a trade deal, as the other Greeks have refused to do business with my merchants. Please, take this gift as a symbol of my gratitude.' The messenger presented a box full of the finest Lydian fruits, honey, and meats. The Athenian Archon,[ROOT.GetCountry.GetRuler.GetName|E] responded..."
 greece_events_1.a:0 "There is always money to be made!"
 greece_events_1.b:0 "A box of fruits? Your king truly is desperate."
 athens_deal:0 "#Y This deal will#! #G benefit#! #Y both us and Lydia, but our Greek countrymen will be#! #R angered#! #Y by our decision to trade with the enemy#!."
 athens_deal_1:0 "#Y Our Greek countrymen will be#! #G impressed#! #Y with our display of moral superiority#!."
 angered_greeks:0 "Angered Greeks"
 no_deal:0 "Deal Refused"
 lydian_athenian_trade:0 "Lydian-Athenian Trade"
 greece_events_2_title:0 "Deal Accepted"
 grece_events_2_desc:0 "The Athenians have responded favorably to our request-perhaps the situation is not as dire as it seems. We should seek to foster a relationship between us and Athens. It would be extremely advantageous to have a Greek ally..."
 greece_events_2.a:0 "To prosperity!"
 greece_events_3_title:0 "Deal Declined"
 greece_events_3_desc:0 "The Athenians clearly have no love for us. They called us desperate beggars, and scoffed at our proposal It seems we will have to seek friends elsewhere." 
 greece_events_3.a:0 "We have no need for Greeks anyways."
 greece_events_4_title:0 "War!"
 greece_events_4_desc:0 "A scout appeared before [ROOT.GetCountry.GetRuler.GetName|E], weary from travel. An entire #E Theban#! army is headed towards us, they seek to conquer us! [ROOT.GetCountry.GetRuler.GetName|E] spit out the wine he was drinking, and his cup dropped to the floor. Get me the emergency funds, and barricade the city as fast as possible. Our fate depends on [GetCharacter('(int32)41').GetName]..."
 greece_events_4.a:0 "Man the defenses!"
 orochomenos_defense:0 "Desperate Defense"
 greece_events_5_title:0 "Orochomenian Aid"
 greece_events_5_desc:0 "News has reached us of the plight of the #E Orochomenians#!-they have been attacked by #E Thebes#!. Do we really wish to draw ourselves into another conflict over a petty city, even if they are our allies on paper?"
 greece_events_5.a:0 "Useless or not, this is a good oppourtunity to teach the Thebans a lesson."
 greece_events_5.b:0 "Orochmenos will have to fend for itself."
 greece_events_5_tt:0 "We will immediately declare #R war#! on #Y Thebes#!."
 greece_events_6_title:0 "An Offer of Defection"
 greece_events_6_desc:0 "A messenger arrived from [GetProvince('(int32)426').GetName|E], presenting us with an offer. We could defect the #E Thessalians#!, who have often overstepped their boundaries and demanded too much of us, and we would join as a junior member of the #E Boeotian League#!. This could be beneficial, or it could just be a change in management."
 greece_events_6.a:0 "Better a Boeotian than a Thessalian."
 greece_events_6_tt:0 "We will become a feudatory of #Y Thebes#!."
 greece_events_6.b:0 "We will take our chances with Thessaly."
 greece_events_7_title:0 "Thessalian Intereference"
 greece_events_7_desc:0 "[GetCulture('thessalian').GetName] troops have been spotted marching from [GetProvince('(int32)339').GetName]; the #E Thessalians#! are on the march to aid [GetCountry('CM4').GetName]. This conflict may become much more complicated than anticipated."
 greece_events_7.a:0 "How much can they really even do, against a united Boeotia?"
 greece_events_8_title:0 "Oreosian Submission"
 greece_events_8_desc:0 "[GetCountry('ORE').GetName] has wisely accepted our offer. Even now, our moves are paying dividends; with Oreos pacified, we now have control over the entire island of #E Euboea#!, a valuable asset. Perhaps we should turn our focus to the sea."
 greece_events_8.a:0 "The first step towards Theban hegemony."
 greece_events_9_title:0 "Oreosian refusal"
 greece_events_9_desc:0 "[GetCountry('ORE').GetName] has turned down our offer. Those fools will come to regret their decision, one way or another."
 greece_events_9.a:0 "They will be within our grasp soon enough."
 greece_events_9_tt:0 "We will gain claims on #Y Oreos#!."
 greece_events_10_title:0 "Thebes Ascendant"
 greece_events_10_desc:0 "[ROOT.GetCountry.GetName] has finally taken her place in the #Y Greek world#!- at the center of it. Now, the question comes regarding our rule. Are we to maintain our ways, or should we adopt a new system, perhaps one more befitting of our grandiose conquests."
 greece_events_10.a:0 "We shall remain as Thebes."
 greece_events_10.b:0 "By remembering our origins, we will bring our peoples closer together."
 greece_events_10.c:0 "Thebes has surpassed all petty Greek states. A new, Theban Empire is to be proclaimed!"
 theban_excellence:0 "Theban excellence"
 THEBAN_IMPERIUM:0 "Theban Empire"