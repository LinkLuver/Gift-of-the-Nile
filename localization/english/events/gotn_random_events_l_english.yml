l_english:

 gotn_random_events_1_title:0 "Greek Traders"
 gotn_random_events_1_desc:0 "Recently, merchants from Greek colonies have appeared in [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Although initially foreign to us, the various goods they offer are quite appealing.\n\nSome of the tribe elders say to let these Greeks continue on with their buisiness, while others say we should seize their goods, and kick out this foreign influence from our lands."
 gotn_random_events_1.a:0 "Who are we to interfere with the matters of trade?"
 gotn_random_events_1.b:0 "Banish them from our lands."
 greek_traders:0 "Greek Traders"
 desc_greek_traders:0 "Traders and merchants from the various Greek colonies of the western Mediterrean have taken to selling their wares to us, namely wine, armaments, clothes, and jewelry."