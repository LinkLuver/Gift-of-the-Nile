l_english:
 patch_notes: "Gift of the Nile Changelog"
 patch_notes_text: "#E Anahita V2.1.0 - Flames of Wisdom#!\n\nPersiapotamia:\n- Readjustments to Elam and Persia setup\n- Pop redistribution of Persian cities\n- Pop redistribution of Elamite cities\n- Median collapse events expanded\n- Added Diadochi CB mechanics for Medio-Persian War and Gulf Wars\n- Added bloodline of Cyaxares\n- Kingdom of Nineveh formable for Carduene, Carduchia\n- New heritages for several nations in northern Mesopotamia\n- Changes to Iranian provinces\n- Roads added in Media, Persia, Elam, Babylon, Assyria, Armenia, and Parthia\n\nEgypt:\n- Mission tree for Waset to crush the Aten\n- Expanded the Atenic religion\n- Expanded the Sobekite religion \n\nLevant:\n- Changes to the Hebrew religion\n- Heritages for new Hebrew states\n- Hittite Kingdom formable\n\nZagros:\n- New nations and heritages\n- Zagrosia formable\n- Several other formables for Zagrosian states\n\nNorth Africa:\n- North Africa startup event\n- Added Atlas formable for Atlosian nations\n\nSouthern Iberia:\n- New heritages for Iberian nations\n- Pop redistribution in Southern Iberia\n- Added new formables for Punic nations\n\nWestern Mediterranean:\n- Changed Massalia setup\n- Mission tree for Ourkinion\n- Added several new Greek colonies in the Western Mediterranean\n- New heritages for Greek colonies\n- Heritages added for Sicilian nations\n- Agathoklid Kingdom added\n- Pop changes in Italiote cities\n\nGreco-Macedon-Thrace:\n- Updated Greek and Macedonian heritages to be lore-accurate with GoTN\n- Mission tree for Korinth\n- Updated (first) mission tree for Sparta\n- General changes in Greece- reorganized leagues, overhauled Epirus including new parties and a new government type (Some party mechanics are still a WIP)\n- Hegemony decisions for Thebes and Korinth \n- Shattered Thrace change - new Thrace setup, many new nations added\n- Eumenes of Cardia is the 'Archon' of Cardia\n- Thrace pop changes\n- Greek pops added to Pella (Philosophers)\n- Heritages for all new Thracian nations\n- Thrace startup event\n- Greece diplomacy changes\n- Greek Philosophies added - Orphic, Skepticism, and Platonism\n\nAnatolia:\n- Mithradates now rules Kios\n- Gallic colony in Anatolia\n- Lycia pop rework - added more pops\n- Several new nations in Anatolia - Pergamon, Cimmerian nations, Greek colonies\n- Halicarnassus pop rework\n- Lydian road system\n\nIndia:\n- Huge changes to the Indus river - changes in population, religion, and culture\n- Mahajanapada government type for Indian subjects of the Achaemenid Kingdom\n- Complete rework of North Indian setup and lore\n\nGeneral:\n- TONS of new heritages and formables\n- Cimmerian nation added by Colchis\n- General rework of heritages to be accurate to GoTN lore\n- Urartu formable\n- Tier four 'Grand Republic' added\n- Slight adjustments to diplomatic stances and national ideas\n- The 'Tyranny' government type has been fleshed out more- still a WIP\n- Jueyun startup event and Chinese gfx, religion, and cultures added\n- Many things not listed, including formables, mission trees, and more~"