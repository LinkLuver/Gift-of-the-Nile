#Events

me_ourkinion_1_desc:0 "The military programs encouraged by [ROOT.GetCountry.GetRuler.GetName|E], despite opposition from several prominent politicans, have been mostly successful. What once seemed to be an impossibility, has been brought back to the center of Ourkinionian politics-the recapture of [GetProvince('(int32)3515').GetName]."
me_ourkinion_1.a:0 "We will be prepared for the coming struggle"

me_ourkinion_2_desc:0 "Outisde the hills of [GetProvince('(int32)3510').GetName], the Ourkinion hoplites prepare themselves for battle. Soon, they will march to [GetProvince('(int32)3515').GetName], and finally reclaim it.\n\n[ROOT.GetCountry.GetRuler.GetName|E], looks out over his army, himself donning his armor for battle. He mounts his horse, and rides to the front of his soldiers.\n\n'Soldiers! Long have we toiled in this city of hill men, in a strange land, foreign to us #Y Greeks#!. Many of our people have departed to more hospitable cities. But we, the sons of [GetProvince('(int32)3515').GetName], have stayed. For more than a generation our people have survived, clinging to the hope that we may one day return. That day will soon come.' [ROOT.GetCountry.GetRuler.GetName|E], bringing his voice to a shout, exclaimed 'VICTORY IS AT HAND-PRAISE BE TO THE OURKINIONIANS, ONWARD WE MARCH!' The assembled hoplites let out a great cry; a cry of hope."
me_ourkinion_2.a:0 "May Ares guide my spear, and may Nike grant us victory."

me_ourkinion_3_desc:0 "Under the cover of night, our navy and a small force of soldiers moved to secure the strait. They faced little resistance, quickly capturing the port of [GetProvince('(int32)3508').GetName]. By daybreak, the Tibulatians were surprised to discover that their holdings across the strait are now occupied by a foreign force. Not like there is much they can do about it..."
me_ourkinion_3.a:0 "This acquisition will prove vital."
ourkinion_missions_task_3_tt_a:0 "We must have a navy of at least 5 cohorts in the #Y Mare Sardoum#!."

me_ourkinion_4_desc:0 "[GetProvince('(int32)3515').GetName] has proved much more hospitable and welcoming than our old capital of [GetProvince('(int32)3510').GetName]. Many in our senate argue that [GetProvince('(int32)3510').GetName] should be scrapped, and that we can use the building materials to reinvest in our new capital, while the population is relocated to [GetProvince('(int32)3515').GetName]. At a great cost, we could build up [GetProvince('(int32)3510').GetName]. It would serve well as a military site, as it it easily defensible, and would further our control of the eastern side of the island."
me_ourkinion_4.a:0 "Allalia is our home."
me_ourkinion_4.b:0 "It would be foolish to demolish our second home."

me_ourkinion_5_desc:0 "Once before, our navy failed us. With these foundations laid, never again will our ships be the end of us. From now on, no other power will be able to challenge our naval might."
me_ourkinion_5.a:0 "We shall rule the waves."

me_ourkinion_6_desc:0 "A debate has been raging in the halls of the senate. The matter? The native inhabitants of #Y Corsia#!.\n\n A senator named #E Nikomaches#! got up before the senate, and exclaimed "Countrymen, how long have we stayed separate from the barbarians that surround us? Why should we abandon our traditional ways. It is no fluke that we have survived thus far.' #E Euripedes#! got up from his seat and responded 'No longer can we adhere to the archaic traditions of the past! We must change as a people if we wish to make our place in the world.'\n\nIntegrating the #E Corsians#! will surely displease many of our [GetCulture('massalian').GetName] citizens, but we will make great headways with the #E Corsians#!."
me_ourkinion_6.a:0 "We are too stuck in our ways, we will never change."
me_ourkinion_6.b:0 "It seems change is inevitable."

me_ourkinion_7_desc:0 "With the personal direction of [ROOT.GetCountry.GetRuler.GetName|E], our soldiers have begun to learn from [GetCulture('corsian').GetName] warriors. Some of them begrugdingly listened, while others complained outright of being told what to do by a non-Greek. After a few weeks of training, our army has obtained a much better knowledge of the rough Corsican terrain, and the best ways to not only travel in it, but to fight in it. Truly, we will be undefeatable on our own land."
me_ourkinion_7.a:0 "It seems there are advantages to being a barbarian."

me_ourkinion_8_desc:0 "Over a year of feverish investment has come to fruition in [GetProvince('(int32)3515').GetName]. All over the city, each district has had significant improvements. The city stands more glorious than anyone can remember, a testament to the ingenuity of [ROOT.GetCountry.GetName].\n\nOn the day when the construction came to an end, a great parade was held, dedicated to Apollo Delphinos. Citizens swarmed the streets, and sang the praises and victories of [ROOT.GetCountry.GetRuler.GetName|E]. Never before have we known such joy and revelry, this is a turning point for our people."
me_ourkinion_8.a:0 "Alalia will be an example to Greeks, Italics, and Nuragics alike."

me_ourkinion_9_desc:0 "An old, wizened man appears before the senate, during the midst of a debate. [ROOT.GetCountry.GetRuler.GetName|E], curious as to what he has to say, lets him speak. 'Sardo, the god of my fathers, will punish you wicked Greeks for your actions against our people. Invaders of our land, desecrators of our people. Shame be upon you and your descendants for a thousand years!' Upon hearing this, the entire senate erupted into laughter, and the old man was escorted out.\n\n[ROOT.GetCountry.GetRuler.GetName|E] however, did not take this omen so lightly. After he left the senate, he saw a lone black crow nested upon an olive tree, a sign of death. Is the old man to be believed, or was he some superstitious old man?"
me_ourkinion_9.a:0 "Well I certainly believe him. Let's worship their deities, just in case."
me_ourkinion_9.b:0 "Why should we believe the babblings of an old fool."
me_ourkinion_9.c:0 "Our people can co-exist; we will make a sacrifice to the Nuragic gods."

me_ourkinion_10_desc:0 "#E Kyrnos#! is now properly fortified. Our enemies would be hard pressed to crack our line of defenses. The walls of [GetProvince('(int32)3515').GetName] have been significantly improved, with walls being built around the several smaller settlements around the city, the farmlands, and importantly, a wall protecting our port, built in a similar manner to the walls of Piraeus."
me_ourkinion_10.a:0 "Our island is now impenetrable."

me_ourkinion_11_desc:0 "The enlargement of our already magnificent central market has made [GetProvince('(int32)3515').GetName] into a very desirable place to do buisiness. Our cental market stands larger than any [GetCulture('etruscan').GetCultureGroup.GetName|E] one, something that [ROOT.GetCountry.GetCoRuler.GetName|E] made sure to personally inspect when on a visit to [GetProvince('(int32)17').GetName]. While there, [ROOT.GetCountry.GetCoRuler.GetName|E] came up with an ignenious new policy; to lower tariffs. Naturally, the motion passed in the senate, and merchants are flocking to [GetProvince('(int32)3515').GetName] like we have never seen before. Additionally, it seems our recent investments into the city have made it somewhat of a tourist attraction. An unexpected surprise, but welcome nonethless."
me_ourkinion_11.a:0 "The money will roll right in."

me_ourkinion_12.a:0 "Corsica will forever be our home."

me_ourkinion_13_desc:0 "The importance of our religious cults have grown significantly, to the point where we can no longer ignore their demands. The time has come to choose a patron for [GetProvince('(int32)3515').GetName]. There are several prominent cults in the city already- which best represents our nation?"
me_ourkinion_13.a:0 "Apollo Delphinios, the protecter of our sailors."
me_ourkinion_13.b:0 "The ever-popular Herakles."
me_ourkinion_13.c:0 "Hephaistos, the god of smiths."
me_ourkinion_13.d:0 "Asklepios-Merre, the healer of our people."

me_ourkinion_14_desc:0 "The hills outside of [GetProvince('(int32)3515').GetName], despite their rugged nature, have proved suitable for small farms. The fisheries on the coast have also seen an increase in production. Although we will not become a breadbasket like #Y Sicily#!, our people will be fed."
me_ourkinion_14.a:0 "Excellent."

me_ourkinion_15_desc:0 "After many days of deliberation, our advisors have decided on two options. The first one, to invest heavily in the infrastructure of [GetProvince('(int32)3508').GetName], and establish it as a colony city. The second option would be to exploit the natural resourced there. Obsidian is rather rare, and many merchants abroad would be clamoring to get their hands on it. "
me_ourkinion_15.a:0 "Phikaria will become our southern stronghold."
me_ourkinion_15.b:0 "The Obsidian trade will prove bountiful."

me_ourkinion_12_d_desc:0 "The glories of our nation and city have spread far and wide. Only the most backward and ignorant of peoples do not know the tales of our banishment to [GetProvince('(int32)3510').GetName], and our glorious battle for [GetProvince('(int32)3515').GetName]. Everything we have needed to prosper has been found on #E Corsica#!; we have no need fo reliance on foreign powers. No power will ever be able to contest us on our home territory, our many great fortresses and our superior navy will defend against any foe, not to mention our battle-hardened soldiers. Truly, we are a blessed people.\n\n[ROOT.GetCountry.GetRuler.GetName|E] contemplates all these victories and accomplishments, especially about the great city of [GetProvince('(int32)3515').GetName], which shines like a gem amongst rocks. But most of all, [ROOT.GetCountry.GetRuler.GetName|E] ponders the future of [ROOT.GetCountry.GetName]; what is to become of us?"

me_ourkinion_16_title:0 "Woe!"
me_ourkinion_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName|E] looked out of his window, shocked to see a disturbance in the city. [GetProvince('(int32)3515').GetName] has been struck by an earthquake. Several parts of the city, and although not many people were killed, and the eartquake was rather minor, it still stood as a clear sign to the [ROOT.GetCountry.GetAdjective|E] people- the ancient gods of #E Corsia#! are not to be toyed with."
me_ourkinion_16.a:0 "Well, it could have been worse."

me_ourkinion_17_title:0 "A Blessing From Sardo"
me_ourkinion_17_desc:0 "[ROOT.GetCountry.GetRuler.GetName|E] personally supervised the sacrifice to the #E Nuragic#! gods, seeing fit that three young calves were sacrificed in their honor, along with a fit bull. The sky, which had been a dark, gloomy gray, slowly turned a clear, beautiful blue once the sacrifices had been completed. It seems that Sardo has found favor with us, perhaps due to our honorable treatment of the [GetCulture('corsian').GetName] people. At any rate, we should be more careful with our treatment of foreign faiths."
me_ourkinion_17.a:0 "How lucky."

add_deity_to_pantheon:0 "[TARGET_DEITY.GetReligion.GetName] Deity of [TARGET_DEITY.GetDeityCategory.GetName, TARGET_DEITY.GetName], will be added to our #Y Pantheon#!."

