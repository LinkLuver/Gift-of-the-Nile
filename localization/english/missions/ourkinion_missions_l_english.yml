l_english:

ourkinion_missions:0 "Ourkinionian Venegance"
ourkinion_missions_DESCRIPTION:0 "144 years ago, [GetCountry('ALE').GetAdjective).|Y] forces expelled us from our colony of [GetProvince('(int32)3515').GetName|Y]. Since then, our people have eked out a living on the western coast of [GetProvince('(int32)3515').GetArea.GetName|Y]. we have managed to survive for this long, but the future of our people must be decided. The time has come for us to enact our revenge!"
ourkinion_missions_CRITERIA_DESCRIPTION:0 "This mission will be completed when #E Ourkinion#! reclaims #Y Alalia#!, and cements herself as a powerful #Y Massalian#! state."
ourkinion_missions_BUTTON_TOOLTIP:0 "The # Y Ourkinionians#! march forward!."

#Missions

ourkinion_missions_task_1:0 "Preparing For War"
ourkinion_missions_task_1_DESC:0 "We must ready ourselves for conflict."
ourkinion_missions_task_2:0 "On The Corsians"
ourkinion_missions_task_2_DESC:0 "The Corsians are the native inhabitants of this land. Our policy of exclusion and xenophobia may need to be re-examined, if we wish to have a solid control over the entire island."
ourkinion_missions_task_3:0 "Crushing the Tibulatians"
ourkinion_missions_task_3_DESC:0 "To the south lie the Tibulatians, the controller of the Taphros strait. Our strategic interests lie here, we must push them out."
ourkinion_missions_task_4:0 "March On Alalia"
ourkinion_missions_task_4_DESC:0 "Alalia will become ours once again."
ourkinion_missions_task_5:0 "Control Of The Sea"
ourkinion_missions_task_5_DESC:0 "If we wish to secure our newly-established position, we must have the naval power to support us."
ourkinion_missions_task_6:0 "The Matter of Ourkinion"
ourkinion_missions_task_6_DESC:0 "Ourkinion has been a suitable city. Now that our capital is once again Allalia, we must decide what to do with it."
ourkinion_missions_task_7:0 "The Old Gods"
ourkinion_missions_task_7_DESC:0 "Deep within the mountains of Corsica, beings far older than any Greek stir."
ourkinion_missions_task_8:0 "Corsian Knowledge"
ourkinion_missions_task_8_DESC:0 "These rugged people have an intrinsic knowledge of Corsica. We would be wise to learn from them."
ourkinion_missions_task_9:0 "A New Colony"
ourkinion_missions_task_9_DESC:0 "We have become so prosperous, so overflowing with wealth, that we must look beyond Corsica."
ourkinion_missions_task_10:0 "Island Fortress"
ourkinion_missions_task_10_DESC:0 "Whether by land or by sea, our island shall become impenetrable."
ourkinion_missions_task_11:0 "Italian Interests"
ourkinion_missions_task_11_DESC:0 "Our closest trade interests lie with the cities of Etruria, and the Faliscan and Latin cities. We must expand these ties."
ourkinion_missions_task_12:0 "Alalia, Everlasting"
ourkinion_missions_task_12_DESC:0 ""
ourkinion_missions_task_13:0 "Embellishing Alalia"
ourkinion_missions_task_13_DESC:0 "Praise be to Ares, Alalia has come under our control. Now, it must be expanded, and become the shining gemstone of our people."
ourkinion_missions_task_14:0 "Expanding Agriculture"
ourkinion_missions_task_14_DESC:0 "We must learn to be self sufficient- why should we rely on grain from foreign powers?"
ourkinion_missions_task_15:0 "Southern Emporions"
ourkinion_missions_task_15_DESC:0 "The port of Phikaria is well-located. We should seek to establish a proper settlement there, to further our commerce."


#Tooltips

ourkinion_formed_kyrnos:0 "We must have taken the decision to form #Y Kyrnos#!."


me_ourkinion_8_tt:0 "The mission task '#Y $ourkinion_missions_task_8$#!' has now been #G Completed#!!"

me_ourkinion_9_tt:0 "The mission task '#Y $ourkinion_missions_task_9$#!' has now been #G Completed#!!"
ourkinion_task_9_a_tooltip:0 "We must have a navy of at least 25 light or medium ships, and a commander with at least 8 martial."

me_ourkinion_10_tt:0 "The mission task '#Y $ourkinion_missions_task_10$#!' has now been #G Completed#!!"
ourkinion_unlocks_italic_trads_tt:0 "We will unlock the #G Italic military traditions#!."

ourkinion_assimilation:0 "Depending on our choices, we will either #G grow closer#! with the #Y Corsian#! populous, or #R anger#! them."

ourkinion_aleria_war:0 "Completing this mission will cause us to #R declare war on Aleria#!."

ourkinion_corsica_settlement:0 "We will petition the western #Y Greek#! states for settlers."

ourkinion_farm_tt:0 "The province of #Y Corsica#! must have at least three farming settlements built."

ourkinion_fleet:0 "We must have a navy of at least 20 cohorts."

ourkinion_colony:0 "We will look to purchase a colony from our neighbors."

ourkinion_fort_tt:0 "The province of #Y Corsica#! must have at least 3 forts, and the city of #Y Allalia#! must have at least 2."

corsian_gods:0 "The #Y Nuragic#! gods may retaliate against us..."

